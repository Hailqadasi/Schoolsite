 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>إنشاء حساب - Tofolati</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:30px;
text-align:center;
}

input,button{
width:90%;
padding:12px;
margin:8px;
font-size:16px;
}

button{
background:#2196f3;
color:white;
border:0;
border-radius:8px;
}
</style>

</head>

<body>

<h2>إنشاء حساب</h2>

<input id="username" placeholder="اسم المستخدم">

<input id="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="register()">تسجيل</button>

<div id="msg"></div>


<script>

const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";

const SUPABASE_KEY = " eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dHZpbnV5bmthdHJsYnJwbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3MzgsImV4cCI6MjEwMDU0OTczOH0.QLqDKJD9xwZVWLztGbFzTkUPfHp-TEGElNJ12I9wow0  ";


const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function register(){

let username =
document.getElementById("username").value;

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;


let msg=document.getElementById("msg");


msg.innerHTML="جاري التسجيل...";


const {data,error}=await supabaseClient.auth.signUp({
email:email,
password:password
});


if(error){
msg.innerHTML=error.message;
return;
}


const user=data.user;


const {error:profileError}=await supabaseClient
.from("profiles")
.insert([
{
id:user.id,
username:username
}
]);


if(profileError){
msg.innerHTML=profileError.message;
return;
}


msg.innerHTML="تم إنشاء الحساب بنجاح ✅";


}

</script>

</body>
</html>
