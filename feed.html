 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tofolati</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:15px;
}
.time{
    color:#777;
    font-size:13px;
    margin-top:3px;
}
.header{
display:flex;
justify-content:space-between;
align-items:center;
background:white;
padding:12px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.logo{
font-size:24px;
font-weight:bold;
color:#2196f3;
}

.icons button{
width:45px;
height:45px;
margin-right:8px;
border:none;
border-radius:50%;
background:#f0f2f5;
font-size:20px;
cursor:pointer;
}

.post{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.name{
    font-weight:bold;
    font-size:18px;
}

.post img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

.text{
    margin-top:10px;
    font-size:16px;
}

.likes{
    margin-top:10px;
}

.comments{
    margin-top:15px;
}

.comments input{
    width:70%;
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
}

.comments button{
    padding:8px;
    border:0;
    border-radius:8px;
    background:#2196f3;
    color:white;
}
</style>
</head>

<body>
<div class="header">
<div class="logo">🌸 Tofolati</div>
<div class="icons">
<button onclick="alert('البحث قريبًا')">🔍</button>
<button onclick="location.href='upload.html'">➕</button>
<button onclick="alert('الملف الشخصي قريبًا')">👤</button>
</div>
</div>

<div id="posts"></div>

<script>
const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dHZpbnV5bmthdHJsYnJwbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3MzgsImV4cCI6MjEwMDU0OTczOH0.QLqDKJD9xwZVWLztGbFzTkUPfHp-TEGElNJ12I9wow0";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// دالة لعرض التعليقات الخاصة بمنشور معين
async function loadComments(postId) {
    const { data, error } = await supabaseClient
        .from("comments")
        .select("*")
        .eq("post_id", postId)
        .order("id", { ascending: true });

    const commentsContainer = document.getElementById("comments-" + postId);
    if (error) {
        commentsContainer.innerHTML = "خطأ في تحميل التعليقات";
        return;
    }

    if (data.length === 0) {
        commentsContainer.innerHTML = "";
        return;
    }

    let html = "<br><hr>";
    data.forEach(comment => {
        html += `
            <div style="margin-top:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                <strong>${comment.user_name || 'مستخدم'}</strong>
                <span style="color:#777; font-size:12px; margin-right:10px;">${new Date(comment.timestamp).toLocaleString("ar")}</span>
                <div>${comment.text}</div>
            </div>
        `;
    });
    commentsContainer.innerHTML = html;
}

async function loadPosts(){
    const {data, error} = await supabaseClient
        .from("posts")
        .select("*")
        .order("id", {ascending: false});

    if(error){
        document.getElementById("posts").innerHTML = "خطأ في تحميل المنشورات: " + error.message;
        return;
    }

    let html = "";
    for (const post of data) {
        html += `
        <div class="post">
            <div class="name">${post.user_name || 'مستخدم'}</div>
            <div class="time">${new Date(post.timestamp).toLocaleString("ar")}</div>
            <div class="text">${post.text || ""}</div>
            ${post.media_url ? `<img src="${post.media_url}" alt="صورة المنشور">` : ''}
            <div class="likes">
                <button onclick="likePost(${post.id})">❤️</button>
                <span id="likes-${post.id}">${post.likes || 0}</span>
                إعجاب
            </div>
            <div class="comments">
                <input id="comment-${post.id}" placeholder="اكتب تعليقًا...">
                <button onclick="addComment(${post.id})">إرسال</button>
            </div>
            <div id="comments-${post.id}"></div>
        </div>
        `;
    }

    document.getElementById("posts").innerHTML = html;

    // تحميل التعليقات بعد عرض المنشورات
    for (const post of data) {
        await loadComments(post.id);
    }
}

loadPosts();

async function likePost(id){
    const {data:{session}} = await supabaseClient.auth.getSession();

    if(!session){
        alert("يجب تسجيل الدخول");
        return;
    }

    const userId = session.user.id;

    const {data:post,error:getError} = await supabaseClient
        .from("posts")
        .select("likes, liked_by")
        .eq("id",id)
        .single();

    if(getError){
        alert(getError.message);
        return;
    }

    let likedBy = post.liked_by || [];

    if(likedBy.includes(userId)){
        alert("لقد أعجبت بهذا المنشور سابقًا");
        return;
    }

    likedBy.push(userId);

    const newLikes = (post.likes || 0) + 1;

    const {error:updateError} = await supabaseClient
        .from("posts")
        .update({
            likes:newLikes,
            liked_by:likedBy
        })
        .eq("id",id);

    if(updateError){
        alert(updateError.message);
        return;
    }

    document.getElementById("likes-"+id).innerHTML = newLikes;
}

async function addComment(postId){
    const input = document.getElementById("comment-" + postId);
    const text = input.value.trim();

    if(!text){
        alert("اكتب تعليقًا أولًا");
        return;
    }

    const {data:{session}} = await supabaseClient.auth.getSession();

    if(!session){
        alert("يجب تسجيل الدخول");
        return;
    }

    const user = session.user;

    // جلب اسم المستخدم
    const {data:profile, error:profileError} = await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();

    if(profileError){
        alert("خطأ في جلب بيانات المستخدم: " + profileError.message);
        return;
    }

    // حفظ التعليق
    const {data, error} = await supabaseClient
        .from("comments")
        .insert({

post_id: postId,

user_id: user.id,

user_name: profile.username,

text: text,

timestamp: Date.now()

})
        .select();

    if(error){
        alert("خطأ في حفظ التعليق: " + error.message);
        return;
    }

    alert("تم إضافة التعليق ✅");
    input.value = "";

    // إعادة تحميل التعليقات لهذا المنشور
    await loadComments(postId);
}
</script>
</body>
</html>
