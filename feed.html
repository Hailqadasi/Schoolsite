 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tofolati</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    margin:0;
    padding:15px;
}
.time{
    color:#777;
    font-size:13px;
    margin-top:3px;
}
.header{
display:flex;
justify-content:space-between;
align-items:center;
background:white;
padding:12px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.logo{
font-size:24px;
font-weight:bold;
color:#2196f3;
}

.icons button{
width:45px;
height:45px;
margin-right:8px;
border:none;
border-radius:50%;
background:#f0f2f5;
font-size:20px;
cursor:pointer;
}

.post{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.name{
    font-weight:bold;
    font-size:18px;
}

.post img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

.text{
    margin-top:10px;
    font-size:16px;
}

.likes{
    margin-top:10px;
}
</style>
</head>

<body>
<div class="header">
<div class="logo">🌸 Tofolati</div>
<div class="icons">
<button onclick="alert('البحث قريبًا')">🔍</button>
<button onclick="location.href='upload.html'">➕</button>
<button onclick="alert('الملف الشخصي قريبًا')">👤</button>
</div>
</div>

<div id="posts"></div>

<script>
const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dHZpbnV5bmthdHJsYnJwbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3MzgsImV4cCI6MjEwMDU0OTczOH0.QLqDKJD9xwZVWLztGbFzTkUPfHp-TEGElNJ12I9wow0";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadPosts(){
    const {data, error} = await supabaseClient
        .from("posts")
        .select("*")
        .order("id", {ascending: false});

    if(error){
        document.getElementById("posts").innerHTML = error.message;
        return;
    }

    let html = "";
    data.forEach(post => {
        html += `
        <div class="post">
            <div class="name">
${post.user_name}
</div>

<div class="time">
${new Date(post.timestamp).toLocaleString("ar")}
</div>
            <div class="text">${post.text || ""}</div>
            <img src="${post.media_url}" alt="صورة المنشور">
            <div class="likes">
<button onclick="likePost(${post.id})">
❤️
</button>

<span id="likes-${post.id}">
${post.likes || 0}
</span>
إعجاب
</div>
       
    };
    document.getElementById("posts").innerHTML = html;
};

loadPosts();
function likePost(id){

alert("تم الضغط على إعجاب للمنشور رقم: " + id);

}
</script>
</body>
</html>
