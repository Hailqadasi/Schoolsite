 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    margin:0;
    padding:15px;
}

.post{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.name{
    font-weight:bold;
    font-size:18px;
}

.post img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

.text{
    margin-top:10px;
    font-size:16px;
}

.likes{
    margin-top:10px;
}
</style>

</head>

<body>

<h2>Tofolati</h2>

<div id="posts"></div>


<script>

const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";

const SUPABASE_KEY = "  eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dHZpbnV5bmthdHJsYnJwbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3MzgsImV4cCI6MjEwMDU0OTczOH0.QLqDKJD9xwZVWLztGbFzTkUPfHp-TEGElNJ12I9wow0  ";


const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function loadPosts(){

const {data,error}=await supabaseClient
.from("posts")
.select("*")
.order("id",{ascending:false});


if(error){
document.getElementById("posts").innerHTML=
error.message;
return;
}


let html="";


data.forEach(post=>{

html+=`

<div class="post">

<div class="name">
${post.user_name}
</div>


<div class="text">
${post.text || ""}
</div>


<img src="${post.media_url}">


<div class="likes">
❤️ ${post.likes || 0}
</div>


</div>

`;

});


document.getElementById("posts").innerHTML=html;


}


loadPosts();


</script>

</body>
</html>
