 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tofolati</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:15px;
}
.time{
    color:#777;
    font-size:13px;
    margin-top:3px;
}
.header{
display:flex;
justify-content:space-between;
align-items:center;
background:white;
padding:12px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.comment{
    background:#f8f8f8;
    padding:8px;
    margin-top:8px;
    border-radius:8px;
    text-align:right;
}
.logo{
font-size:24px;
font-weight:bold;
color:#2196f3;
}
.comment-time{
    font-size:12px;
    color:#777;
    margin:4px 0 6px 0;
}
.icons button{
width:45px;
height:45px;
margin-right:8px;
border:none;
border-radius:50%;
background:#f0f2f5;
font-size:20px;
cursor:pointer;
}

.post{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.name{
    font-weight:bold;
    font-size:18px;
}

.post img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

.text{
    margin-top:10px;
    font-size:16px;
}

.likes{
    margin-top:10px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.likes button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 0 5px;
}

.comments{
    margin-top:15px;
}

.comments input{
    width:70%;
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
}

.comments button{
    padding:8px 15px;
    border:0;
    border-radius:8px;
    background:#2196f3;
    color:white;
    cursor: pointer;
}

.delete-comment-btn {
    background: none;
    border: none;
    color: red;
    cursor: pointer;
    font-size: 14px;
    margin-right: 10px;
}
</style>
</head>

<body>
<div class="header">
<div class="logo">🌸 Tofolati</div>
<div class="icons">
<button onclick="alert('البحث قريبًا')">🔍</button>
<button onclick="location.href='upload.html'">➕</button>
<button onclick="location.href='profile.html'">👤</button>
</div>
</div>
<div id="posts"></div>

<script>
const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dHZpbnV5bmthdHJsYnJwbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3MzgsImV4cCI6MjEwMDU0OTczOH0.QLqDKJD9xwZVWLztGbFzTkUPfHp-TEGElNJ12I9wow0";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function getCurrentUser() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    return session ? session.user : null;
}

// دالة لعرض التعليقات الخاصة بمنشور معين
async function loadComments(postId) {
    const currentUser = await getCurrentUser();
    const { data, error } = await supabaseClient
        .from("comments")
        .select("*")
        .eq("post_id", postId)
        .order("timestamp", { ascending: true });

    const commentsContainer = document.getElementById("comments-" + postId);
    if (error) {
        commentsContainer.innerHTML = "خطأ في تحميل التعليقات";
        console.error("Error loading comments:", error);
        return;
    }

    if (!data || data.length === 0) {
        commentsContainer.innerHTML = "";
        return;
    }

    let html = "<br><hr>";

    data.forEach(comment => {
        const isOwner = currentUser && comment.user_id === currentUser.id;
        html += `
            <div style="margin-top:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                <strong>${comment.user_name || 'مستخدم'}</strong>
                <span style="color:#777; font-size:12px; margin-right:10px;">
                ${new Date(comment.timestamp).toLocaleString("ar")}
                </span>
                ${isOwner ? `<button class="delete-comment-btn" onclick="deleteComment(${comment.id}, ${postId})">🗑 حذف</button>` : ""}
                <div>${comment.text}</div>
            </div>
        `;
    });

    commentsContainer.innerHTML = html;
}

async function loadPosts() {
    const { data, error } = await supabaseClient
        .from("posts")
        .select("*")
        .order("id", { ascending: false });

    if (error) {
        alert("خطأ في تحميل المنشورات: " + error.message);
        console.error("Error loading posts:", error);
        return;
    }

    let html = "";
    for (const post of data) {
        const likeCount = post.likes || 0;
        html += `
        <div class="post" id="post-${post.id}">
            <div class="name">${post.user_name || 'مستخدم'}</div>
            <div class="time">${new Date(post.timestamp).toLocaleString("ar")}</div>
            <div class="text">${post.text || ""}</div>
            ${post.media_url ? `<img src="${post.media_url}" alt="صورة المنشور">` : ''}
            <div class="likes">
                <button onclick="toggleLike(${post.id})" id="like-btn-${post.id}">❤️</button>
                <span id="likes-${post.id}">${likeCount}</span>
                إعجاب
            </div>
            <div class="comments">
                <input id="comment-${post.id}" placeholder="اكتب تعليقًا...">
                <button onclick="addComment(${post.id})">إرسال</button>
            </div>
            <div id="comments-${post.id}"></div>
        </div>
        `;
    }

    document.getElementById("posts").innerHTML = html;

    // تحميل التعليقات بعد عرض المنشورات
    for (const post of data) {
        await loadComments(post.id);
    }
}

// دالة تبديل الإعجاب/إلغاء الإعجاب
async function toggleLike(postId) {
    const user = await getCurrentUser();
    if (!user) {
        alert("يجب تسجيل الدخول أولاً");
        return;
    }

    const userId = user.id;

    // جلب المنشور الحالي
    const { data: post, error: getError } = await supabaseClient
        .from("posts")
        .select("likes, liked_by")
        .eq("id", postId)
        .single();

    if (getError) {
        alert("حدث خطأ أثناء جلب بيانات المنشور");
        console.error("Error fetching post:", getError);
        return;
    }

    let likedBy = post.liked_by || [];
    let newLikes = post.likes || 0;
    let isLiked = likedBy.includes(userId);

    if (isLiked) {
        // إلغاء الإعجاب
        likedBy = likedBy.filter(id => id !== userId);
        newLikes--;
    } else {
        // إعجاب
        likedBy.push(userId);
        newLikes++;
    }

    // تحديث قاعدة البيانات
    const { error: updateError } = await supabaseClient
        .from("posts")
        .update({
            likes: newLikes,
            liked_by: likedBy
        })
        .eq("id", postId);

    if (updateError) {
        alert("حدث خطأ أثناء تحديث الإعجاب");
        console.error("Error updating likes:", updateError);
        return;
    }

    // تحديث الواجهة
    document.getElementById("likes-" + postId).innerHTML = newLikes;
    // يمكنك تغيير لون الزر هنا إذا أردت
}

// دالة إضافة تعليق
async function addComment(postId) {
    const input = document.getElementById("comment-" + postId);
    const text = input.value.trim();

    if (!text) {
        alert("اكتب تعليقًا أولًا");
        return;
    }

    const user = await getCurrentUser();
    if (!user) {
        alert("يجب تسجيل الدخول");
        return;
    }

    // جلب اسم المستخدم
    const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .single();

    if (profileError) {
        alert("خطأ في جلب بيانات المستخدم: " + profileError.message);
        console.error("Error fetching profile:", profileError);
        return;
    }

    // حفظ التعليق
    const { error } = await supabaseClient
        .from("comments")
        .insert({
            post_id: postId,
            user_id: user.id,
            user_name: profile.username,
            text: text,
            timestamp: Date.now()
        });

    if (error) {
        alert("خطأ في حفظ التعليق: " + error.message);
        console.error("Error adding comment:", error);
        return;
    }

    input.value = "";
    // إعادة تحميل التعليقات لهذا المنشور
    await loadComments(postId);
}

// دالة حذف التعليق
async function deleteComment(commentId, postId) {
    if (!confirm("هل أنت متأكد من حذف هذا التعليق؟")) {
        return;
    }

    const { error } = await supabaseClient
        .from("comments")
        .delete()
        .eq("id", commentId);

    if (error) {
        alert("خطأ في حذف التعليق: " + error.message);
        console.error("Error deleting comment:", error);
        return;
    }

    // إعادة تحميل التعليقات لهذا المنشور
    await loadComments(postId);
}

// تحميل المنشورات عند بدء التشغيل
loadPosts();
</script>
</body>
</html>
