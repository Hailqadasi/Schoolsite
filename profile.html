 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الملف الشخصي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            max-width: 600px;
            margin: 0 auto 20px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            border: 3px solid #4CAF50;
        }
        .name {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }
        .email {
            color: #666;
            margin-top: 5px;
        }
        .stats {
            margin-top: 20px;
            font-size: 18px;
        }
        .post {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            margin: 15px auto;
            max-width: 600px;
            text-align: right;
        }
        .post .time {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .post .text {
            font-size: 16px;
            margin: 10px 0;
        }
        .post img {
            width: 100%;
            border-radius: 10px;
            margin: 10px 0;
            max-height: 400px;
            object-fit: cover;
        }
        #myPosts {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 30px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        input[type="file"] {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <img id="avatar" class="avatar" src="https://via.placeholder.com/120">
        <br><br>
        <input id="avatarFile" type="file" accept="image/*" onchange="previewAvatar(event)">
        <br><br>
        <button id="uploadBtn" onclick="uploadAvatar()">حفظ الصورة</button>
        <div id="uploadStatus"></div>
        
        <div id="username" class="name">...</div>
        <div id="email" class="email">...</div>
        <div class="stats">📝 عدد المنشورات: <span id="postsCount">0</span></div>
    </div>

    <h2>منشوراتي</h2>
    <div id="myPosts"></div>

    <script>
        // ===== تهيئة Supabase =====
        const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9....wow0";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        // ===== دالة تحميل الملف الشخصي =====
        async function loadProfile() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();

                if (!session) {
                    alert("يجب تسجيل الدخول");
                    location.href = "login.html";
                    return;
                }

                const user = session.user;

                // عرض البريد الإلكتروني
                document.getElementById("email").innerHTML = user.email;

                // جلب اسم المستخدم من جدول profiles
                const { data: profile, error: profileError } = await supabaseClient
                    .from("profiles")
                    .select("username, avatar_url")
                    .eq("id", user.id)
                    .single();

                if (profileError) {
                    console.error("خطأ في جلب الملف الشخصي:", profileError);
                    document.getElementById("username").innerHTML = "مستخدم";
                } else {
                    document.getElementById("username").innerHTML = profile.username || "مستخدم";
                    if (profile.avatar_url) {
                        document.getElementById("avatar").src = profile.avatar_url;
                    }
                }

                // حساب عدد المنشورات
                const { count, error: countError } = await supabaseClient
                    .from("posts")
                    .select("*", { count: "exact", head: true })
                    .eq("user_id", user.id);

                if (countError) {
                    console.error("خطأ في حساب المنشورات:", countError);
                    document.getElementById("postsCount").innerHTML = "0";
                } else {
                    document.getElementById("postsCount").innerHTML = count || 0;
                }

                // تحميل المنشورات
                await loadMyPosts();

            } catch (error) {
                console.error("خطأ عام:", error);
                alert("حدث خطأ أثناء تحميل البيانات");
            }
        }

        // ===== دالة تحميل منشورات المستخدم =====
        async function loadMyPosts() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();

                if (!session) {
                    return;
                }

                const user = session.user;

                const { data, error } = await supabaseClient
                    .from("posts")
                    .select("*")
                    .eq("user_id", user.id)
                    .order("id", { ascending: false });

                if (error) {
                    console.error("خطأ في جلب المنشورات:", error);
                    document.getElementById("myPosts").innerHTML = `<div class="error">حدث خطأ في تحميل المنشورات</div>`;
                    return;
                }

                if (!data || data.length === 0) {
                    document.getElementById("myPosts").innerHTML = "<p class='loading'>لا توجد منشورات حتى الآن</p>";
                    return;
                }

                let html = "";
                data.forEach(post => {
                    html += `
                        <div class="post">
                            <div class="time">📅 ${new Date(post.timestamp).toLocaleString("ar")}</div>
                            <div class="text">${post.text || ""}</div>
                            ${post.media_url ? `<img src="${post.media_url}" alt="صورة المنشور" loading="lazy">` : ""}
                            <div>❤️ ${post.likes || 0}</div>
                        </div>
                    `;
                });

                document.getElementById("myPosts").innerHTML = html;

            } catch (error) {
                console.error("خطأ في تحميل المنشورات:", error);
                document.getElementById("myPosts").innerHTML = "<div class='error'>حدث خطأ في تحميل المنشورات</div>";
            }
        }

        // ===== دالة معاينة الصورة قبل الرفع =====
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // التحقق من حجم الصورة (حد أقصى 5 ميجابايت)
            if (file.size > 5 * 1024 * 1024) {
                alert("حجم الصورة كبير جداً. الحد الأقصى 5 ميجابايت.");
                event.target.value = '';
                return;
            }
            
            // التحقق من نوع الملف
            if (!file.type.startsWith('image/')) {
                alert("الرجاء اختيار ملف صورة فقط.");
                event.target.value = '';
                return;
            }
            
            document.getElementById("avatar").src = URL.createObjectURL(file);
        }

        // ===== دالة رفع الصورة إلى Supabase Storage (نسخة واحدة فقط) =====
        async function uploadAvatar() {
            const fileInput = document.getElementById('avatarFile');
            const file = fileInput.files[0];
            const statusDiv = document.getElementById('uploadStatus');
            const uploadBtn = document.getElementById('uploadBtn');

            // التحقق من اختيار ملف
            if (!file) {
                alert('الرجاء اختيار صورة أولاً.');
                return;
            }

            // تعطيل الزر أثناء الرفع
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'جاري الرفع...';
            statusDiv.innerHTML = '';

            try {
                // التحقق من جلسة المستخدم
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    alert("يجب تسجيل الدخول");
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'حفظ الصورة';
                    return;
                }

                const user = session.user;
                
                // إنشاء مسار فريد للصورة
                const fileExt = file.name.split('.').pop();
                const fileName = `${user.id}/${Date.now()}.${fileExt}`;

                // 1. رفع الملف إلى التخزين
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('avatars')
                    .upload(fileName, file, {
                        cacheControl: '3600',
                        upsert: true
                    });

                if (uploadError) {
                    console.error("خطأ في رفع الصورة:", uploadError);
                    statusDiv.innerHTML = `<div class="error">❌ فشل رفع الصورة: ${uploadError.message}</div>`;
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'حفظ الصورة';
                    return;
                }

                // 2. الحصول على الرابط العام
                const { data: { publicUrl } } = supabaseClient.storage
                    .from('avatars')
                    .getPublicUrl(fileName);

                // 3. تحديث قاعدة البيانات
                const { error: updateError } = await supabaseClient
                    .from('profiles')
                    .update({ avatar_url: publicUrl })
                    .eq('id', user.id);

                if (updateError) {
                    console.error("خطأ في تحديث قاعدة البيانات:", updateError);
                    statusDiv.innerHTML = `<div class="error">❌ تم رفع الصورة ولكن فشل تحديث الملف الشخصي: ${updateError.message}</div>`;
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = 'حفظ الصورة';
                    return;
                }

                // 4. تحديث الصورة المعروضة
                document.getElementById('avatar').src = publicUrl;
                statusDiv.innerHTML = `<div class="success">✅ تم تحديث الصورة بنجاح!</div>`;
                
                // إفراغ حقل الملف
                fileInput.value = '';

            } catch (error) {
                console.error("حدث خطأ غير متوقع:", error);
                statusDiv.innerHTML = `<div class="error">❌ حدث خطأ غير متوقع: ${error.message}</div>`;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'حفظ الصورة';
            }
        }

        // ===== تنفيذ التحميل عند فتح الصفحة =====
        loadProfile();
    </script>
</body>
</html>
