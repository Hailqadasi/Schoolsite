 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>الملف الشخصي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:15px;
text-align:center;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
background:#ddd;
}

.name{
font-size:24px;
font-weight:bold;
margin-top:15px;
}

.email{
color:#666;
margin-top:5px;
}

.stats{
margin-top:20px;
font-size:18px;
}

</style>

</head>

<body>

<div class="card">

<img id="avatar" class="avatar" src="https://via.placeholder.com/120">

<div id="username" class="name">
...
</div>

<div id="email" class="email">
...
</div>

<div class="stats">

📝 عدد المنشورات:
<span id="postsCount">0</span>

</div>

</div>
<script>

const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dHZpbnV5bmthdHJsYnJwbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3MzgsImV4cCI6MjEwMDU0OTczOH0.QLqDKJD9xwZVWLztGbFzTkUPfHp-TEGElNJ12I9wow0";

const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

loadProfile();

async function loadProfile(){

const {data:{session}} =
await supabaseClient.auth.getSession();

if(!session){
    alert("يجب تسجيل الدخول");
    location.href="login.html";
    return;
}

const user = session.user;


// عرض البريد الإلكتروني

document.getElementById("email").innerHTML =
user.email;


// جلب اسم المستخدم

const {data:profile,error} =
await supabaseClient
.from("profiles")
.select("username")
.eq("id",user.id)
.single();


if(error){
    alert(error.message);
    return;
}


document.getElementById("username").innerHTML =
profile.username;

}
// حساب عدد المنشورات

const {count,error:countError} = await supabaseClient
.from("posts")
.select("*",{count:"exact",head:true})
.eq("user_id",user.id);


if(countError){
    alert(countError.message);
    return;
}


document.getElementById("postsCount").innerHTML =
count || 0;
</script>
</body>
</html>
