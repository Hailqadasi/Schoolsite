 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>إنشاء منشور - Tofolati</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    margin:0;
    padding:15px;
}

.header{
    background:white;
    padding:15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header h2{
    margin:0;
    color:#2196f3;
}

.back{
    background:#eee;
    border:0;
    border-radius:50%;
    width:40px;
    height:40px;
    font-size:20px;
}

.box{
    background:white;
    margin-top:15px;
    padding:15px;
    border-radius:15px;
}

.user{
    font-weight:bold;
    font-size:18px;
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:120px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    font-size:16px;
    resize:none;
}

input{
    margin-top:15px;
}

#preview{
    width:100%;
    margin-top:15px;
    border-radius:12px;
    display:none;
}

.post-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    background:#2196f3;
    color:white;
    border:0;
    border-radius:10px;
    font-size:18px;
}

</style>

</head>


<body>


<div class="header">

<button class="back" onclick="history.back()">←</button>

<h2>إنشاء منشور</h2>

<div></div>

</div>



<div class="box">


<div class="user" id="username">
جاري تحميل المستخدم...
</div>


<textarea id="postText" placeholder="بماذا تفكر؟"></textarea>

<input id="imageFile" type="file" accept="image/*" onchange="previewImage(event)">


<img id="preview">



<button class="post-btn" onclick="createPost()">
نشر المنشور
</button>


</div>



<script>


function previewImage(event){

let img=document.getElementById("preview");

img.src=URL.createObjectURL(event.target.files[0]);

img.style.display="block";

}

const SUPABASE_URL = "https://zytvinuynkatrlbrpmko.supabase.co";

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5dHZpbnV5bmthdHJsYnJwbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzM3MzgsImV4cCI6MjEwMDU0OTczOH0.QLqDKJD9xwZVWLztGbFzTkUPfHp-TEGElNJ12I9wow0";


const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function loadUser(){

const {data:{session}} = await supabaseClient.auth.getSession();


if(!session){
document.getElementById("username").innerHTML =
"يجب تسجيل الدخول";
return;
}


const {data:profile,error}=await supabaseClient
.from("profiles")
.select("username")
.eq("id",session.user.id)
.single();


if(error){
document.getElementById("username").innerHTML =
error.message;
return;
}

document.getElementById("username").innerHTML =
"👤 " + profile.username;


}
async function createPost(){

let text = document.getElementById("postText").value;

let file = document.getElementById("imageFile").files[0];


const {data:{session}} = await supabaseClient.auth.getSession();


if(!session){
    alert("يجب تسجيل الدخول");
    return;
}


const user = session.user;


// جلب اسم المستخدم

const {data:profile,error:profileError} =
await supabaseClient
.from("profiles")
.select("username")
.eq("id",user.id)
.single();


if(profileError){
    alert(profileError.message);
    return;
}


let imageUrl = "";
let mediaType = null;


// رفع الصورة إذا وجدت

// رفع الصورة إذا وجدت

if(file){

alert("تم اختيار الصورة: " + file.name);

let fileName = Date.now() + "_" + file.name;


const {data:uploadData, error:uploadError} =
await supabaseClient
.storage
.from("images")
.upload(fileName,file);

console.log(uploadData);
console.log(uploadError);


if(uploadError){
    alert(JSON.stringify(uploadError));
    return;
}


alert("تم رفع الصورة إلى Storage بنجاح");


const {data:urlData} =
supabaseClient
.storage
.from("images")
.getPublicUrl(fileName);


imageUrl = urlData.publicUrl;
mediaType = "image";

}
// حفظ المنشور

const {error} =
await supabaseClient
.from("posts")
.insert({

text:text,

media_url:imageUrl,

media_type:mediaType,

user_id:user.id,

user_name:profile.username,

timestamp:Date.now(),

likes:0

});


if(error){

alert(error.message);
return;

}


alert("تم نشر المنشور بنجاح ✅");


window.location.href="feed.html";


}

loadUser();
</script>


</body>

</html>
