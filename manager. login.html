 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول مدير المدرسة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f3f6f9;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:92%;
    max-width:420px;
    background:white;
    padding:30px 25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:55px;
    margin-bottom:5px;
}

h1{
    text-align:center;
    color:#1e3a5f;
    margin:5px 0 8px;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    direction:ltr;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#1e3a5f;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.6;
}

#status{
    margin-top:18px;
    padding:10px;
    border-radius:8px;
    text-align:center;
    display:none;
}

.error{
    background:#ffe5e5;
    color:#b00020;
}

.success{
    background:#e5f7e8;
    color:#16752b;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🏫</div>

    <h1>دخول مدير المدرسة</h1>

    <div class="subtitle">
        نظام النتائج الشهرية
    </div>

    <label for="email">البريد الإلكتروني</label>

    <input
        type="email"
        id="email"
        placeholder="أدخل البريد الإلكتروني"
        autocomplete="username"
    >

    <label for="password">كلمة المرور</label>

    <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
    >

    <button id="loginBtn" onclick="loginManager()">
        🔐 دخول
    </button>

    <div id="status"></div>

</div>


<script>

// ======================================
// إعداد Supabase
// ======================================

const SUPABASE_URL =
"https://ilplwdhwsziuxynvneov.supabase.co";

const SUPABASE_ANON_KEY =
"ضع هنا مفتاح anon الخاص بمشروعك";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// ======================================
// عناصر الصفحة
// ======================================

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const statusBox =
document.getElementById("status");


// ======================================
// إظهار رسالة
// ======================================

function showStatus(message,type){

    statusBox.textContent = message;

    statusBox.className = type;

    statusBox.style.display = "block";
}


// ======================================
// تسجيل الدخول
// ======================================

async function loginManager(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email || !password){

        showStatus(
            "يرجى إدخال البريد الإلكتروني وكلمة المرور",
            "error"
        );

        return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent = "جاري تسجيل الدخول...";

    showStatus(
        "جاري التحقق من البيانات...",
        "success"
    );


    try{

        // ----------------------------------
        // تسجيل الدخول بواسطة Supabase Auth
        // ----------------------------------

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "تعذر الحصول على بيانات المستخدم"
            );

        }


        const userId =
            data.user.id;


        // ----------------------------------
        // البحث عن المدرسة المرتبطة بالمدير
        // ----------------------------------

        const {
            data: manager,
            error: managerError
        } = await supabaseClient

            .from("school_managers")

            .select(`
                user_id,
                school_id,
                schools (
                    id,
                    school_name
                )
            `)

            .eq("user_id", userId)

            .maybeSingle();


        if(managerError){

            throw managerError;

        }


        // ----------------------------------
        // المدير غير مربوط بأي مدرسة
        // ----------------------------------

        if(!manager){

            await supabaseClient.auth.signOut();

            throw new Error(
                "هذا الحساب غير مرتبط بمدرسة."
            );

        }


        // ----------------------------------
        // التحقق من بيانات المدرسة
        // ----------------------------------

        if(
            !manager.school_id ||
            !manager.schools
        ){

            await supabaseClient.auth.signOut();

            throw new Error(
                "لم يتم العثور على بيانات المدرسة المرتبطة بهذا الحساب."
            );

        }


        // ----------------------------------
        // حفظ بيانات المدير والمدرسة
        // ----------------------------------

        sessionStorage.setItem(
            "manager_user_id",
            manager.user_id
        );

        sessionStorage.setItem(
            "manager_school_id",
            manager.school_id
        );

        sessionStorage.setItem(
            "manager_school_name",
            manager.schools.school_name
        );


        // ----------------------------------
        // نجاح الدخول
        // ----------------------------------

        showStatus(
            "تم تسجيل الدخول بنجاح...",
            "success"
        );


        // الانتقال لاحقًا إلى صفحة الإدارة
        setTimeout(function(){

            window.location.href =
                "manager.html";

        },800);


    }catch(error){

        console.error(error);

        showStatus(
            error.message ||
            "حدث خطأ أثناء تسجيل الدخول",
            "error"
        );

        loginBtn.disabled = false;

        loginBtn.textContent = "🔐 دخول";

    }

}


// ======================================
// الضغط على Enter
// ======================================

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loginManager();

        }

    }
);


// ======================================
// التحقق من وجود جلسة سابقة
// ======================================

async function checkExistingSession(){

    const {
        data
    } = await supabaseClient.auth.getSession();


    if(
        data &&
        data.session &&
        sessionStorage.getItem("manager_school_id")
    ){

        window.location.href =
            "manager.html";

    }

}

checkExistingSession();

</script>

</body>
</html>
