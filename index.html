<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوقني - منصة الإعلانات</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .logo {
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        .search-box button {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: #ff6b35;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #e55a2b;
            transform: scale(1.05);
        }

        /* ===== CATEGORIES ===== */
        .categories {
            flex: 1;
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .categories h1 {
            text-align: center;
            font-size: 36px;
            color: #1a2a6c;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            transition: 0.4s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* ألوان الأزرار */
        .car { background: linear-gradient(135deg, #667eea, #764ba2); }
        .clothes { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .products { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .realestate { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .food { background: linear-gradient(135deg, #fa709a, #fee140); }
        .construction { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 20px;
            background: #1a2a6c;
            color: white;
            margin-top: auto;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .search-box {
                max-width: 100%;
            }
            .categories h1 {
                font-size: 26px;
            }
            .card {
                min-height: 130px;
                font-size: 18px;
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">🛒 سوقني</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث في جميع الإعلانات...">
            <button onclick="searchAll()">🔍</button>
        </div>
    </header>

    <!-- ===== الأزرار ===== -->
    <section class="categories">
        <h1>📌 اختر القسم المناسب</h1>
        <div class="grid">
            <a href="cars.html" class="card car">🚗 بيع وشراء سيارات</a>
            <a href="clothes.html" class="card clothes">👕 ملابس</a>
            <a href="products.html" class="card products">📦 منتجات عامة</a>
            <a href="realestate.html" class="card realestate">🏠 عقارات</a>
            <a href="food.html" class="card food">🍎 مواد غذائية</a>
            <a href="construction.html" class="card construction">🧱 مواد بناء</a>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>© 2026 سوقني - جميع الحقوق محفوظة</p>
    </footer>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== البحث =====
        function searchAll() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                alert('📝 الرجاء كتابة كلمة للبحث');
                return;
            }
            // التنبيه: البحث سيتم داخل الصفحات المفتوحة، لكن نوجه المستخدم
            alert('🔍 سيتم البحث عن: "' + query + '"\n\nملاحظة: افتح أي قسم واستخدم البحث الموجود فيه.');
        }

        // البحث عند الضغط على Enter
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('searchInput');
            if (input) {
                input.addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') {
                        searchAll();
                    }
                });
            }
        });

        // ===== تأثير إضافي: تحية =====
        console.log('🛒 مرحباً بك في سوقني - منصة الإعلانات العربية');
    </script>

</body>
</html>
