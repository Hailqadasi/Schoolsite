 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#082c5c">
<title>المكتبة المدرسية اليمنية</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef3fb;color:#102b50}
header{background:linear-gradient(135deg,#06234d,#12477f);color:#fff;padding:24px 16px 20px;border-bottom:4px solid #e5b83f;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.logo{font-size:44px}
h1{font-size:clamp(22px,5vw,30px);margin:0;color:#f4c84a}
header p{margin:8px 0 0;color:#e6efff}
main{max-width:760px;margin:auto;padding:14px 12px 90px}
.search{display:flex;gap:8px;background:#fff;border:1px solid #c9d8ee;border-radius:22px;padding:8px 12px;margin:0 0 14px;box-shadow:0 3px 8px #163c6714}
.search input{width:100%;border:0;outline:0;background:transparent;font-size:16px;padding:6px;color:#15345e}
.grades{display:grid;gap:9px}
.grade{display:flex;align-items:center;gap:12px;text-align:right;width:100%;border:1px solid #c3d5f1;background:linear-gradient(120deg,#fff,#e5efff);border-radius:17px;padding:11px 13px;box-shadow:0 2px 4px #173c6612;cursor:pointer;color:#122f58}
.grade:active{transform:scale(.99)}
.grade .book{font-size:32px;min-width:48px;text-align:center}
.grade .details{flex:1}
.grade strong{font-size:18px;display:block}
.grade small{display:block;color:#405a7c;margin-top:4px}
.grade .arrow{background:#0a3a70;color:white;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:23px}
.empty{display:none;text-align:center;padding:28px;color:#60718b}
nav{position:fixed;bottom:0;left:0;right:0;background:#062653;color:#fff;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));border-top:2px solid #e3b93c}
nav button{border:0;background:none;color:#dbe7f7;font-size:12px;padding:4px 8px;cursor:pointer}
nav button span{display:block;font-size:22px;margin-bottom:3px}
nav button.active{color:#f4c84a}
.notice{margin-top:12px;padding:10px;background:#fff;border-radius:12px;color:#49617f;font-size:13px;text-align:center}
@media(min-width:600px){.grade strong{font-size:20px}.grade{padding:14px 18px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">📚</div><div><h1>المكتبة المدرسية اليمنية</h1><p>مناهج التعليم اليمني</p></div><div class="logo">🇾🇪</div></div>
</header>
<main>
  <label class="search" aria-label="بحث في الصفوف"><span>🔎</span><input id="search" placeholder="ابحث عن صف دراسي..." autocomplete="off"></label>
  <section class="grades" id="grades">
    <button class="grade" data-grade="الثالث الثانوي"><span class="book">🎓📚</span><span class="details"><strong>الثالث الثانوي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الثاني الثانوي"><span class="book">🎓📚</span><span class="details"><strong>الثاني الثانوي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الأول الثانوي"><span class="book">🎓📚</span><span class="details"><strong>الأول الثانوي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="التاسع الأساسي"><span class="book">📚</span><span class="details"><strong>التاسع الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الثامن الأساسي"><span class="book">📚</span><span class="details"><strong>الثامن الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="السابع الأساسي"><span class="book">📚</span><span class="details"><strong>السابع الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="السادس الأساسي"><span class="book">📚</span><span class="details"><strong>السادس الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الخامس الأساسي"><span class="book">📚</span><span class="details"><strong>الخامس الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الرابع الأساسي"><span class="book">📚</span><span class="details"><strong>الرابع الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الثالث الأساسي"><span class="book">📚</span><span class="details"><strong>الثالث الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الثاني الأساسي"><span class="book">📚</span><span class="details"><strong>الثاني الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
    <button class="grade" data-grade="الأول الأساسي"><span class="book">📚</span><span class="details"><strong>الأول الأساسي</strong><small>الكتب والمقررات الدراسية</small></span><span class="arrow">‹</span></button>
  </section>
  <div class="empty" id="empty">لا توجد صفوف مطابقة للبحث.</div>
  <div class="notice">نسخة واجهة تجريبية — سيتم ربط الكتب والمواد بقاعدة Firebase لاحقًا.</div>
</main>
<nav>
  <button data-tab="settings"><span>⚙️</span>الإعدادات</button>
  <button data-tab="downloads"><span>⬇️</span>تنزيلاتي</button>
  <button class="active" data-tab="home"><span>⌂</span>الرئيسية</button>
  <button data-tab="favorites"><span>☆</span>المفضلة</button>
</nav>
<script>
const search = document.getElementById('search');
const cards = [...document.querySelectorAll('.grade')];
const empty = document.getElementById('empty');
search.addEventListener('input', () => {
  const q = search.value.trim();
  let visible = 0;
  cards.forEach(card => {
    const match = card.dataset.grade.includes(q);
    card.style.display = match ? 'flex' : 'none';
    if(match) visible++;
  });
  empty.style.display = visible ? 'none' : 'block';
});
cards.forEach(card => card.addEventListener('click', () => {
  alert('تم اختيار: ' + card.dataset.grade + '\\nسنضيف صفحة المواد لهذا الصف في الخطوة القادمة.');
}));
document.querySelectorAll('nav button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(btn.dataset.tab !== 'home') alert('قسم ' + btn.textContent.trim() + ' سنفعّله في مرحلة لاحقة.');
}));
</script>
</body>
</html>
