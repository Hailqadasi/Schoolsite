<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوقني - منصة الإعلانات</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        header {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 18px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
        }

        .search-box button {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: #ff6b35;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: #e55a2b;
            transform: scale(1.05);
        }

        /* ===== الأقسام - عرض أفقي ===== */
        .categories {
            flex: 1;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .categories h1 {
            text-align: center;
            font-size: 30px;
            color: #1a2a6c;
            margin-bottom: 25px;
        }

        /* عرض أفقي مع لف عند الحاجة */
        .grid {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 5px;
            justify-content: flex-start;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* تنسيق الأزرار - نصف الحجم */
        .card {
            flex: 0 0 auto;
            width: 160px;
            min-height: 90px;
            background: white;
            padding: 15px 10px;
            border-radius: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .card .icon {
            font-size: 28px;
        }

        .card .label {
            font-size: 13px;
            line-height: 1.3;
        }

        /* ألوان الأزرار */
        .car { background: linear-gradient(135deg, #667eea, #764ba2); }
        .clothes { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .products { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .realestate { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .food { background: linear-gradient(135deg, #fa709a, #fee140); }
        .construction { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }

        /* ===== صور الأقسام ===== */
        .section-images {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 15px;
            padding: 20px 5px;
            margin-top: 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .section-img-item {
            flex: 0 0 auto;
            width: 220px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            background: white;
        }

        .section-img-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .section-img-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .section-img-item .img-label {
            text-align: center;
            padding: 8px;
            font-weight: bold;
            color: #1a2a6c;
            background: white;
            font-size: 14px;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 15px;
            background: #1a2a6c;
            color: white;
            margin-top: auto;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 12px 15px;
            }
            .search-box {
                max-width: 100%;
            }
            .logo {
                font-size: 22px;
            }
            .categories h1 {
                font-size: 22px;
            }
            .card {
                width: 130px;
                min-height: 75px;
                padding: 10px 8px;
            }
            .card .icon {
                font-size: 22px;
            }
            .card .label {
                font-size: 11px;
            }
            .section-img-item {
                width: 160px;
            }
            .section-img-item img {
                height: 110px;
            }
        }

        @media (max-width: 480px) {
            .card {
                width: 110px;
                min-height: 65px;
                padding: 8px 5px;
            }
            .card .icon {
                font-size: 18px;
            }
            .card .label {
                font-size: 10px;
            }
            .section-img-item {
                width: 130px;
            }
            .section-img-item img {
                height: 90px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">🛒 سوقني</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث في جميع الإعلانات...">
            <button onclick="searchAll()">🔍</button>
        </div>
    </header>

    <!-- ===== الأزرار (أفقية ومصغرة) ===== -->
    <section class="categories">
        <h1>📌 اختر القسم المناسب</h1>
        
        <div class="grid">
            <a href="cars.html" class="card car">
                <span class="icon">🚗</span>
                <span class="label">سيارات</span>
            </a>
            <a href="clothes.html" class="card clothes">
                <span class="icon">👕</span>
                <span class="label">ملابس</span>
            </a>
            <a href="products.html" class="card products">
                <span class="icon">📦</span>
                <span class="label">منتجات</span>
            </a>
            <a href="realestate.html" class="card realestate">
                <span class="icon">🏠</span>
                <span class="label">عقارات</span>
            </a>
            <a href="food.html" class="card food">
                <span class="icon">🍎</span>
                <span class="label">مواد غذائية</span>
            </a>
            <a href="construction.html" class="card construction">
                <span class="icon">🧱</span>
                <span class="label">مواد بناء</span>
            </a>
        </div>

        <!-- ===== صور الأقسام ===== -->
        <div class="section-images">
            <div class="section-img-item">
                <img src="https://images.unsplash.com/photo-1550355291-bbee04a7a347?w=400" alt="سيارات">
                <div class="img-label">🚗 سيارات</div>
            </div>
            <div class="section-img-item">
                <img src="https://images.unsplash.com/photo-1532453288672-3a27e9be9efd?w=400" alt="ملابس">
                <div class="img-label">👕 ملابس</div>
            </div>
            <div class="section-img-item">
                <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400" alt="منتجات">
                <div class="img-label">📦 منتجات</div>
            </div>
            <div class="section-img-item">
                <img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?w=400" alt="عقارات">
                <div class="img-label">🏠 عقارات</div>
            </div>
            <div class="section-img-item">
                <img src="https://images.unsplash.com/photo-1587049352851-8d4e8913398d?w=400" alt="مواد غذائية">
                <div class="img-label">🍎 مواد غذائية</div>
            </div>
            <div class="section-img-item">
                <img src="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=400" alt="مواد بناء">
                <div class="img-label">🧱 مواد بناء</div>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>© 2026 سوقني - جميع الحقوق محفوظة</p>
    </footer>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        function searchAll() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                alert('📝 الرجاء كتابة كلمة للبحث');
                return;
            }
            alert('🔍 سيتم البحث عن: "' + query + '"\n\nملاحظة: افتح أي قسم واستخدم البحث الموجود فيه.');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('searchInput');
            if (input) {
                input.addEventListener('keyup', function(e) {
                    if (e.key === 'Enter') {
                        searchAll();
                    }
                });
            }
        });

        console.log('🛒 مرحباً بك في سوقني - منصة الإعلانات العربية');
    </script>

</body>
</html>
