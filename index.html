 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="صلة - منصة تربط المنتج بالمستهلك، وتساعدك على العثور على المنتجات والخدمات والإعلانات في مكان واحد.">

    <meta name="keywords"
        content="صلة, إعلانات, منتجات, خدمات, بيع, شراء, اليمن">

    <meta name="theme-color"
        content="#0f766e">

    <title>صلة | منصة تربط المنتج بالمستهلك</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background: #f5f7f8;
            color: #222;
            line-height: 1.7;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;

            position: sticky;
            top: 0;

            z-index: 1000;
        }


        .header-inner {
            max-width: 1150px;
            margin: auto;

            padding: 12px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .logo-icon {
            width: 45px;
            height: 45px;

            background: #0f766e;
            color: white;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }


        .logo-text {
            font-size: 25px;
            font-weight: bold;

            color: #0f766e;
        }


        .logo-subtitle {
            font-size: 11px;
            color: #777;

            margin-top: -5px;
        }


        .header-buttons {
            display: flex;
            gap: 8px;
        }


        .btn {
            border: none;
            cursor: pointer;

            border-radius: 10px;

            padding: 9px 15px;

            font-size: 14px;
            font-weight: bold;
        }


        .btn-login {
            background: #eef7f6;
            color: #0f766e;
        }


        .btn-add {
            background: #0f766e;
            color: white;
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #115e59
                );

            color: white;

            padding: 50px 18px 60px;
        }


        .hero-inner {
            max-width: 950px;
            margin: auto;

            text-align: center;
        }


        .hero h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }


        .hero p {
            font-size: 17px;
            opacity: .92;

            margin-bottom: 28px;
        }


        /* =========================
           SEARCH
        ========================== */

        .search-box {
            background: white;

            padding: 8px;

            border-radius: 15px;

            display: flex;
            gap: 8px;

            max-width: 850px;
            margin: auto;

            box-shadow:
                0 8px 30px rgba(0,0,0,.12);
        }


        .search-box input {
            flex: 1;

            border: none;
            outline: none;

            padding: 13px;

            font-size: 16px;

            color: #222;

            min-width: 0;
        }


        .search-btn {
            border: none;

            background: #0f766e;
            color: white;

            padding: 0 25px;

            border-radius: 11px;

            cursor: pointer;

            font-weight: bold;
        }


        /* =========================
           CONTAINER
        ========================== */

        .container {
            max-width: 1150px;
            margin: auto;

            padding:
                30px 18px;
        }


        .section-title {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 17px;
        }


        .section-title h2 {
            font-size: 23px;
        }


        .section-title span {
            color: #777;
            font-size: 13px;
        }


        /* =========================
           FILTERS
        ========================== */

        .filters {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 25px;
        }


        .filters select {
            width: 100%;

            border: 1px solid #ddd;

            background: white;

            border-radius: 10px;

            padding: 12px;

            outline: none;

            font-size: 14px;
        }


        /* =========================
           CATEGORIES
        ========================== */

        .categories {
            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding-bottom: 8px;

            scrollbar-width: thin;
        }


        .category {
            flex: 0 0 auto;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 13px;

            padding: 11px 17px;

            cursor: pointer;

            transition: .2s;

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 14px;
        }


        .category:hover,
        .category.active {
            background: #0f766e;
            color: white;
        }


        /* =========================
           ADS GRID
        ========================== */

        .ads-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }


        .ad-card {
            background: white;

            border-radius: 15px;

            overflow: hidden;

            border: 1px solid #e7e7e7;

            transition:
                transform .2s,
                box-shadow .2s;
        }


        .ad-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.08);
        }


        .ad-image {
            width: 100%;
            height: 190px;

            object-fit: cover;

            background: #eee;
        }


        .no-image {
            width: 100%;
            height: 190px;

            background: #eef2f2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
        }


        .ad-content {
            padding: 14px;
        }


        .ad-category {
            color: #0f766e;

            font-size: 12px;

            margin-bottom: 4px;
        }


        .ad-title {
            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;

            display: -webkit-box;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .ad-description {
            color: #777;

            font-size: 13px;

            display: -webkit-box;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;

            margin-bottom: 9px;
        }


        .ad-price {
            font-size: 17px;

            font-weight: bold;

            color: #0f766e;
        }


        .ad-location {
            color: #777;

            font-size: 12px;

            margin-top: 4px;
        }


        .view-ad {
            display: block;

            text-align: center;

            background: #f0f7f6;

            color: #0f766e;

            margin-top: 11px;

            padding: 8px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {
            text-align: center;

            padding: 45px;

            color: #777;
        }


        .empty {
            background: white;

            border-radius: 15px;

            padding: 45px 20px;

            text-align: center;

            color: #777;
        }


        .empty-icon {
            font-size: 45px;

            margin-bottom: 8px;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            margin-top: 30px;

            background: #123b39;

            color: white;

            padding: 35px 18px;

            text-align: center;
        }


        footer .footer-logo {
            font-size: 25px;
            font-weight: bold;
        }


        footer p {
            opacity: .8;

            font-size: 13px;

            margin-top: 5px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 900px) {

            .ads-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        @media (max-width: 650px) {

            .header-inner {
                padding: 10px 12px;
            }


            .logo-text {
                font-size: 21px;
            }


            .logo-icon {
                width: 40px;
                height: 40px;
            }


            .btn {
                padding: 8px 10px;

                font-size: 12px;
            }


            /*
              لا نخفي زر إضافة الإعلان
              لأن الموقع الآن مجاني
            */

            .btn-add {
                display: block;
            }


            .hero {
                padding:
                    35px 14px 42px;
            }


            .hero h1 {
                font-size: 28px;
            }


            .hero p {
                font-size: 14px;
            }


            .search-box {
                padding: 6px;
            }


            .search-box input {
                padding: 11px 8px;

                font-size: 14px;
            }


            .search-btn {
                padding: 0 15px;
            }


            .filters {
                grid-template-columns: 1fr;
            }


            .ads-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }


            .ad-image,
            .no-image {
                height: 145px;
            }


            .ad-content {
                padding: 10px;
            }


            .ad-title {
                font-size: 15px;
            }


            .ad-price {
                font-size: 15px;
            }

        }


        @media (max-width: 380px) {

            .ads-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-inner">


        <a href="index.html" class="logo">


            <div class="logo-icon">
                ص
            </div>


            <div>

                <div class="logo-text">
                    صلة
                </div>


                <div class="logo-subtitle">
                    نصل المنتج بالمستهلك
                </div>

            </div>


        </a>



        <div class="header-buttons">


            <button
                class="btn btn-login"
                onclick="goLogin()">

                👤 دخول

            </button>



            <button
                class="btn btn-add"
                onclick="addAd()">

                ＋ أضف إعلانك

            </button>


        </div>


    </div>

</header>



<!-- =========================
     HERO
========================= -->

<section class="hero">


    <div class="hero-inner">


        <h1>
            صلة
        </h1>


        <p>
            نصل المنتج بالمستهلك، ونساعدك على الوصول إلى ما تبحث عنه.
        </p>



        <div class="search-box">


            <input
                type="search"
                id="searchInput"
                placeholder="ابحث عن منتج، خدمة، سيارة، عقار..."
                onkeydown="searchKey(event)"
            >


            <button
                class="search-btn"
                onclick="loadAds()">

                🔍 بحث

            </button>


        </div>


    </div>


</section>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- Categories -->


    <div class="section-title">


        <h2>
            🏷️ التصنيفات
        </h2>


        <span>
            اختر ما تبحث عنه
        </span>


    </div>



    <div
        id="categories"
        class="categories">


        <div class="loading">
            جاري تحميل التصنيفات...
        </div>


    </div>



    <br>



    <!-- Filters -->


    <div class="section-title">


        <h2>
            🔎 تصفية النتائج
        </h2>


    </div>



    <div class="filters">


        <select
            id="categoryFilter"
            onchange="loadAds()">


            <option value="">
                كل التصنيفات
            </option>


        </select>



        <select
            id="cityFilter"
            onchange="loadAds()">


            <option value="">
                كل المدن
            </option>


            <option value="صنعاء">
                صنعاء
            </option>


            <option value="عدن">
                عدن
            </option>


            <option value="تعز">
                تعز
            </option>


            <option value="إب">
                إب
            </option>


            <option value="الحديدة">
                الحديدة
            </option>


            <option value="حضرموت">
                حضرموت
            </option>


            <option value="ذمار">
                ذمار
            </option>


            <option value="حجة">
                حجة
            </option>


            <option value="أخرى">
                أخرى
            </option>


        </select>


    </div>



    <!-- Latest ads -->


    <div class="section-title">


        <h2>
            📢 أحدث الإعلانات
        </h2>


        <span id="adsCount">
            ...
        </span>


    </div>



    <div
        id="adsContainer"
        class="ads-grid">


        <div class="loading">
            جاري تحميل الإعلانات...
        </div>


    </div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>


    <div class="footer-logo">
        صلة
    </div>


    <p>
        منصة تربط المنتج بالمستهلك
    </p>


    <p>
        جميع الحقوق محفوظة © 2026
    </p>


</footer>



<script>


/* =========================================
   SUPABASE
========================================= */


const SUPABASE_URL =
    "https://yakmcmuzwfhtbrnmpkmd.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_TlJVUNePj0j66wALfSNm2A_78Ar_DN4";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* =========================================
   الحالة الحالية
========================================= */


let selectedCategory = "";



/* =========================================
   تحميل التصنيفات
========================================= */


async function loadCategories() {


    const container =
        document.getElementById("categories");


    const select =
        document.getElementById("categoryFilter");



    const { data, error } =
        await supabaseClient
            .from("categories")
            .select("*")
            .order("id");



    if (error) {


        console.error(error);


        container.innerHTML =
            `<div class="empty">
                تعذر تحميل التصنيفات
            </div>`;


        return;

    }



    container.innerHTML = "";



    data.forEach(category => {


        const button =
            document.createElement("button");


        button.className =
            "category";


        button.innerHTML =
            `${category.icon || "📦"}
             ${escapeHtml(category.name)}`;



        button.onclick = () => {


            selectedCategory =
                category.slug;


            select.value =
                category.slug;


            document
                .querySelectorAll(".category")
                .forEach(b =>
                    b.classList.remove("active")
                );


            button.classList.add("active");


            loadAds();

        };



        container.appendChild(button);



        const option =
            document.createElement("option");


        option.value =
            category.slug;


        option.textContent =
            category.name;


        select.appendChild(option);

    });

}



/* =========================================
   تحميل الإعلانات
========================================= */


async function loadAds() {


    const container =
        document.getElementById("adsContainer");


    const search =
        document
            .getElementById("searchInput")
            .value
            .trim();


    const category =
        document
            .getElementById("categoryFilter")
            .value;


    const city =
        document
            .getElementById("cityFilter")
            .value;



    container.innerHTML =
        `<div class="loading">
            جاري البحث...
        </div>`;



    let query =
        supabaseClient
            .from("ads")
            .select("*")
            .eq("status", "published")
            .order("created_at", {
                ascending: false
            })
            .limit(50);



    if (category) {


        query =
            query.eq(
                "category",
                category
            );

    }



    if (city) {


        query =
            query.eq(
                "city",
                city
            );

    }



    if (search) {


        query =
            query.or(
                `title.ilike.%${escapeFilter(search)}%,description.ilike.%${escapeFilter(search)}%`
            );

    }



    const { data, error } =
        await query;



    if (error) {


        console.error(error);


        container.innerHTML =
            `<div
                class="empty"
                style="grid-column:1/-1">

                <div class="empty-icon">
                    ⚠️
                </div>

                حدث خطأ أثناء تحميل الإعلانات

            </div>`;


        return;

    }



    document
        .getElementById("adsCount")
        .textContent =
        `${data.length} إعلان`;



    if (!data.length) {


        container.innerHTML =
            `<div
                class="empty"
                style="grid-column:1/-1">

                <div class="empty-icon">
                    🔍
                </div>

                لا توجد إعلانات مطابقة للبحث حاليًا.

            </div>`;


        return;

    }



    container.innerHTML = "";



    data.forEach(ad => {


        const card =
            document.createElement("article");


        card.className =
            "ad-card";



        let imageHTML = "";



        if (ad.image_url) {


            imageHTML =
                `<img
                    class="ad-image"
                    src="${escapeHtml(ad.image_url)}"
                    alt="${escapeHtml(ad.title)}"
                    loading="lazy"
                >`;

        }

        else {


            imageHTML =
                `<div class="no-image">
                    📦
                </div>`;

        }



        const price =
            ad.price !== null &&
            ad.price !== undefined

            ? `${formatNumber(ad.price)}
               ${ad.currency || "YER"}`

            : "السعر عند التواصل";



        card.innerHTML = `

            ${imageHTML}


            <div class="ad-content">


                <div class="ad-category">
                    ${escapeHtml(
                        ad.category || "أخرى"
                    )}
                </div>


                <div class="ad-title">
                    ${escapeHtml(ad.title)}
                </div>


                <div class="ad-description">
                    ${escapeHtml(
                        ad.description || ""
                    )}
                </div>


                <div class="ad-price">
                    ${price}
                </div>


                ${
                    ad.city

                    ? `<div class="ad-location">
                        📍 ${escapeHtml(ad.city)}
                       </div>`

                    : ""
                }


                <a
                    class="view-ad"
                    href="ad.html?id=${encodeURIComponent(ad.id)}">

                    عرض الإعلان

                </a>


            </div>

        `;



        container.appendChild(card);

    });

}



/* =========================================
   البحث من لوحة المفاتيح
========================================= */


function searchKey(event) {


    if (event.key === "Enter") {


        loadAds();

    }

}



/* =========================================
   إضافة إعلان
========================================= */

/*
   الموقع أصبح مجانيًا وبدون تسجيل دخول.
   لذلك نفتح صفحة add-ad.html مباشرة.
*/


function addAd() {


    window.location.href =
        "add-ad.html";

}



/* =========================================
   تسجيل الدخول
========================================= */

/*
   زر الدخول موجود حاليًا في الواجهة،
   لكن نظام الدخول ليس مطلوبًا لإضافة الإعلان.
*/


function goLogin() {


    window.location.href =
        "login.html";

}



/* =========================================
   تنسيق الأرقام
========================================= */


function formatNumber(number) {


    return Number(number)
        .toLocaleString("ar-YE");

}



/* =========================================
   حماية HTML
========================================= */


function escapeHtml(value) {


    return String(value)

        .replace(/&/g, "&")

        .replace(/</g, "<")

        .replace(/>/g, ">")

        .replace(/"/g, """)

        .replace(/'/g, "'");

}



function escapeFilter(value) {


    return String(value)

        .replace(/[%_]/g, "\\$&")

        .replace(/,/g, "\\,");

}



/* =========================================
   التشغيل
========================================= */


document.addEventListener(
    "DOMContentLoaded",
    async () => {


        await loadCategories();


        await loadAds();


    }
);

</script>


</body>

</html>
