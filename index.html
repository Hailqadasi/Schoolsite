<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صلة - نصل المنتج بالمستهلك</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* بطاقة التطبيق الرئيسية – تحاكي شاشة الجوال */
        .app-card {
            max-width: 400px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            padding: 24px 20px 20px;
            transition: all 0.2s ease;
        }

        /* الهيدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-icon {
            font-size: 28px;
            color: #1e3a5f;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #1e3a5f;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-actions .add-btn {
            background: #eef2f7;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default;
            transition: 0.15s;
            border: 1px solid transparent;
        }

        .header-actions .add-btn i {
            font-size: 14px;
            color: #1e3a5f;
        }

        .header-actions .login-btn {
            font-size: 15px;
            font-weight: 600;
            color: #1e3a5f;
            cursor: default;
            background: transparent;
            border: none;
            padding: 6px 4px;
        }

        .header-actions .login-btn i {
            margin-left: 4px;
            font-size: 14px;
            color: #1e3a5f;
        }

        /* الشعار الفرعي (شعار المنتج) */
        .sub-brand {
            margin-bottom: 24px;
        }

        .sub-brand p {
            font-size: 16px;
            color: #2c3e50;
            font-weight: 400;
            line-height: 1.5;
        }

        .sub-brand p strong {
            font-weight: 700;
            color: #1e3a5f;
        }

        /* مربع البحث */
        .search-box {
            background: #f0f4f9;
            border-radius: 60px;
            padding: 6px 6px 6px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border: 1px solid #e9edf2;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 15px;
            flex: 1;
            outline: none;
            color: #1e2a3a;
        }

        .search-box input::placeholder {
            color: #7e8c9e;
            font-weight: 400;
        }

        .search-box .search-btn {
            background: #1e3a5f;
            border: none;
            border-radius: 60px;
            padding: 10px 18px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default;
            transition: 0.15s;
        }

        .search-box .search-btn i {
            font-size: 16px;
        }

        /* "اختر ما تبحث عنه" */
        .browse-label {
            font-size: 15px;
            font-weight: 500;
            color: #1e2a3a;
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }

        /* التصنيفات الثلاث (منتجات، سيارات، عقارات) */
        .categories {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .category-item {
            background: #f0f4f9;
            padding: 10px 16px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            color: #1e2a3a;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: default;
            transition: 0.1s;
            border: 1px solid transparent;
            flex: 1;
            justify-content: center;
        }

        .category-item i {
            font-size: 16px;
            color: #1e3a5f;
        }

        /* شريط الفلترة */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8faff;
            padding: 10px 16px;
            border-radius: 40px;
            margin-bottom: 22px;
            border: 1px solid #e9edf2;
        }

        .filter-bar .filter-label {
            font-size: 15px;
            font-weight: 600;
            color: #1e2a3a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar .filter-label i {
            color: #1e3a5f;
            font-size: 14px;
        }

        .filter-options {
            display: flex;
            gap: 12px;
            font-size: 14px;
            color: #2c3e50;
            font-weight: 500;
        }

        .filter-options span {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #dce3ec;
            font-size: 13px;
        }

        .filter-options span i {
            font-size: 11px;
            color: #6c7a8a;
        }

        /* قسم "أحدث الإعلانات" وعدد الإعلانات */
        .latest-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 16px;
            padding: 0 2px;
        }

        .latest-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1e2a3a;
        }

        .latest-header .count-badge {
            background: #eef2f7;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            color: #1e3a5f;
        }

        /* حالة عدم وجود إعلانات */
        .empty-state {
            background: #fafcff;
            border-radius: 24px;
            padding: 36px 16px 28px;
            text-align: center;
            border: 1px dashed #d0d9e6;
            margin-bottom: 24px;
        }

        .empty-state .empty-icon {
            font-size: 44px;
            color: #b0c0d0;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
        }

        .empty-state .sub-message {
            font-size: 14px;
            color: #7a8a9e;
            margin-top: 6px;
            font-weight: 400;
        }

        /* الفوتر */
        .footer {
            margin-top: 12px;
            text-align: center;
            border-top: 1px solid #eef2f7;
            padding-top: 18px;
        }

        .footer .brand-line {
            font-size: 16px;
            font-weight: 500;
            color: #1e2a3a;
            margin-bottom: 6px;
        }

        .footer .brand-line i {
            color: #1e3a5f;
            margin: 0 4px;
        }

        .footer .copyright {
            font-size: 13px;
            color: #7a8a9e;
            letter-spacing: 0.3px;
        }

        /* أيقونات إضافية */
        .fa-regular, .fas, .far, .fab {
            pointer-events: none;
        }

        /* لمسات responsive */
        @media (max-width: 420px) {
            .app-card {
                padding: 18px 14px;
            }
            .header-actions .add-btn {
                padding: 6px 12px;
                font-size: 13px;
            }
            .filter-options span {
                padding: 3px 8px;
                font-size: 12px;
            }
            .category-item {
                padding: 8px 10px;
                font-size: 13px;
            }
            .search-box input {
                font-size: 14px;
            }
        }

        /* تعديلات بسيطة لجعل التصميم مطابقاً للصور */
        .app-card .sub-brand p {
            font-weight: 400;
        }
        .app-card .sub-brand p strong {
            font-weight: 700;
        }
        .filter-bar .filter-options span i {
            margin-right: 2px;
        }
        .header-actions .add-btn i {
            font-size: 13px;
        }
        .header-actions .login-btn i {
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="app-card">

        <!-- الهيدر: صلة + أضف إعلانك + دخول -->
        <div class="header">
            <div class="logo-area">
                <i class="fas fa-link logo-icon"></i>
                <span class="logo-text">صلة</span>
            </div>
            <div class="header-actions">
                <span class="add-btn"><i class="fas fa-plus-circle"></i> أضف إعلانك</span>
                <span class="login-btn"><i class="fas fa-user-circle"></i> دخول</span>
            </div>
        </div>

        <!-- الشعار: نصل المنتج بالمستهلك، ونساعدك... -->
        <div class="sub-brand">
            <p>
                <strong>نصل المنتج بالمستهلك</strong>، ونساعدك على الوصول إلى ما تبحث عنه.
            </p>
        </div>

        <!-- شريط البحث -->
        <div class="search-box">
            <input type="text" placeholder="ابحث عن منتج، خدمة، سيارة، عقار..." />
            <button class="search-btn"><i class="fas fa-search"></i> بحث</button>
        </div>

        <!-- "اختر ما تبحث عنه" + التصنيفات -->
        <div class="browse-label">اختر ما تبحث عنه</div>
        <div class="categories">
            <div class="category-item"><i class="fas fa-tag"></i> منتجات</div>
            <div class="category-item"><i class="fas fa-car"></i> سيارات</div>
            <div class="category-item"><i class="fas fa-building"></i> عقارات</div>
        </div>

        <!-- فلتر النتائج -->
        <div class="filter-bar">
            <span class="filter-label"><i class="fas fa-sliders-h"></i> تصفية النتائج</span>
            <div class="filter-options">
                <span><i class="fas fa-tags"></i> كل التصنيفات</span>
                <span><i class="fas fa-city"></i> كل المدن</span>
            </div>
        </div>

        <!-- "أحدث الإعلانات" + 0 إعلان -->
        <div class="latest-header">
            <h3>أحدث الإعلانات</h3>
            <span class="count-badge">0 إعلان</span>
        </div>

        <!-- حالة عدم وجود إعلانات (0 إعلان + رسالة) -->
        <div class="empty-state">
            <div class="empty-icon"><i class="fas fa-box-open"></i></div>
            <p>لا توجد إعلانات مطابقة للبحث حالياً.</p>
            <div class="sub-message">يمكنك إضافة إعلانك الآن</div>
        </div>

        <!-- الفوتر: صلة + حقوق النشر -->
        <div class="footer">
            <div class="brand-line">
                <i class="fas fa-link"></i> صلة <span style="font-weight:300; color:#2c3e50;">منصة تربط المنتج بالمستهلك</span>
            </div>
            <div class="copyright">جميع الحقوق محفوظة © 2026</div>
        </div>

    </div>

    <!-- أي تفاعل بسيط (للمحاكاة) – اختياري -->
    <script>
        // مجرد محاكاة لتفاعلات وهمية – لا وظيفة حقيقية
        (function() {
            // إضافة تأثير بسيط عند النقر على أي عنصر تفاعلي (لإحساس المحاكاة)
            const interactive = document.querySelectorAll('.category-item, .filter-options span, .add-btn, .login-btn, .search-btn');
            interactive.forEach(el => {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    // مجرد وميض بسيط
                    this.style.transition = '0.1s';
                    this.style.opacity = '0.6';
                    setTimeout(() => { this.style.opacity = '1'; }, 120);
                });
            });

            // منع إرسال النموذج عند الضغط على Enter في حقل البحث
            const searchInput = document.querySelector('.search-box input');
            if (searchInput) {
                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const btn = document.querySelector('.search-btn');
                        if (btn) btn.click();
                    }
                });
            }

            // تعطيل أي إجراء افتراضي للروابط/الأزرار
            document.querySelectorAll('button, .add-btn, .login-btn').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                });
            });
        })();
    </script>

</body>
</html>
