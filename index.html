 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rasidna - تأكيد البريد</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:linear-gradient(145deg,#f4f7fb,#e8edf8);
color:#172033;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card{
width:calc(100% - 36px);
max-width:460px;
background:white;
border-radius:26px;
padding:35px 25px;
text-align:center;
box-shadow:0 12px 35px rgba(23,43,133,.12);
}

.logo{
width:90px;
height:90px;
margin:0 auto 20px;
border-radius:50%;
background:#e8edff;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
}

h1{
color:#172b85;
margin:0 0 15px;
font-size:28px;
}

.message{
font-size:17px;
line-height:1.8;
color:#5d687d;
margin-bottom:25px;
}

.success{
color:#16856f;
font-weight:bold;
}

button{
width:100%;
height:53px;
border:0;
border-radius:15px;
background:#172b85;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.small{
margin-top:18px;
font-size:12px;
color:#9aa3b5;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">
💳
</div>

<h1>
Rasidna
</h1>

<div id="message" class="message">
جاري التحقق من البريد الإلكتروني...
</div>

<button
id="continueBtn"
style="display:none;"
onclick="goToApp()">

العودة إلى Rasidna

</button>

<div class="small">
محفظتك الرقمية بأمان وسهولة
</div>

</div>


<script>

const message =
document.getElementById("message");

const continueBtn =
document.getElementById("continueBtn");


/*
ننتظر لحظة حتى يعالج Supabase
رمز التأكيد الموجود في الرابط.
*/

setTimeout(function(){

message.className =
"message success";

message.innerHTML =
"✅ تم تأكيد بريدك الإلكتروني بنجاح.<br><br>" +
"يمكنك الآن العودة إلى تطبيق Rasidna وتسجيل الدخول.";

continueBtn.style.display =
"block";

},1500);


/*
نضع رابط تطبيق Rasidna هنا لاحقًا
إذا حصلنا على رابط عام للتطبيق.

حاليًا الزر يعرض رسالة فقط.
*/

function goToApp(){

alert(
"افتح تطبيق Rasidna وسجّل الدخول باستخدام بريدك الإلكتروني وكلمة المرور."
);

}

</script>

</body>

</html>
