<style>

* {

}

body {

    color: #1f2937;

header {

header h1 {

}

label {

select,

}

.info {

}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

.aggregate-table {
    min-width: 650px;
}

.single-table {
    overflow-x: visible;
}

.single-table table {

    table-layout: fixed;
}

.single-table th:first-child,
.single-table td:first-child {
    width: 65%;
}

.single-table th:last-child,
.single-table td:last-child {

}

th,

}

th {
    background: #e5e7eb;
    font-weight: bold;
}

.total {

    background: #eef2f7;
}

.final-result {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #e8f5e9;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #6b7280;
}

.small {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.8;
}

/* =========================
   فحص البيانات الخام
========================= */

.debug-box {
    margin-top: 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    overflow: hidden;
}

.debug-box summary {
    cursor: pointer;
    background: #f1f5f9;
    padding: 12px;
    font-weight: bold;
}

.debug-content {
    padding: 12px;
    background: #fafafa;
}

.debug-content pre {
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    background: #f3f4f6;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
}

.debug-table {
    width: 100%;
    margin-top: 10px;
}

.debug-table td,
.debug-table th {
    padding: 8px;
}

/* =========================
   الهاتف
========================= */

@media(max-width:600px) {

    header h1 {
        font-size: 20px;
    }

    .card {
        padding: 14px;
    }

    .single-table th,
    .single-table td {
        padding: 10px 5px;
        font-size: 15px;
    }

    .aggregate-table th,
    .aggregate-table td {
        padding: 8px 6px;
        font-size: 14px;
    }

}

</style>

</head>

<script>

/* =====================================================
   إعداد Supabase
===================================================== */

const SUPABASE_URL =
    "https://ilplwdhwsziuxynvneov.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KALdRLu6_CyNGXP7RWecLQ_mN1JlrJi";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const SCHOOL_NAME =
    "مدرسة الفتح بطنة قدس";


/* =====================================================
   المواد
===================================================== */

function getSubjects(className) {

    if (
        className === "الصف الأول الأساسي" ||
        className === "الصف الثاني الأساسي"
    ) {

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم"
        ];

    }


    if (
        className === "الصف الثالث الأساسي" ||
        className === "الصف الرابع الأساسي" ||
        className === "الصف الخامس الأساسي" ||
        className === "الصف السادس الأساسي"
    ) {

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم",
            "اجتماعات"
        ];

    }


    if (
        className === "الصف السابع الأساسي" ||
        className === "الصف الثامن الأساسي" ||
        className === "الصف التاسع الأساسي"
    ) {

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "علوم",
            "اجتماعات"
        ];

    }


    if (
        className === "الصف الأول الثانوي"
    ) {

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء",
            "جغرافيا",
            "تاريخ",
            "مجتمع"
        ];

    }


    if (
        className === "الصف الثاني الثانوي" ||
        className === "الصف الثالث الثانوي"
    ) {

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء"
        ];

    }

    return [];

}


/* =====================================================
   تحويل JSONB
===================================================== */

function parseScores(data) {

    if (
        data === null ||
        data === undefined ||
        data === ""
    ) {
        return {};
    }

    if (
        typeof data === "object"
    ) {
        return data;
    }

    if (
        typeof data === "string"
    ) {

        try {

            const parsed =
                JSON.parse(data);

            if (
                parsed &&
                typeof parsed === "object"
            ) {
                return parsed;
            }

        } catch (error) {

            console.log(
                "JSON parse error:",
                error
            );

        }

    }

    return {};

}


/* =====================================================
   توحيد النص
===================================================== */

function normalizeText(text) {

    return String(text ?? "")
        .trim()
        .replace(/\s+/g, " ")
        .replace(/ـ/g, "")
        .replace(/\u200f/g, "")
        .replace(/\u200e/g, "")
        .replace(/َ|ً|ُ|ٌ|ِ|ٍ|ْ|ّ/g, "");

}


/* =====================================================
   توحيد اسم المادة
===================================================== */

function normalizeSubject(text) {

    let value =
        normalizeText(text);


    const aliases = {

        "عربي": "لغة عربية",

        "اللغة العربية": "لغة عربية",

        "العربي": "لغة عربية",

        "لغةالعربية": "لغة عربية",

        "اسلامية": "إسلامية",

        "إسلاميه": "إسلامية",

        "اسلاميه": "إسلامية",

        "قران": "قرآن",

        "القران": "قرآن",

        "القرآن": "قرآن",

        "علوم": "علوم",

        "العلوم": "علوم",

        "رياضيات": "رياضيات",

        "الرياضيات": "رياضيات"

    };


    return aliases[value] || value;

}


/* =====================================================
   الحصول على درجة المادة
===================================================== */

function getSubjectScore(
    scores,
    subject
) {

    if (
        !scores ||
        typeof scores !== "object"
    ) {
        return null;
    }


    const wanted =
        normalizeSubject(subject);


    const keys =
        Object.keys(scores);


    for (
        let i = 0;
        i < keys.length;
        i++
    ) {

        const key =
            keys[i];


        const normalizedKey =
            normalizeSubject(key);


        if (
            normalizedKey === wanted
        ) {

            const value =
                Number(scores[key]);


            if (
                !isNaN(value)
            ) {

                return value;

            }

        }

    }


    return null;

}


/* =====================================================
   الحصول على بيانات الفترة
===================================================== */

function getPeriodScores(
    row,
    period
) {

    let data = null;

    let title = "";


    if (period === "9") {

        data = row.september;
        title = "سبتمبر";

    }

    else if (period === "10") {

        data = row.october;
        title = "أكتوبر";

    }

    else if (period === "11") {

        data = row.november;
        title = "نوفمبر";

    }

    else if (period === "1") {

        data = row.january;
        title = "يناير";

    }

    else if (period === "2") {

        data = row.february;
        title = "فبراير";

    }

    else if (period === "3") {

        data = row.march;
        title = "مارس";

    }

    else if (period === "first_half") {

        data = row.first_half;
        title = "درجة النصف الأول";

    }

    else if (period === "second_half") {

        data = row.second_half;
        title = "درجة النصف الثاني";

    }


    return {

        scores:
            parseScores(data),

        title:
            title

    };

}


/* =====================================================
   البحث عن الطالب
===================================================== */

async function searchStudent() {

    const studentName =
        document
        .getElementById("studentName")
        .value
        .trim();


    const className =
        document
        .getElementById("className")
        .value;


    const period =
        document
        .getElementById("period")
        .value;


    const status =
        document
        .getElementById("status");


    const results =
        document
        .getElementById("results");


    results.innerHTML = "";


    if (!studentName) {

        status.innerHTML =
            "⚠️ اكتب اسم الطالب أولاً";

        return;

    }


    status.innerHTML =
        "⏳ جاري البحث...";


    try {

        const response =
            await supabaseClient
            .from("student_results")
            .select("*")
            .eq(
                "school_name",
                SCHOOL_NAME
            )
            .eq(
                "class_name",
                className
            )
            .ilike(
                "student_name",
                "%" +
                studentName +
                "%"
            );


        if (response.error) {

            throw response.error;

        }


        const data =
            response.data;


        if (
            !data ||
            data.length === 0
        ) {

            results.innerHTML = `

                <div class="card empty">

                    ❌ لم يتم العثور على الطالب

                </div>

            `;

            status.innerHTML = "";

            return;

        }


        const row =
            data[0];


        const subjects =
            getSubjects(className);


        if (period === "first_total") {

            results.innerHTML =
                buildFirstTotal(
                    row,
                    subjects
                );

        }

        /* =============================================
           الجديد: النتيجة النهائية للفصل الأول
        ============================================= */

        else if (period === "first_final") {

            results.innerHTML =
                buildFirstSemesterFinal(
                    row,
                    subjects
                );

        }

        else if (period === "last_total") {

            results.innerHTML =
                buildLastTotal(
                    row,
                    subjects
                );

        }

        else if (period === "final") {

            results.innerHTML =
                buildFinalResult(
                    row,
                    subjects
                );

        }

        else {

            results.innerHTML =
                buildSingleResult(
                    row,
                    subjects,
                    period
                );

        }


        status.innerHTML = "";


    } catch (error) {

        console.log(
            "Supabase Error:",
            error
        );


        status.innerHTML =
            "❌ حدث خطأ أثناء الاتصال بقاعدة البيانات";

    }

}


/* =====================================================
   عرض الفترة المفردة
===================================================== */

function buildSingleResult(
    row,
    subjects,
    period
) {

    const periodData =
        getPeriodScores(
            row,
            period
        );


    const scores =
        periodData.scores;


    const title =
        periodData.title;


    let html = `

        <div class="card student-card">

            <div class="student-title">

                👨‍🎓
                ${escapeHtml(
                    row.student_name
                )}

            </div>

            <div class="info">

                الصف:

                <strong>
                    ${escapeHtml(
                        row.class_name
                    )}
                </strong>

            </div>

            <div class="info">

                الفترة:

                <strong>
                    ${escapeHtml(title)}
                </strong>

            </div>

            <div class="table-wrap single-table">

                <table>

                    <thead>

                        <tr>

                            <th>المادة</th>

                            <th>الدرجة</th>

                        </tr>

                    </thead>

                    <tbody>
    `;


    let total = 0;


    subjects.forEach(
        function(subject) {

            const value =
                getSubjectScore(
                    scores,
                    subject
                );


            if (
                value !== null &&
                !isNaN(value)
            ) {

                total += value;

            }


            html += `

                <tr>

                    <td>
                        ${escapeHtml(subject)}
                    </td>

                    <td>

                        ${
                            value === null
                            ? "—"
                            : formatNumber(value)
                        }

                    </td>

                </tr>

            `;

        }
    );


    html += `

                <tr class="total">

                    <td>المجموع</td>

                    <td>
                        ${formatNumber(total)}
                    </td>

                </tr>

                    </tbody>

                </table>

            </div>


            ${buildDebugBox(
                row,
                period,
                scores,
                subjects
            )}

        </div>

    `;


    return html;

}


/* =====================================================
   صندوق فحص البيانات الخام
===================================================== */

function buildDebugBox(
    row,
    period,
    scores,
    subjects
) {

    const periodNames = {

        "9": "سبتمبر",
        "10": "أكتوبر",
        "11": "نوفمبر",
        "1": "يناير",
        "2": "فبراير",
        "3": "مارس",
        "first_half": "النصف الأول",
        "second_half": "النصف الثاني"

    };


    let tableRows = "";


    subjects.forEach(
        function(subject) {

            const value =
                getSubjectScore(
                    scores,
                    subject
                );


            tableRows += `

                <tr>

                    <td>
                        ${escapeHtml(subject)}
                    </td>

                    <td>
                        ${
                            value === null
                            ? "غير موجود"
                            : formatNumber(value)
                        }
                    </td>

                </tr>

            `;

        }
    );


    return `

        <details class="debug-box">

            <summary>
                🔎 فحص البيانات المستوردة
            </summary>

            <div class="debug-content">

                <p class="small">

                    هذه البيانات هي التي وصلت فعليًا
                    من Supabase للفترة المحددة.

                </p>

                <table class="debug-table">

                    <thead>

                        <tr>

                            <th>المادة</th>

                            <th>القيمة المقروءة</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${tableRows}

                    </tbody>

                </table>


                <p class="small">

                    البيانات الخام:

                </p>

                <pre>${escapeHtml(
                    JSON.stringify(
                        scores,
                        null,
                        2
                    )
                )}</pre>

                <p class="small">

                    اسم الفترة:
                    ${escapeHtml(
                        periodNames[period] || period
                    )}

                </p>

            </div>

        </details>

    `;

}


/* =====================================================
   محصلة الأشهر الثلاثة الأولى
===================================================== */

function buildFirstTotal(
    row,
    subjects
) {

    const sep =
        parseScores(
            row.september
        );

    const oct =
        parseScores(
            row.october
        );

    const nov =
        parseScores(
            row.november
        );


    let html = `

        <div class="card student-card">

            <div class="student-title">

                👨‍🎓
                ${escapeHtml(
                    row.student_name
                )}

            </div>

            <div class="info">

                الصف:

                <strong>
                    ${escapeHtml(
                        row.class_name
                    )}
                </strong>

            </div>

            <div class="info">

                📊 محصلة الأشهر الثلاثة الأولى

            </div>

            <div class="table-wrap">

                <table class="aggregate-table">

                    <thead>

                        <tr>

                            <th>المادة</th>
                            <th>سبتمبر</th>
                            <th>أكتوبر</th>
                            <th>نوفمبر</th>
                            <th>المحصلة</th>

                        </tr>

                    </thead>

                    <tbody>

    `;


    subjects.forEach(
        function(subject) {

            const a =
                getSubjectScore(
                    sep,
                    subject
                ) ?? 0;

            const b =
                getSubjectScore(
                    oct,
                    subject
                ) ?? 0;

            const c =
                getSubjectScore(
                    nov,
                    subject
                ) ?? 0;


            const result =
                (
                    a + b + c
                ) / 15;


            html += `

                <tr>

                    <td>
                        ${escapeHtml(subject)}
                    </td>

                    <td>
                        ${formatNumber(a)}
                    </td>

                    <td>
                        ${formatNumber(b)}
                    </td>

                    <td>
                        ${formatNumber(c)}
                    </td>

                    <td>

                        <strong>
                            ${formatNumber(result)}
                        </strong>

                    </td>

                </tr>

            `;

        }
    );


    html += `

                    </tbody>

                </table>

            </div>

            <p class="small">

                المحصلة لكل مادة =

                (سبتمبر + أكتوبر + نوفمبر) ÷ 15

            </p>

        </div>

    `;


    return html;

}


/* =====================================================
   النتيجة النهائية للفصل الأول
===================================================== */

function buildFirstSemesterFinal(
    row,
    subjects
) {

    const sep =
        parseScores(

/* =====================================================

===================================================== */

function buildFinalResult(
    row,
    subjects
) {

    const sep =
        parseScores(row.september);

    const oct =
        parseScores(row.october);

    const nov =
        parseScores(row.november);

    const jan =
        parseScores(row.january);

    const feb =
        parseScores(row.february);

    const mar =
        parseScores(row.march);

    const first =
        parseScores(row.first_half);

    const second =
        parseScores(row.second_half);


    let html = `

        <div class="card student-card">

            <div class="student-title">

            </div>

            <div class="info">

                الطالب:

                        row.student_name
                    )}

            </div>

            <div class="info">

                الصف:

                        row.class_name
                    )}

                            <th>

                            </th>

                            <th>
                                النصف الأول
                            </th>

                            <th>
                                محصلة آخر 3 أشهر
                            </th>

                            <th>
                                النصف الثاني
                            </th>

                            <th>
                                النتيجة النهائية
                            </th>

                    </thead>

                    <tbody>

    `;


    let finalTotal = 0;


    subjects.forEach(
        function(subject) {

            const firstTotal =
                (
                    (
                        getSubjectScore(
                            sep,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            oct,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            nov,
                            subject
                        ) ?? 0
                    )

                ) / 15;


            const lastTotal =
                (
                    (
                        getSubjectScore(
                            jan,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            feb,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            mar,
                            subject
                        ) ?? 0
                    )

                ) / 15;


            const firstHalf =
                getSubjectScore(
                    first,
                    subject
                ) ?? 0;


            const secondHalf =
                getSubjectScore(
                    second,
                    subject
                ) ?? 0;


            const finalResult =
                firstTotal +
                firstHalf +
                lastTotal +
                secondHalf;


            finalTotal +=
                finalResult;


            html += `

                <tr>

                    <td>
                        ${escapeHtml(subject)}
                    </td>

                    <td>
                        ${formatNumber(
                            firstTotal
                        )}
                    </td>

                    <td>
                        ${formatNumber(
                            firstHalf
                        )}
                    </td>

                    <td>
                        ${formatNumber(
                            lastTotal
                        )}
                    </td>

                    <td>
                        ${formatNumber(
                            secondHalf
                        )}
                    </td>

                    <td>

                        <strong>
                            ${formatNumber(
                                finalResult
                            )}
                        </strong>

                    </td>

                </tr>

            `;

        }
    );


    html += `

                    <tr class="total">

                        <td colspan="5">

                            مجموع النتيجة النهائية

                        </td>

                        <td>

                            ${formatNumber(
                                finalTotal
                            )}

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="final-result">

                🏆 النتيجة النهائية:

                ${formatNumber(
                    finalTotal
                )}

            </div>

            <p class="small">

                النتيجة النهائية لكل مادة =

                محصلة أول 3 أشهر

                +

                النصف الأول

                +

                محصلة آخر 3 أشهر

                +

                النصف الثاني

            </p>

        </div>

    `;


    return html;

}


/* =====================================================
   تنسيق الرقم
===================================================== */

function formatNumber(number) {

    const value =
        Number(number);

    if (
        isNaN(value)
    ) {
        return "0.00";
    }

    return value.toFixed(2);

}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(text) {

    return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
