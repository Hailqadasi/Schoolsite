 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📸 معرض الصور والفيديو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        /* ===== جميع التنسيقات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        /* ===== نافذة تسجيل الدخول ===== */
        .login-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .login-overlay.active { display: flex; }
        .login-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .login-box .login-icon { font-size: 64px; color: #1877f2; margin-bottom: 16px; }
        .login-box h2 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; }
        .login-box p { font-size: 14px; color: #65676b; margin-bottom: 24px; }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e4e6eb;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: #f0f2f5;
            text-align: right;
        }
        .login-box input:focus { border-color: #1877f2; background: #fff; }
        .login-box .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #1877f2;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s;
        }
        .login-box .login-btn:hover { background: #166fe5; }
        .login-box .login-error { color: #ff4d4d; font-size: 13px; margin-top: 8px; display: none; }
        .login-box .login-error.show { display: block; }

        /* ===== رأس الصفحة ===== */
        .page-header {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-header h1 { font-size: 22px; color: #1a1a1a; }
        .page-header h1 i { color: #1877f2; }
        .page-header .header-actions { display: flex; align-items: center; gap: 10px; }
        .page-header .header-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            background: #1877f2;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .page-header .header-actions button:hover { background: #166fe5; }
        .page-header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #65676b;
            cursor: pointer;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            background: #f0f2f5;
            transition: all 0.3s;
        }
        .page-header .user-info:hover { background: #e4e6eb; }
        .page-header .user-info .user-name-display { font-weight: 600; color: #1a1a1a; font-size: 14px; }
        .page-header .user-info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
        }

        /* ===== قسم إضافة منشور ===== */
        .upload-section {
            background: #fff;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .upload-section .upload-header { display: flex; gap: 12px; align-items: flex-start; }
        .upload-section .upload-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
            font-size: 18px;
        }
        .upload-section .upload-textarea {
            flex: 1;
            min-height: 60px;
            padding: 10px 14px;
            border: 1px solid #e4e6eb;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            resize: vertical;
            background: #f0f2f5;
            font-family: inherit;
            text-align: right;
        }
        .upload-section .upload-textarea:focus { border-color: #1877f2; background: #fff; }
        .upload-section .upload-textarea::placeholder { color: #65676b; }
        .upload-section .upload-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid #f0f2f5;
        }
        .upload-section .upload-tools .tools-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .upload-section .upload-tools .tools-left button {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: #f0f2f5;
            color: #65676b;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-section .upload-tools .tools-left button:hover { background: #e4e6eb; }
        .upload-section .upload-tools .tools-left .media-btn { color: #45b7d1; }
        .upload-section .upload-tools .tools-left .media-btn.has-media { background: #45b7d1; color: #fff; }
        .upload-section .upload-tools .publish-btn {
            padding: 8px 28px;
            border: none;
            border-radius: 20px;
            background: #1877f2;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .upload-section .upload-tools .publish-btn:hover { background: #166fe5; }
        .upload-section .upload-tools .publish-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== معاينة الوسائط ===== */
        .upload-section .media-preview-container {
            display: none;
            margin-top: 12px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f2f5;
        }
        .upload-section .media-preview-container.visible { display: block; }
        .upload-section .media-preview-container img,
        .upload-section .media-preview-container video {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            background: #fff;
        }
        .upload-section .media-preview-container .remove-media {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .upload-section .media-preview-container .remove-media:hover { background: rgba(255, 0, 0, 0.7); transform: scale(1.1); }

        /* ===== شريط التقدم ===== */
        #progressContainer {
            display: none;
            margin-top: 12px;
            padding: 10px;
            background: #f0f2f5;
            border-radius: 10px;
        }
        #progressContainer .progress-track {
            background: #e4e6eb;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        #progressContainer .progress-bar {
            width: 0%;
            background: linear-gradient(90deg, #1877f2, #4facfe);
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        #progressContainer .progress-text {
            font-size: 13px;
            color: #65676b;
            margin-top: 6px;
            text-align: center;
        }

        /* ===== بطاقة المنشور ===== */
        .post-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-card.deleting { opacity: 0; transform: scale(0.95); max-height: 0; margin: 0; padding: 0; overflow: hidden; animation: none; }
        .post-header { padding: 12px 16px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f2f5; }
        .post-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .post-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: 600; flex-shrink: 0; }
        .post-username { font-weight: 600; font-size: 14px; color: #1a1a1a; }
        .post-username .owner-badge { font-size: 12px; color: #65676b; }
        .post-time { font-size: 12px; color: #65676b; display: flex; align-items: center; gap: 4px; }
        .post-content { padding: 12px 16px 8px; }
        .post-text { font-size: 15px; color: #1a1a1a; line-height: 1.7; word-wrap: break-word; white-space: pre-wrap; }
        .post-media-wrapper { background: #f0f2f5; display: none; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .post-media-wrapper.visible { display: flex; }
        .post-media-wrapper img,
        .post-media-wrapper video { width: 100%; height: auto; max-height: 500px; object-fit: contain; display: block; background: #fff; }
        .post-media-wrapper video { cursor: default; max-height: 400px; }

        /* ===== أزرار التفاعل ===== */
        .post-actions { display: flex; justify-content: space-around; padding: 6px 16px; border-top: 1px solid #f0f2f5; border-bottom: 1px solid #f0f2f5; }
        .post-actions button {
            flex: 1;
            padding: 8px 6px;
            border: none;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #65676b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .post-actions button:hover { background: #f0f2f5; }
        .post-actions button.liked { color: #1877f2; }
        .post-actions button.liked i { font-weight: 900; }
        .post-actions .action-count { font-size: 12px; color: #65676b; }
        .delete-btn { background: none; border: none; cursor: pointer; color: #65676b; font-size: 16px; padding: 4px 8px; border-radius: 8px; transition: all 0.3s; }
        .delete-btn:hover { background: #f0f2f5; color: #ff4d4d; transform: scale(1.1); }

        /* ===== التعليقات ===== */
        .comments-section { padding: 10px 16px 14px; background: #fafafa; border-top: 1px solid #f0f2f5; display: none; }
        .comments-section.visible { display: block; animation: fadeIn 0.3s ease; }
        .comments-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .comments-header h4 { font-size: 13px; color: #65676b; font-weight: 500; }
        .comments-header .comment-count { background: #e4e6eb; padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #65676b; }
        .comments-list { max-height: 250px; overflow-y: auto; margin-bottom: 10px; }
        .comment-item { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f0f2f5; }
        .comment-item:last-child { border-bottom: none; }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; flex-shrink: 0; }
        .comment-body { flex: 1; }
        .comment-user { font-weight: 600; font-size: 12px; color: #1a1a1a; }
        .comment-text { font-size: 13px; color: #1a1a1a; word-wrap: break-word; }
        .comment-time { font-size: 10px; color: #65676b; margin-top: 2px; }
        .no-comments { text-align: center; color: #65676b; font-size: 13px; padding: 15px 0; }
        .add-comment { display: flex; gap: 8px; align-items: center; padding-top: 8px; border-top: 1px solid #f0f2f5; }
        .add-comment input { flex: 1; padding: 8px 14px; border: 1px solid #e4e6eb; border-radius: 20px; font-size: 13px; outline: none; background: #f0f2f5; text-align: right; }
        .add-comment input:focus { border-color: #1877f2; background: #fff; }
        .add-comment .send-btn { width: 32px; height: 32px; border: none; border-radius: 50%; background: #1877f2; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .add-comment .send-btn:hover { background: #166fe5; transform: scale(1.05); }

        /* ===== حالة فارغة ===== */
        .empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1); }
        .empty-state i { font-size: 80px; color: #ccd0d5; margin-bottom: 16px; }
        .empty-state h3 { color: #65676b; font-weight: 500; margin-bottom: 8px; }
        .empty-state p { color: #8a8f94; font-size: 14px; }

        /* ===== Lightbox ===== */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .lightbox.active { display: flex; animation: fadeIn 0.3s ease; }
        .lightbox img,
        .lightbox video { max-width: 90%; max-height: 85%; object-fit: contain; border-radius: 8px; }
        .lightbox video { max-height: 80vh; width: 80%; }
        .lightbox .close-lightbox { position: absolute; top: 20px; left: 20px; background: rgba(255, 255, 255, 0.15); border: none; color: #fff; font-size: 30px; cursor: pointer; padding: 10px 16px; border-radius: 50%; transition: all 0.3s; }
        .lightbox .close-lightbox:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.1); }
        .lightbox .lightbox-info { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, 0.7); font-size: 14px; background: rgba(0, 0, 0, 0.5); padding: 8px 20px; border-radius: 20px; }

        /* ===== نافذة التأكيد ===== */
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; }
        .custom-modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .custom-modal .modal-content { background: #fff; border-radius: 16px; padding: 30px 35px; max-width: 400px; width: 90%; text-align: center; }
        .custom-modal .modal-content .modal-icon { font-size: 48px; margin-bottom: 12px; color: #ff6b6b; }
        .custom-modal .modal-content h3 { font-size: 20px; color: #1a1a1a; margin-bottom: 8px; }
        .custom-modal .modal-content p { font-size: 15px; color: #65676b; margin-bottom: 20px; line-height: 1.6; }
        .custom-modal .modal-content .modal-buttons { display: flex; gap: 12px; justify-content: center; }
        .custom-modal .modal-content .modal-buttons button { padding: 10px 28px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .custom-modal .modal-content .modal-buttons .confirm-btn { background: #ff4d4d; color: #fff; }
        .custom-modal .modal-content .modal-buttons .confirm-btn:hover { background: #e04444; transform: scale(1.02); }
        .custom-modal .modal-content .modal-buttons .cancel-btn { background: #f0f2f5; color: #65676b; }
        .custom-modal .modal-content .modal-buttons .cancel-btn:hover { background: #e4e6eb; }

        /* ===== رسائل الإشعار ===== */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0, 0, 0, 0.85); color: #fff; padding: 14px 28px; border-radius: 50px; font-size: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); opacity: 0; pointer-events: none; z-index: 9999; max-width: 90%; text-align: center; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== تحميل ===== */
        .loading-spinner { text-align: center; padding: 40px; color: #65676b; }
        .loading-spinner i { font-size: 40px; color: #1877f2; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== استجابة للشاشات الصغيرة ===== */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .login-box { padding: 30px 20px; }
            .page-header h1 { font-size: 18px; }
            .page-header .header-actions button { font-size: 11px; padding: 4px 8px; }
            .upload-section { padding: 12px 14px; }
            .upload-section .upload-textarea { font-size: 13px; min-height: 50px; }
            .post-media-wrapper img,
            .post-media-wrapper video { max-height: 300px; }
            .lightbox video { width: 95%; }
            .post-actions button { font-size: 11px; padding: 6px 4px; }
        }
    </style>
</head>

<body>
    <!-- ===== نافذة تسجيل الدخول ===== -->
    <div class="login-overlay active" id="loginOverlay">
        <div class="login-box">
            <div class="login-icon"><i class="fa-regular fa-user"></i></div>
            <h2>مرحباً بك! 👋</h2>
            <p>أدخل اسمك للمشاركة في المعرض العام</p>
            <input type="text" id="loginNameInput" placeholder="أدخل اسمك..." maxlength="30" />
            <div class="login-error" id="loginError">⚠️ الرجاء إدخال اسم صحيح</div>
            <button class="login-btn" id="loginBtn"><i class="fa-regular fa-arrow-right"></i> دخول</button>
        </div>
    </div>

    <div class="container">
        <!-- ===== رأس الصفحة ===== -->
        <div class="page-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <h1><i class="fa-solid fa-images"></i> المعرض</h1>
                <div class="header-actions">
                    <button onclick="loadPosts()" title="تحديث المنشورات">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>
            <div class="user-info" id="userInfo" title="انقر لتغيير الاسم">
                <span class="user-name-display" id="userNameDisplay">مستخدم</span>
                <div class="avatar" id="userAvatar"><span id="avatarLetter">م</span></div>
            </div>
        </div>

        <!-- ===== قسم إضافة منشور ===== -->
        <div class="upload-section" id="uploadSection">
            <div class="upload-header">
                <div class="upload-avatar" id="uploadAvatar">م</div>
                <textarea class="upload-textarea" id="postTextInput" placeholder="ماذا تريد أن تنشر؟ (نص، صورة، فيديو)"></textarea>
            </div>
            <div class="media-preview-container" id="mediaPreviewContainer">
                <img id="mediaPreviewImg" src="" alt="معاينة" style="display:none;" />
                <video id="mediaPreviewVideo" src="" controls style="display:none;max-height:250px;"></video>
                <button class="remove-media" onclick="removeMedia()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- ===== شريط التقدم ===== -->
            <div id="progressContainer">
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p class="progress-text" id="progressText">⏳ جاري الرفع...</p>
            </div>

            <div class="upload-tools">
                <div class="tools-left">
                    <button class="media-btn" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-regular fa-image"></i>
                        <span id="mediaBtnText">إضافة صورة / فيديو</span>
                    </button>
                    <input type="file" id="fileInput" accept="image/*,video/*" hidden />
                </div>
                <button class="publish-btn" id="publishBtn" onclick="publishPost()">
                    <i class="fa-regular fa-paper-plane"></i> نشر
                </button>
            </div>
        </div>

        <!-- ===== حاوية المنشورات ===== -->
        <div id="postsContainer">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner"></i>
                <p>جاري تحميل المنشورات...</p>
            </div>
        </div>

        <!-- ===== حالة فارغة ===== -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fa-regular fa-images"></i>
            <h3>لا توجد منشورات</h3>
            <p>انشر أول منشور لمشاركته مع الجميع</p>
        </div>
    </div>

    <!-- ===== Lightbox ===== -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="close-lightbox" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
        <img id="lightboxImage" src="" alt="وسائط مكبرة" style="display:none;" />
        <video id="lightboxVideo" src="" controls style="display:none;width:80%;"></video>
        <div class="lightbox-info" id="lightboxInfo"></div>
    </div>

    <!-- ===== نافذة التأكيد ===== -->
    <div class="custom-modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h3 id="confirmTitle">تأكيد الحذف</h3>
            <p id="confirmMessage">هل أنت متأكد؟</p>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeConfirm()">إلغاء</button>
                <button class="confirm-btn" id="confirmYesBtn">تأكيد</button>
            </div>
        </div>
    </div>

    <!-- ===== رسالة إشعار ===== -->
    <div id="toast"></div>

    <!-- ===== Firebase SDK ===== -->

    </script>

    <script>
        // ============================================================
        // ===== 🔥 إعدادات Firebase =====
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAhh7mLHhKQsauhSTbojBVgtraLZLA3fcc",
            authDomain: "tofolati-38ac4.firebaseapp.com",
            databaseURL: "https://tofolati-38ac4-default-rtdb.firebaseio.com",
            projectId: "tofolati-38ac4",
            storageBucket: "tofolati-38ac4.firebasestorage.app",
            messagingSenderId: "635017833018",
            appId: "1:635017833018:web:YOUR_WEB_APP_ID" // 🔴 استبدل هذا
        };

        // ============================================================
        // ===== إعدادات Cloudinary =====
        // ============================================================
        const CLOUD_NAME = 'demo';
        const UPLOAD_PRESET = 'ml_default';
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`;

        // ============================================================
        // ===== المتغيرات العامة =====
        // ============================================================
        let currentUserName = '';
        let currentUserId = '';
        let allPosts = [];
        let tempMediaFile = null;
        let confirmCallback = null;
        let isSaving = false;

        // ============================================================
        // ===== تهيئة Firebase =====
        // ============================================================
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ============================================================
        // ===== 🔥 دوال Firebase =====
        // ============================================================
        async function loadPostsFromFirebase() {
            try {
                const snapshot = await database.ref('posts').once('value');
                const data = snapshot.val();
                if (data) {
                    allPosts = Object.values(data);
                    allPosts.sort((a, b) => b.timestamp - a.timestamp);
                    return allPosts;
                }
                return [];
            } catch (error) {
                console.error('❌ فشل تحميل المنشورات:', error);
                return loadFromLocalStorage();
            }
        }

        async function savePostsToFirebase(posts) {
            if (isSaving) {
                console.log('⏳ جاري الحفظ بالفعل، انتظر...');
                return false;
            }

            isSaving = true;
            try {
                console.log('💾 جاري حفظ المنشورات في Firebase...');
                const postsObject = {};
                posts.forEach(post => {
                    postsObject[post.id] = post;
                });
                await database.ref('posts').set(postsObject);
                saveToLocalStorage(posts);
                console.log('✅ تم حفظ المنشورات بنجاح');
                return true;
            } catch (error) {
                console.error('❌ فشل حفظ المنشورات:', error);
                saveToLocalStorage(posts);
                showToast('⚠️ تم الحفظ محلياً، سيتم المزامنة لاحقاً', 3000);
                return false;
            } finally {
                isSaving = false;
            }
        }

        // ============================================================
        // ===== الاستماع للتحديثات الفورية =====
        // ============================================================
        function listenForUpdates() {
            database.ref('posts').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    allPosts = Object.values(data);
                    allPosts.sort((a, b) => b.timestamp - a.timestamp);
                    renderPosts(allPosts);
                    console.log('🔄 تم التحديث الفوري، عدد المنشورات:', allPosts.length);
                }
            });
        }

        // ============================================================
        // ===== التخزين المحلي الاحتياطي =====
        // ============================================================
        function saveToLocalStorage(posts) {
            try {
                localStorage.setItem('backup_posts', JSON.stringify(posts));
            } catch (e) { /* تجاهل */ }
        }

        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem('backup_posts');
                if (data) {
                    const posts = JSON.parse(data);
                    posts.sort((a, b) => b.timestamp - a.timestamp);
                    return posts;
                }
            } catch (e) { /* تجاهل */ }
            return [];
        }

        // ============================================================
        // ===== تسجيل الدخول =====
        // ============================================================
        function loginUser(name) {
            name = name.trim();
            if (!name || name.length < 2) {
                document.getElementById('loginError').classList.add('show');
                return;
            }
            currentUserName = name;
            currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('userName', currentUserName);
            localStorage.setItem('userId', currentUserId);
            document.getElementById('loginOverlay').classList.remove('active');
            updateUI();
            showToast('👋 مرحباً ' + currentUserName + '!', 2500);
            loadPosts();
        }

        document.getElementById('loginBtn').onclick = () => loginUser(document.getElementById('loginNameInput').value);
        document.getElementById('loginNameInput').onkeydown = (e) => {
            if (e.key === 'Enter') loginUser(document.getElementById('loginNameInput').value);
            document.getElementById('loginError').classList.remove('show');
        };

        function checkLogin() {
            const savedName = localStorage.getItem('userName');
            const savedId = localStorage.getItem('userId');
            if (savedName && savedId) {
                currentUserName = savedName;
                currentUserId = savedId;
                document.getElementById('loginOverlay').classList.remove('active');
                updateUI();
                return true;
            }
            return false;
        }

        function updateUI() {
            const letter = currentUserName.charAt(0).toUpperCase();
            document.getElementById('userNameDisplay').textContent = currentUserName;
            document.getElementById('avatarLetter').textContent = letter;
            document.getElementById('uploadAvatar').textContent = letter;
        }

        document.getElementById('userInfo').onclick = () => {
            const newName = prompt('✏️ أدخل اسمك الجديد:', currentUserName);
            if (newName && newName.trim() && newName.trim().length >= 2) {
                currentUserName = newName.trim();
                localStorage.setItem('userName', currentUserName);
                updateUI();
                showToast('✅ تم تغيير الاسم إلى ' + currentUserName, 2000);
            }
        };

        // ============================================================
        // ===== ضغط الصورة (محسّن للسرعة) =====
        // ============================================================
        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width,
                            h = img.height;
                        if (w > maxWidth) { h = (h * maxWidth) / w;
                            w = maxWidth; }
                        if (h > maxHeight) { w = (w * maxHeight) / h;
                            h = maxHeight; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ============================================================
        // ===== تحويل DataURL إلى File =====
        // ============================================================
        function dataURLtoFile(dataURL, filename) {
            const arr = dataURL.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new File([u8arr], filename, { type: mime });
        }

        // ============================================================
        // ===== رفع الوسائط لـ Cloudinary =====
        // ============================================================
        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);

            try {
                const response = await fetch(CLOUDINARY_URL, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.secure_url) {
                    return result.secure_url;
                } else {
                    throw new Error(result.error?.message || 'فشل الرفع');
                }
            } catch (error) {
                console.warn('⚠️ فشل الرفع للسحابة:', error.message);
                if (file.type.startsWith('image/')) {
                    return await compressImage(file);
                } else {
                    throw new Error('فشل رفع الفيديو');
                }
            }
        }

        // ============================================================
        // ===== تحديث شريط التقدم =====
        // ============================================================
        function updateProgress(percent, message) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            if (progressBar) progressBar.style.width = percent + '%';
            if (progressText) progressText.textContent = message;
            console.log(`📊 التقدم: ${percent}% - ${message}`);
        }

        // ============================================================
        // ===== وظائف مساعدة =====
        // ============================================================
        function getAvatarColor(id) {
            const colors = ['#4facfe', '#a18cd1', '#fbc2eb', '#f6d365', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96c93d'];
            let hash = 0;
            for (let i = 0; i < id.length; i++) {
                hash = id.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getTime(timestamp) {
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return 'الآن';
            if (diff < 3600) return Math.floor(diff / 60) + ' دقيقة';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ساعة';
            if (diff < 604800) return Math.floor(diff / 86400) + ' يوم';
            return new Date(timestamp).toLocaleDateString('ar-EG');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // ===== النشر (محسّن مع شريط تقدم) =====
        // ============================================================
        async function publishPost() {
            const text = document.getElementById('postTextInput').value.trim();
            const media = tempMediaFile;

            if (!text && !media) {
                showToast('⚠️ الرجاء كتابة نص أو إضافة وسائط', 2500);
                return;
            }

            const btn = document.getElementById('publishBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري النشر...';

            // إظهار شريط التقدم
            const progressContainer = document.getElementById('progressContainer');
            progressContainer.style.display = 'block';
            updateProgress(0, '⏳ بدء النشر...');

            try {
                let mediaUrl = null;
                let mediaType = null;

                if (media) {
                    updateProgress(10, '⏳ جاري تجهيز الملف...');

                    // إذا كانت صورة، نضغطها أولاً
                    let fileToUpload = media.file;
                    if (media.type === 'image' && media.file && media.file.size > 500000) {
                        updateProgress(20, '⏳ جاري ضغط الصورة...');
                        const compressed = await compressImage(media.file);
                        fileToUpload = dataURLtoFile(compressed, media.file.name);
                        console.log('✅ تم ضغط الصورة بنجاح');
                    }

                    updateProgress(40, '⏳ جاري رفع الوسائط...');
                    const url = await uploadToCloudinary(fileToUpload);
                    mediaUrl = url;
                    mediaType = media.type;
                    updateProgress(70, '✅ تم رفع الوسائط');
                }

                updateProgress(80, '⏳ جاري حفظ المنشور...');

                const post = {
                    id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                    text: text || '',
                    mediaUrl: mediaUrl,
                    mediaType: mediaType,
                    userId: currentUserId,
                    userName: currentUserName,
                    timestamp: Date.now(),
                    likes: 0,
                    likedBy: [],
                    comments: []
                };

                allPosts.unshift(post);
                await savePostsToFirebase(allPosts);

                updateProgress(100, '✅ تم النشر بنجاح! 🎉');
                showToast('✅ تم نشر المنشور بنجاح', 2000);

                document.getElementById('postTextInput').value = '';
                removeMedia();
                renderPosts(allPosts);

            } catch (error) {
                console.error('❌ خطأ في النشر:', error);
                updateProgress(0, '⚠️ فشل النشر');
                showToast('⚠️ فشل النشر: ' + error.message, 4000);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> نشر';

                // إخفاء شريط التقدم بعد 3 ثواني
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                }, 3000);
            }
        }

        // ============================================================
        // ===== تحميل وعرض المنشورات =====
        // ============================================================
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            const loading = container.querySelector('.loading-spinner');
            if (loading) loading.style.display = 'block';

            try {
                await loadPostsFromFirebase();
                renderPosts(allPosts);
                console.log('📊 عدد المنشورات:', allPosts.length);
            } catch (error) {
                console.error('❌ خطأ في تحميل المنشورات:', error);
                showToast('⚠️ فشل تحميل المنشورات', 3000);
            } finally {
                if (loading) loading.style.display = 'none';
            }
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            const emptyState = document.getElementById('emptyState');

            const loading = container.querySelector('.loading-spinner');
            if (loading) loading.style.display = 'none';

            if (!posts || posts.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = '';

            posts.forEach((post) => {
                const isLiked = post.likedBy && post.likedBy.includes(currentUserId);
                const userName = post.userName || 'مستخدم';
                const avatarColor = getAvatarColor(post.userId);
                const timeAgo = getTime(post.timestamp);
                const isOwner = post.userId === currentUserId;

                const hasText = post.text && post.text.trim() !== '';
                const textHTML = hasText ?
                    `<div class="post-text">${escapeHtml(post.text)}</div>` :
                    '';

                let mediaHTML = '';
                const hasMedia = post.mediaUrl && post.mediaUrl !== null && post.mediaUrl !== '';
                if (hasMedia) {
                    const isVideo = post.mediaType === 'video';
                    if (isVideo) {
                        mediaHTML = `
                            <div class="post-media-wrapper visible">
                                <video controls src="${post.mediaUrl}" preload="metadata"></video>
                            </div>
                        `;
                    } else {
                        mediaHTML = `
                            <div class="post-media-wrapper visible" onclick="openLightbox('${post.mediaUrl}', '${userName}', '${timeAgo}', 'image')">
                                <img src="${post.mediaUrl}" alt="صورة" loading="lazy" />
                            </div>
                        `;
                    }
                }

                let commentsHTML = '';
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach(comment => {
                        const cUser = comment.userName || 'مستخدم';
                        const cColor = getAvatarColor(comment.userId);
                        const cTime = getTime(comment.timestamp);
                        commentsHTML += `
                            <div class="comment-item">
                                <div class="comment-avatar" style="background:${cColor};">${cUser.charAt(0).toUpperCase()}</div>
                                <div class="comment-body">
                                    <div class="comment-user">${cUser}</div>
                                    <div class="comment-text">${escapeHtml(comment.text)}</div>
                                    <div class="comment-time">${cTime}</div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    commentsHTML = `<div class="no-comments"><p>لا توجد تعليقات بعد</p></div>`;
                }

                const card = document.createElement('div');
                card.className = 'post-card';
                card.id = `post-${post.id}`;
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-user" onclick="openProfile('${post.userId}')">
                            <div class="post-avatar" style="background:${avatarColor};">${userName.charAt(0).toUpperCase()}</div>
                            <div>
                                <div class="post-username">${userName} ${isOwner ? '<span class="owner-badge">👤</span>' : ''}</div>
                                <div class="post-time"><i class="fa-regular fa-clock"></i> ${timeAgo}</div>
                            </div>
                        </div>
                        <div>
                            <button class="delete-btn" onclick="deletePost('${post.id}')" title="حذف المنشور">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div class="post-content">${textHTML}</div>
                    ${mediaHTML}
                    <div class="post-actions">
                        <button class="${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')" id="like-btn-${post.id}">
                            <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-thumbs-up"></i>
                            <span>إعجاب</span>
                            <span class="action-count" id="like-count-${post.id}">${post.likes > 0 ? `(${post.likes})` : ''}</span>
                        </button>
                        <button onclick="toggleComments('${post.id}')">
                            <i class="fa-regular fa-comment"></i>
                            <span>تعليق</span>
                            ${post.comments && post.comments.length > 0 ? `<span class="action-count">(${post.comments.length})</span>` : ''}
                        </button>
                        <button onclick="sharePost('${post.mediaUrl || ''}', '${escapeHtml(post.text || '').replace(/'/g, "\\'")}')">
                            <i class="fa-regular fa-share-from-square"></i>
                            <span>مشاركة</span>
                        </button>
                    </div>
                    <div class="comments-section" id="comments-${post.id}">
                        <div class="comments-header">
                            <h4>💬 التعليقات</h4>
                            <span class="comment-count">${post.comments ? post.comments.length : 0}</span>
                        </div>
                        <div class="comments-list">${commentsHTML}</div>
                        <div class="add-comment">
                            <input type="text" id="commentInput-${post.id}" placeholder="اكتب تعليقاً..." />
                            <button class="send-btn" onclick="addCommentHandler('${post.id}')">
                                <i class="fa-regular fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);

                const input = card.querySelector(`#commentInput-${post.id}`);
                if (input) {
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            addCommentHandler(post.id);
                        }
                    };
                }
            });
        }

        // ============================================================
        // ===== الإعجابات =====
        // ============================================================
        async function toggleLike(postId) {
            try {
                console.log('❤️ جاري معالجة الإعجاب للمنشور:', postId);

                const postIndex = allPosts.findIndex(p => p.id === postId);
                if (postIndex === -1) {
                    showToast('⚠️ المنشور غير موجود', 2000);
                    return;
                }

                const post = allPosts[postIndex];

                if (!post.likedBy) post.likedBy = [];
                if (typeof post.likes !== 'number') post.likes = 0;

                const userIndex = post.likedBy.indexOf(currentUserId);
                if (userIndex === -1) {
                    post.likedBy.push(currentUserId);
                    post.likes = (post.likes || 0) + 1;
                    console.log('👍 تم إضافة إعجاب، العدد:', post.likes);
                } else {
                    post.likedBy.splice(userIndex, 1);
                    post.likes = (post.likes || 0) - 1;
                    console.log('👎 تم إزالة الإعجاب، العدد:', post.likes);
                }

                allPosts[postIndex] = post;

                const success = await savePostsToFirebase(allPosts);
                if (!success) {
                    console.warn('⚠️ فشل الحفظ، إعادة الحالة السابقة');
                    renderPosts(allPosts);
                    showToast('⚠️ فشل حفظ الإعجاب، حاول مرة أخرى', 3000);
                    return;
                }

                updateLikeUI(postId, post.likes, post.likedBy.includes(currentUserId));
                console.log('✅ تم حفظ الإعجاب بنجاح في Firebase');

            } catch (error) {
                console.error('❌ فشل تحديث الإعجاب:', error);
                showToast('⚠️ فشل تحديث الإعجاب: ' + error.message, 3000);
            }
        }

        function updateLikeUI(postId, likes, isLiked) {
            const likeBtn = document.getElementById(`like-btn-${postId}`);
            const likeCount = document.getElementById(`like-count-${postId}`);

            if (likeBtn) {
                const icon = likeBtn.querySelector('i');
                if (icon) {
                    icon.className = isLiked ? 'fa-solid fa-thumbs-up' : 'fa-regular fa-thumbs-up';
                }
                likeBtn.className = isLiked ? 'liked' : '';
            }

            if (likeCount) {
                likeCount.textContent = likes > 0 ? `(${likes})` : '';
            }
        }

        // ============================================================
        // ===== التعليقات =====
        // ============================================================
        async function addCommentHandler(postId) {
            try {
                const input = document.getElementById(`commentInput-${postId}`);
                if (!input || !input.value.trim()) {
                    showToast('⚠️ الرجاء كتابة تعليق', 2000);
                    return;
                }

                const post = allPosts.find(p => p.id === postId);
                if (!post) {
                    showToast('⚠️ المنشور غير موجود', 2000);
                    return;
                }

                if (!post.comments) post.comments = [];
                const newComment = {
                    id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                    userId: currentUserId,
                    userName: currentUserName,
                    text: input.value.trim(),
                    timestamp: Date.now()
                };
                post.comments.push(newComment);

                const success = await savePostsToFirebase(allPosts);
                if (!success) {
                    showToast('⚠️ فشل حفظ التعليق، حاول مرة أخرى', 3000);
                    return;
                }

                input.value = '';
                renderPosts(allPosts);
                showToast('💬 تم إضافة تعليق', 1500);
                console.log('✅ تم حفظ التعليق بنجاح في Firebase');

            } catch (error) {
                console.error('❌ فشل إضافة التعليق:', error);
                showToast('⚠️ فشل إضافة التعليق', 3000);
            }
        }

        // ============================================================
        // ===== باقي الدوال =====
        // ============================================================
        function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            if (section) {
                section.classList.toggle('visible');
            }
        }

        async function deletePost(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) {
                showToast('⚠️ المنشور غير موجود', 2000);
                return;
            }

            if (post.userId !== currentUserId) {
                showToast('⛔ لا يمكنك حذف منشور مستخدم آخر', 3000);
                return;
            }

            showConfirm('تأكيد الحذف', 'هل أنت متأكد من حذف هذا المنشور؟', async () => {
                try {
                    allPosts = allPosts.filter(p => p.id !== postId);
                    await savePostsToFirebase(allPosts);

                    const card = document.getElementById(`post-${postId}`);
                    if (card) {
                        card.classList.add('deleting');
                        setTimeout(() => {
                            card.remove();
                            if (allPosts.length === 0) {
                                document.getElementById('emptyState').style.display = 'block';
                            }
                        }, 300);
                    } else {
                        renderPosts(allPosts);
                    }

                    showToast('🗑️ تم حذف المنشور بنجاح', 2000);

                } catch (error) {
                    console.error('❌ فشل الحذف:', error);
                    showToast('⚠️ فشل حذف المنشور: ' + error.message, 3000);
                }
            });
        }

        function openProfile(userId) {
            const userPosts = allPosts.filter(p => p.userId === userId);
            const userName = userId === currentUserId ? currentUserName : 'مستخدم ' + userId.substring(0, 6);
            showToast(`📝 ${userName} لديه ${userPosts.length} منشور`, 2500);
        }

        function openLightbox(src, userName, time, type = 'image') {
            const img = document.getElementById('lightboxImage');
            const video = document.getElementById('lightboxVideo');
            const info = document.getElementById('lightboxInfo');

            if (type === 'video') {
                img.style.display = 'none';
                video.style.display = 'block';
                video.src = src;
                video.load();
                video.play();
            } else {
                video.style.display = 'none';
                video.pause();
                img.style.display = 'block';
                img.src = src;
            }
            info.textContent = `${userName} · ${time}`;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
            const video = document.getElementById('lightboxVideo');
            video.pause();
        }

        function sharePost(imageSrc, text) {
            const shareText = text || '📸 شاهد هذا المنشور!';
            if (navigator.share) {
                navigator.share({ title: 'المعرض', text: shareText }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('📋 تم نسخ النص للحافظة');
                }).catch(() => {
                    showToast('📋 يمكنك مشاركة هذا المنشور يدوياً');
                });
            }
        }

        // ============================================================
        // ===== إدارة الوسائط المؤقتة =====
        // ============================================================
        document.getElementById('fileInput').onchange = async function() {
            const file = this.files[0];
            if (!file) return;

            const isImage = file.type.startsWith('image/');
            const isVideo = file.type.startsWith('video/');

            if (!isImage && !isVideo) {
                showToast('⚠️ الرجاء اختيار صورة أو فيديو');
                this.value = '';
                return;
            }

            if (isVideo && file.size > 100 * 1024 * 1024) {
                showToast('⚠️ حجم الفيديو كبير جداً (الحد الأقصى 100 ميجابايت)', 3000);
                this.value = '';
                return;
            }

            try {
                let dataUrl = null;
                let type = 'image';
                if (isImage) {
                    // ضغط سريع للمعاينة
                    dataUrl = await compressImage(file, 400, 400, 0.5);
                    type = 'image';
                } else {
                    dataUrl = URL.createObjectURL(file);
                    type = 'video';
                }

                tempMediaFile = { file, dataUrl, type };

                const imgPreview = document.getElementById('mediaPreviewImg');
                const videoPreview = document.getElementById('mediaPreviewVideo');
                const container = document.getElementById('mediaPreviewContainer');

                if (type === 'video') {
                    imgPreview.style.display = 'none';
                    videoPreview.style.display = 'block';
                    videoPreview.src = dataUrl;
                    videoPreview.load();
                } else {
                    videoPreview.style.display = 'none';
                    imgPreview.style.display = 'block';
                    imgPreview.src = dataUrl;
                }

                container.classList.add('visible');
                document.querySelector('.media-btn').classList.add('has-media');
                document.getElementById('mediaBtnText').textContent = 'تغيير الوسائط';
                showToast('✅ تم إضافة الوسائط', 1500);

            } catch (error) {
                console.error('❌ خطأ في معالجة الوسائط:', error);
                showToast('⚠️ حدث خطأ في معالجة الوسائط', 3000);
            }
            this.value = '';
        };

        function removeMedia() {
            if (tempMediaFile && tempMediaFile.type === 'video') {
                URL.revokeObjectURL(tempMediaFile.dataUrl);
            }
            tempMediaFile = null;
            document.getElementById('mediaPreviewImg').style.display = 'none';
            document.getElementById('mediaPreviewVideo').style.display = 'none';
            document.getElementById('mediaPreviewVideo').src = '';
            document.getElementById('mediaPreviewContainer').classList.remove('visible');
            document.querySelector('.media-btn').classList.remove('has-media');
            document.getElementById('mediaBtnText').textContent = 'إضافة صورة / فيديو';
        }

        // ============================================================
        // ===== نافذة التأكيد =====
        // ============================================================
        function showConfirm(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').classList.add('active');
            confirmCallback = onConfirm;
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('active');
            confirmCallback = null;
        }

        document.getElementById('confirmYesBtn').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        };

        // ============================================================
        // ===== رسائل الإشعار =====
        // ============================================================
        function showToast(message, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ============================================================
        // ===== اختصارات =====
        // ============================================================
        document.getElementById('postTextInput').onkeydown = (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                publishPost();
            }
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
                closeConfirm();
            }
        });

        // ============================================================
        // ===== تهيئة التطبيق =====
        // ============================================================
        async function initApp() {
            if (!checkLogin()) {
                document.getElementById('loginOverlay').classList.add('active');
                document.getElementById('loginNameInput').focus();
                return;
            }
            try {
                await loadPosts();
                listenForUpdates();
                showToast(`👋 مرحباً ${currentUserName}!`, 2000);
            } catch (error) {
                console.error('❌ خطأ:', error);
                showToast('⚠️ حدث خطأ في تهيئة التطبيق', 3000);
            }
        }

        initApp();
    </script>
</body>
</html>
