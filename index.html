  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفعيل التطبيق</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Tahoma, Arial;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.card {
  background: #fff;
  max-width: 400px;
  width: 100%;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  text-align: center;
}
input, button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-sizing: border-box;
}
input {
  border: 2px solid #ddd;
}
button {
  background: linear-gradient(to right, #4CAF50, #2E7D32);
  color: #fff;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
#timer {
  margin-top: 20px;
  padding: 15px;
  background: #f8f9fa;
  border-radius: 10px;
  font-weight: bold;
}
.success-box {
  background:#4CAF50;
  color:#fff;
  padding:15px;
  border-radius:10px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="card">
  <h3>تفعيل التطبيق</h3>
  <input type="text" id="cardCode" placeholder="أدخل رقم الكرت">
  <button onclick="activate()">تفعيل الآن</button>
  <div id="timer"></div>
</div>

<script>

/* ========== Supabase ========== */
const SUPABASE_URL = "https://pbqkluiodqsmdtuoomas.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBicWtsdWlvZHFzbWR0dW9vbWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NTQxNDcsImV4cCI6MjEwNTEzMDE0N30.PS-Pz1M8s7gUGcrU3l2ucGjRR64vZksHaFWLWrmvFSk";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ========== Device ID ========== */
function getDeviceId(){
  let id = localStorage.getItem("device_id");

  if(!id){
    id = "dev-" + Math.random().toString(36).substr(2,16);
    localStorage.setItem("device_id", id);
  }

  return id;
}

/* ========== التفعيل ========== */
async function activate(){

  let code = document.getElementById("cardCode").value.trim();

  if(!code){
    alert("أدخل رقم الكرت");
    return;
  }

  // جلب بيانات الكرت من Supabase
  const { data, error } = await supabaseClient
    .from("cards")
    .select("*")
    .eq("code", code)
    .maybeSingle();

  if(error){
    console.error(error);
    alert("حدث خطأ في الاتصال بقاعدة البيانات");
    return;
  }

  if(!data){
    alert("الكرت غير صحيح");
    return;
  }

  let device = getDeviceId();

  if(data.used && data.device !== device){
    alert("الكرت مستخدم على جهاز آخر");
    return;
  }

  if(!data.used){
    const { error: updateError } = await supabaseClient
      .from("cards")
      .update({ used: true, device: device })
      .eq("code", code);

    if(updateError){
      console.error(updateError);
      alert("تعذر تحديث بيانات الكرت");
      return;
    }
  }

  /* حفظ الكرت محلياً */
  localStorage.setItem("saved_card", code);

  // عرض رسالة نجاح
  document.getElementById("timer").innerHTML = `
    <div class="success-box">✅ تم التفعيل بنجاح — جاري التحويل...</div>
  `;

  // ✅ فتح صفحة results.html
  setTimeout(()=>{
    window.location = "results.html";
  },1500);
}

/* ========== التحقق التلقائي من الكرت المحفوظ ========== */
window.onload = async function(){

  let savedCard = localStorage.getItem("saved_card");

  if(!savedCard){
    return;
  }

  document.getElementById("cardCode").value = savedCard;

  const { data, error } = await supabaseClient
    .from("cards")
    .select("*")
    .eq("code", savedCard)
    .maybeSingle();

  if(error || !data){
    localStorage.removeItem("saved_card");
    return;
  }

  let device = getDeviceId();

  if(data.used && data.device === device){
    // ✅ الكرت محفوظ وصحيح → فتح results.html مباشرة
    setTimeout(()=>{
      window.location = "results.html";
    },800);
  }else{
    localStorage.removeItem("saved_card");
  }
};

</script>

</body>
</html>
