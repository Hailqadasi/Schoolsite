 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧸 طفولتي - ذكريات الأطفال</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        /* ===== جميع التنسيقات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f7ff 0%, #e3f2fd 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .login-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .login-overlay.active {
            display: flex;
        }
        .login-box {
            background: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-box .login-icon {
            font-size: 64px;
            color: #4fc3f7;
            margin-bottom: 16px;
        }
        .login-box h2 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .login-box p {
            font-size: 14px;
            color: #65676b;
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e4e6eb;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: #f0f2f5;
        }
        .login-box input:focus {
            border-color: #4fc3f7;
            background: #fff;
        }
        .login-box .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #4fc3f7;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s;
        }
        .login-box .login-btn:hover {
            background: #29b6f6;
            transform: scale(1.02);
        }
        .login-box .login-error {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .login-box .login-error.show {
            display: block;
        }
        .page-header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .page-header h1 {
            font-size: 22px;
            color: #1a1a1a;
        }
        .page-header h1 i {
            color: #4fc3f7;
        }
        .page-header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #65676b;
            cursor: pointer;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            background: #f0f2f5;
            transition: all 0.3s;
        }
        .page-header .user-info:hover {
            background: #e4e6eb;
        }
        .page-header .user-info .user-name-display {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 14px;
        }
        .page-header .user-info .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4fc3f7, #81d4fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: #a5d6a7;
            color: #2e7d32;
        }
        .status-badge i {
            font-size: 8px;
        }
        .status-badge.loading {
            background: #fff3e0;
            color: #e65100;
        }
        .status-badge.error {
            background: #ef9a9a;
            color: #c62828;
        }
        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            gap: 4px;
            backdrop-filter: blur(10px);
        }
        .nav-tabs button {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #65676b;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nav-tabs button:hover {
            background: #f0f2f5;
        }
        .nav-tabs button.active {
            background: #4fc3f7;
            color: #fff;
        }
        .nav-tabs button i {
            font-size: 16px;
        }
        .upload-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: none;
            backdrop-filter: blur(10px);
        }
        .upload-section.active {
            display: block;
        }
        .upload-section .upload-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .upload-section .upload-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4fc3f7, #81d4fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            flex-shrink: 0;
            font-size: 18px;
        }
        .upload-section .upload-textarea {
            flex: 1;
            min-height: 60px;
            padding: 10px 14px;
            border: 1px solid #e4e6eb;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            resize: vertical;
            background: #f0f2f5;
            font-family: inherit;
            transition: all 0.3s;
        }
        .upload-section .upload-textarea:focus {
            border-color: #4fc3f7;
            background: #fff;
        }
        .upload-section .upload-textarea::placeholder {
            color: #65676b;
        }
        .upload-section .upload-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid #f0f2f5;
        }
        .upload-section .upload-tools .tools-left {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .upload-section .upload-tools .tools-left button {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: #f0f2f5;
            color: #65676b;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .upload-section .upload-tools .tools-left button:hover {
            background: #e4e6eb;
        }
        .upload-section .upload-tools .tools-left .media-btn {
            color: #4fc3f7;
        }
        .upload-section .upload-tools .tools-left .media-btn.has-media {
            background: #4fc3f7;
            color: #fff;
        }
        .upload-section .upload-tools .publish-btn {
            padding: 8px 28px;
            border: none;
            border-radius: 20px;
            background: #4fc3f7;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .upload-section .upload-tools .publish-btn:hover {
            background: #29b6f6;
            transform: scale(1.02);
        }
        .upload-section .upload-tools .publish-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .upload-section .media-preview-container {
            display: none;
            margin-top: 12px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #f0f2f5;
            min-height: 50px;
        }
        .upload-section .media-preview-container.visible {
            display: block;
        }
        .upload-section .media-preview-container img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            background: #fff;
        }
        .upload-section .media-preview-container .remove-media {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .upload-section .media-preview-container .remove-media:hover {
            background: rgba(255, 0, 0, 0.7);
        }
        .upload-progress {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #f0f2f5;
            border-radius: 8px;
        }
        .upload-progress.active {
            display: block;
        }
        .upload-progress .progress-bar {
            width: 100%;
            height: 6px;
            background: #e4e6eb;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;
        }
        .upload-progress .progress-bar .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4fc3f7, #81d4fa);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .upload-progress .progress-text {
            font-size: 13px;
            color: #65676b;
            display: flex;
            justify-content: space-between;
        }
        .upload-progress .progress-status {
            font-size: 12px;
            color: #4fc3f7;
            font-weight: 500;
        }
        .upload-progress .progress-error {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .upload-progress .progress-error.show {
            display: block;
        }
        .post-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-bottom: 20px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .post-card:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }
        .post-header {
            padding: 12px 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f2f5;
        }
        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .post-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .post-username {
            font-weight: 600;
            font-size: 14px;
            color: #1a1a1a;
        }
        .post-username:hover {
            text-decoration: underline;
        }
        .post-time {
            font-size: 12px;
            color: #65676b;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-content {
            padding: 12px 16px 8px;
        }
        .post-text {
            font-size: 15px;
            color: #1a1a1a;
            line-height: 1.7;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .post-media-wrapper {
            background: #f0f2f5;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        .post-media-wrapper.visible {
            display: flex;
        }
        .post-media-wrapper img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            display: block;
            background: #fff;
        }
        .post-actions {
            display: flex;
            justify-content: space-around;
            padding: 6px 16px;
            border-top: 1px solid #f0f2f5;
            border-bottom: 1px solid #f0f2f5;
        }
        .post-actions button {
            flex: 1;
            padding: 8px 6px;
            border: none;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #65676b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .post-actions button:hover {
            background: #f0f2f5;
        }
        .post-actions button.liked {
            color: #4fc3f7;
        }
        .post-actions button.liked i {
            font-weight: 900;
        }
        .post-actions button i {
            font-size: 16px;
        }
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #65676b;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            background: #f0f2f5;
            color: #ff4d4d;
        }
        .comments-section {
            padding: 10px 16px 14px;
            background: #fafafa;
            border-top: 1px solid #f0f2f5;
            display: none;
        }
        .comments-section.visible {
            display: block;
        }
        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .comments-header h4 {
            font-size: 13px;
            color: #65676b;
            font-weight: 500;
        }
        .comments-header .comment-count {
            background: #e4e6eb;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #65676b;
        }
        .comments-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .comment-item {
            display: flex;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f2f5;
            animation: fadeIn 0.3s ease;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .comment-body {
            flex: 1;
        }
        .comment-user {
            font-weight: 600;
            font-size: 12px;
            color: #1a1a1a;
        }
        .comment-text {
            font-size: 13px;
            color: #1a1a1a;
            word-wrap: break-word;
        }
        .comment-time {
            font-size: 10px;
            color: #65676b;
            margin-top: 2px;
        }
        .no-comments {
            text-align: center;
            color: #65676b;
            font-size: 13px;
            padding: 15px 0;
        }
        .add-comment {
            display: flex;
            gap: 8px;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid #f0f2f5;
        }
        .add-comment input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #e4e6eb;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
            background: #f0f2f5;
        }
        .add-comment input:focus {
            border-color: #4fc3f7;
            background: #fff;
        }
        .add-comment .send-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #4fc3f7;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .add-comment .send-btn:hover {
            background: #29b6f6;
            transform: scale(1.05);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .empty-state i {
            font-size: 80px;
            color: #ccd0d5;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            color: #65676b;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .empty-state p {
            color: #8a8f94;
            font-size: 14px;
        }
        .profile-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: none;
            backdrop-filter: blur(10px);
        }
        .profile-section.active {
            display: block;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #4fc3f7, #81d4fa);
        }
        .profile-info {
            flex: 1;
        }
        .profile-info h2 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .profile-info .profile-stats {
            display: flex;
            gap: 20px;
            color: #65676b;
            font-size: 14px;
        }
        .profile-info .profile-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .profile-info .profile-bio {
            margin-top: 8px;
            color: #65676b;
            font-size: 14px;
        }
        .profile-back-btn {
            background: #f0f2f5;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            color: #65676b;
            font-weight: 500;
            transition: all 0.3s;
        }
        .profile-back-btn:hover {
            background: #e4e6eb;
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }
        .lightbox .close-lightbox {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .lightbox .close-lightbox:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(90deg);
        }
        .lightbox .lightbox-info {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
        }
        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .custom-modal.active {
            display: flex;
        }
        .custom-modal .modal-content {
            background: #fff;
            border-radius: 16px;
            padding: 30px 35px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: scaleIn 0.3s ease;
        }
        .custom-modal .modal-content .modal-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: #ff6b6b;
        }
        .custom-modal .modal-content h3 {
            font-size: 20px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .custom-modal .modal-content p {
            font-size: 15px;
            color: #65676b;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .custom-modal .modal-content .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .custom-modal .modal-content .modal-buttons button {
            padding: 10px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .custom-modal .modal-content .modal-buttons .confirm-btn {
            background: #ff4d4d;
            color: #fff;
        }
        .custom-modal .modal-content .modal-buttons .confirm-btn:hover {
            background: #e04444;
            transform: scale(1.02);
        }
        .custom-modal .modal-content .modal-buttons .cancel-btn {
            background: #f0f2f5;
            color: #65676b;
        }
        .custom-modal .modal-content .modal-buttons .cancel-btn:hover {
            background: #e4e6eb;
        }
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 15px;

        // ============================================================
        // ===== وظائف Supabase =====
        // ============================================================
        async function uploadImageToSupabase(file) {
            if (!supabaseReady) {
                throw new Error('⚠️ قاعدة البيانات غير جاهزة');
            }

            const compressedData = await processImage(file);
            
            const byteCharacters = atob(compressedData.base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'image/jpeg' });

            const fileName = `${Date.now()}_${file.name.replace(/\s/g, '_')}`;

            const { data: uploadData, error: uploadError } = await supabase
                .storage
                .from('images')
                .upload(fileName, blob, {
                    contentType: 'image/jpeg',
                    cacheControl: '3600'
                });

            if (uploadError) {
                console.error('❌ فشل رفع الصورة:', uploadError);
                throw new Error('فشل رفع الصورة: ' + uploadError.message);
            }

            const { data: urlData } = supabase
                .storage
                .from('images')
                .getPublicUrl(fileName);

            return urlData.publicUrl;
        }

        function processImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width,
                            h = img.height;
                        if (w > maxWidth) { h = (h * maxWidth) / w;
                            w = maxWidth; }
                        if (h > maxHeight) { w = (w * maxHeight) / h;
                            h = maxHeight; }
                        
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        const base64Data = dataUrl.split(',')[1];
                        
                        resolve({
                            base64: base64Data,
                            dataUrl: dataUrl,
                            width: w,
                            height: h
                        });
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ============================================================
        // ===== وظائف المنشورات (Supabase) =====
        // ============================================================
        async function savePostToSupabase(post) {
            if (!supabaseReady) {
                throw new Error('⚠️ قاعدة البيانات غير جاهزة');

            const { data, error } = await supabase

            return data;

            const { data, error } = await supabase
                .from('posts')

            if (error) {
                console.error('❌ فشل جلب المنشورات:', error);
                return [];
            }

            return data || [];
        }

        async function deletePostFromSupabase(postId) {
            if (!supabaseReady) {
                throw new Error('⚠️ قاعدة البيانات غير جاهزة');
            }

            const { error } = await supabase
                .from('posts')

        function renderPosts(posts, containerId = 'postsContainer') {

                }

                                <div class="comment-time">${getTime(comment.timestamp)}</div>
                            </div>
                        </div>
                    `).join('') :
                    '<div class="no-comments"><p>لا توجد تعليقات بعد</p></div>';

                const card = document.createElement('div');

                            <i class="fa-regular fa-share-from-square"></i>
                            <span>مشاركة</span>
                        </button>
                    </div>
                    <div class="comments-section" id="comments-${post.id}">
                        <div class="comments-header">
                            <h4>💬 التعليقات</h4>
                            <span class="comment-count">${comments.length}</span>
                        </div>
                        <div class="comments-list">${commentsHTML}</div>
                        <div class="add-comment">
                            <input type="text" id="commentInput-${post.id}" placeholder="اكتب تعليقاً..." />
                            <button class="send-btn" onclick="addCommentHandler(${post.id})">
                                <i class="fa-regular fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);

                const input = card.querySelector(`#commentInput-${post.id}`);
                if (input) {
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            addCommentHandler(post.id);
                        }
                    };
                }
            });
        }

        // ============================================================
        // ===== الإعجابات =====
        // ============================================================
        async function toggleLike(postId) {
            if (!supabaseReady) return;

            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            const likedBy = post.liked_by || [];
            const idx = likedBy.indexOf(currentUserId);

            if (idx === -1) {
                likedBy.push(currentUserId);
            } else {
                likedBy.splice(idx, 1);
            }

            post.likes = likedBy.length;
            post.liked_by = likedBy;

            try {
                await updatePostLikes(postId, post.likes, likedBy);
                const index = allPosts.findIndex(p => p.id === postId);
                if (index !== -1) {
                    allPosts[index] = post;
                }
                renderPosts(allPosts);
            } catch (error) {
                console.error('❌ فشل تحديث الإعجاب:', error);
                showToast('⚠️ فشل تحديث الإعجاب', 2000);
            }
        }

        // ============================================================
        // ===== التعليقات =====
        // ============================================================
        function addCommentHandler(postId) {
            const input = document.getElementById(`commentInput-${postId}`);
            if (!input || !input.value.trim()) return;

            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            if (!post.comments) post.comments = [];

            const comment = {
                id: Date.now(),
                user_id: currentUserId,
                user_name: currentUserName,
                text: input.value.trim(),
                timestamp: Date.now()
            };

            post.comments.push(comment);
            input.value = '';
            renderPosts(allPosts);
            showToast('💬 تم إضافة تعليق', 1500);
        }

        // ============================================================
        // ===== حذف المنشور =====
        // ============================================================
        async function deletePost(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            if (post.user_id !== currentUserId) {
                showToast('⛔ لا يمكنك حذف منشور مستخدم آخر', 3000);
                return;
            }

            showConfirm('تأكيد الحذف', 'هل أنت متأكد من حذف هذه الذكرى؟ 🧸', async () => {
                try {
                    await deletePostFromSupabase(postId);
                    await loadPosts();
                    showToast('🗑️ تم حذف الذكرى');
                } catch (error) {
                    showToast('⚠️ فشل حذف الذكرى', 3000);
                }
            });
        }

        // ============================================================
        // ===== وظائف مساعدة =====
        // ============================================================
        function getAvatarColor(id) {
            const colors = ['#4fc3f7', '#81d4fa', '#b3e5fc', '#4dd0e1', '#26c6da', '#00bcd4', '#80cbc4', '#a5d6a7', '#c8e6c9'];
            let hash = 0;
            for (let i = 0; i < id.length; i++) {
                hash = id.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getTime(timestamp) {
            const diff = Math.floor((Date.now() - timestamp) / 1000);
            if (diff < 60) return 'الآن';
            if (diff < 3600) return Math.floor(diff / 60) + ' دقيقة';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ساعة';
            if (diff < 604800) return Math.floor(diff / 86400) + ' يوم';
            return new Date(timestamp).toLocaleDateString('ar-EG');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addEmoji() {
            const emojis = ['🧸', '👶', '🍼', '🌈', '⭐', '💖', '😊', '❤️', '🎉', '🌟', '✨', '🥰', '😍', '💕', '🌸'];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const textarea = document.getElementById('postTextInput');
            textarea.value += emoji;
            textarea.focus();
        }

        // ============================================================
        // ===== شريط التقدم =====
        // ============================================================
        function showProgress() {
            document.getElementById('uploadProgress').classList.add('active');
            document.getElementById('progressError').classList.remove('show');
            updateProgress(0, 'بدء الرفع...');
        }

        function updateProgress(percent, status) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressStatus').textContent = '📤 ' + status;
            
            if (percent === 100) {
                document.getElementById('progressStatus').textContent = '✅ تم الرفع بنجاح!';
            }
        }

        function hideProgress() {
            document.getElementById('uploadProgress').classList.remove('active');
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressPercent').textContent = '0%';
            document.getElementById('progressStatus').textContent = '⏳ في الانتظار...';
            document.getElementById('progressError').classList.remove('show');
        }

        function showProgressError(message) {
            const errorEl = document.getElementById('progressError');
            errorEl.textContent = '❌ ' + message;
            errorEl.classList.add('show');
            document.getElementById('progressStatus').textContent = '❌ فشل الرفع';
        }

        // ============================================================
        // ===== الملف الشخصي =====
        // ============================================================
        function viewProfile(userId) {
            switchTab('profile');
            loadProfile(userId);
        }

        function loadProfile(userId = null) {
            const profileSection = document.getElementById('profileSection');
            profileSection.classList.add('active');

            const targetId = userId || currentUserId;
            const isOwn = targetId === currentUserId;

            const userPosts = allPosts.filter(p => p.user_id === targetId);
            const name = isOwn ? currentUserName : (userPosts[0]?.user_name || 'مستخدم');

            document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = name;
            document.getElementById('profilePosts').textContent = userPosts.length;
            document.getElementById('profileLikes').textContent = userPosts.reduce((sum, p) => sum + (p.likes || 0), 0);
            document.getElementById('profileBioText').textContent = isOwn ? currentBio : 'مرحباً!';

            const container = document.getElementById('profilePostsContainer');
            if (userPosts.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding:30px 20px;"><i class="fa-regular fa-images"></i><h3>لا توجد ذكريات</h3></div>';
            } else {
                renderPosts(userPosts, 'profilePostsContainer');
            }
        }

        function editBio() {
            const newBio = prompt('✏️ عدل السيرة الذاتية:', currentBio);
            if (newBio && newBio.trim()) {
                currentBio = newBio.trim();
                localStorage.setItem('userBio', currentBio);
                updateUI();
                loadProfile();
                showToast('✅ تم تحديث السيرة الذاتية', 2000);
            }
        }

        // ============================================================
        // ===== التنقل بين التبويبات =====
        // ============================================================
        function switchTab(tab) {
            currentTab = tab;

            document.querySelectorAll('.nav-tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            document.getElementById('uploadSection').classList.toggle('active', tab === 'feed');
            document.getElementById('profileSection').classList.toggle('active', tab === 'profile');
            document.getElementById('postsContainer').style.display = tab === 'feed' ? 'block' : 'none';
            document.getElementById('emptyState').style.display = tab === 'feed' && allPosts.length === 0 ? 'block' : 'none';

            if (tab === 'profile') {
                loadProfile();
            } else if (tab === 'feed') {
                renderPosts(allPosts);
            } else if (tab === 'explore') {
                showToast('🌍 قريباً: استكشاف الذكريات الجميلة', 2000);
            }
        }

        // ============================================================
        // ===== Lightbox =====
        // ============================================================
        function openLightbox(src, userName, time) {
            const img = document.getElementById('lightboxImage');
            const info = document.getElementById('lightboxInfo');

            img.style.display = 'block';
            img.src = src;
            
            info.textContent = `${userName} · ${time}`;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ============================================================
        // ===== المشاركة =====
        // ============================================================
        function sharePost(imageSrc, text) {
            const shareText = text || '🧸 شاهد هذه الذكرى الجميلة!';
            if (navigator.share) {
                navigator.share({ title: 'طفولتي - ذكريات الأطفال', text: shareText }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    showToast('📋 تم نسخ النص للحافظة');
                }).catch(() => {
                    showToast('📋 يمكنك مشاركة هذه الذكرى يدوياً');
                });
            }
        }

        // ============================================================
        // ===== إدارة الصور =====
        // ============================================================
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('⚠️ الرجاء اختيار صورة', 2500);
                this.value = '';
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showToast('⚠️ حجم الصورة كبير جداً (الحد الأقصى 50 ميجابايت)', 3000);
                this.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImage = {
                    file: file,
                    dataUrl: e.target.result
                };
                
                const img = document.getElementById('mediaPreviewImg');
                img.src = e.target.result;
                img.style.display = 'block';
                
                document.getElementById('mediaPreviewContainer').classList.add('visible');
                document.getElementById('mediaBtn').classList.add('has-media');
                document.getElementById('mediaBtnText').textContent = 'تغيير الصورة';
                
                console.log('✅ تم اختيار الصورة:', file.name, '(' + (file.size / 1024).toFixed(2) + ' KB)');
                showToast('✅ تم إضافة الصورة - جاهزة للرفع', 1500);
            };
            reader.readAsDataURL(file);
            
            this.value = '';
        });

        function removeMedia() {
            selectedImage = null;
            document.getElementById('mediaPreviewImg').style.display = 'none';
            document.getElementById('mediaPreviewContainer').classList.remove('visible');
            document.getElementById('mediaBtn').classList.remove('has-media');
            document.getElementById('mediaBtnText').textContent = 'إضافة صورة';
            console.log('🗑️ تم إزالة الصورة المختارة');
        }

        // ============================================================
        // ===== نافذة التأكيد =====
        // ============================================================
        function showConfirm(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').classList.add('active');
            confirmCallback = onConfirm;
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('active');
            confirmCallback = null;
        }

        document.getElementById('confirmYesBtn').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        };

        // ============================================================
        // ===== رسائل الإشعار =====
        // ============================================================
        function showToast(message, duration = 2500) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // ============================================================
        // ===== اختصارات =====
        // ============================================================
        document.getElementById('postTextInput').onkeydown = (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                publishPost();
            }
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
                closeConfirm();
            }
        });

        // ============================================================
        // ===== وظيفة toggleComments =====
        // ============================================================
        function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            if (section) {
                section.style.display = section.style.display === 'none' || section.style.display === '' ? 'block' : 'none';
            }
        }

        // ============================================================
        // ===== تهيئة التطبيق =====
        // ============================================================
        async function initApp() {
            updateStatus('loading');
            
            if (!checkLogin()) {
                document.getElementById('loginOverlay').classList.add('active');
                document.getElementById('loginNameInput').focus();
                return;
            }
            
            console.log('🚀 تطبيق "طفولتي" جاهز! 🧸');
            console.log('📁 قاعدة البيانات: Supabase');
            
            if (supabaseReady) {
                await loadPosts();
            }
        }

        initApp();
    </script>
</body>
</html>
