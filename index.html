<script>


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAhh7mLHhKQsauhSTbojBVgtraLZLA3fcc",

    authDomain:
        "tofolati-38ac4.firebaseapp.com",

    databaseURL:
        "https://tofolati-38ac4-default-rtdb.firebaseio.com",

    projectId:
        "tofolati-38ac4",

    storageBucket:
        "tofolati-38ac4.firebasestorage.app",

    messagingSenderId:
        "635017833018",

    appId:
        "1:635017833018:web:3a3b4f5c6d7e8f9a0b1c"
};


/* =====================================================
   CLOUDINARY - مع ضغط الصور
===================================================== */

const CLOUD_NAME = "demo";
const UPLOAD_PRESET = "ml_default";
const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`;


/* =====================================================
   FIREBASE INITIALIZATION
===================================================== */

let database = null;
let currentUserId = "guest_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);

try {

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    database = firebase.database();
    console.log("✅ Firebase initialized");

} catch(error) {
    console.error("Firebase error:", error);
}


/* =====================================================
   STATIC CATEGORIES
===================================================== */

const CATEGORIES = [
    { name: "منتجات", icon: "📦" },
    { name: "سيارات", icon: "🚗" },
    { name: "عقارات", icon: "🏠" },
    { name: "خدمات", icon: "🛠️" },
    { name: "إلكترونيات", icon: "📱" },
    { name: "ملابس", icon: "👕" },
    { name: "أغذية", icon: "🍎" },
    { name: "وظائف", icon: "💼" },
    { name: "تعليم", icon: "📚" },
    { name: "أخرى", icon: "📌" }
];


let allPosts = [];
let selectedCategory = "";


/* =====================================================
   BUILD STATIC CATEGORIES
===================================================== */

function buildCategories() {

    const container = document.getElementById("categories");
    container.innerHTML = "";

    // الكل
    const allButton = document.createElement("button");
    allButton.type = "button";
    allButton.className = "category active";
    allButton.innerHTML = "📋 الكل";
    allButton.onclick = function() {
        selectedCategory = "";
        document.getElementById("categoryFilter").value = "";
        document.querySelectorAll(".category").forEach(button => {
            button.classList.remove("active");
        });
        allButton.classList.add("active");
        loadAds();
    };
    container.appendChild(allButton);

    // التصنيفات
    CATEGORIES.forEach(category => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category";
        button.innerHTML = `${category.icon} ${escapeHtml(category.name)}`;
        button.onclick = function() {
            selectedCategory = category.name;
            document.getElementById("categoryFilter").value = category.name;
            document.querySelectorAll(".category").forEach(button => {
                button.classList.remove("active");
            });
            button.classList.add("active");
            loadAds();
        };
        container.appendChild(button);
    });
}


/* =====================================================
   BUILD CATEGORY SELECT
===================================================== */

function buildCategorySelect() {

    const filter = document.getElementById("categoryFilter");
    const adCategory = document.getElementById("adCategory");

    filter.innerHTML = `<option value="">كل التصنيفات</option>`;
    adCategory.innerHTML = `<option value="">اختر التصنيف</option>`;

    CATEGORIES.forEach(category => {
        const option = document.createElement("option");
        option.value = category.name;
        option.textContent = category.name;
        filter.appendChild(option);

        const option2 = document.createElement("option");
        option2.value = category.name;
        option2.textContent = category.name;
        adCategory.appendChild(option2);
    });
}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts() {

    if (!database) {
        showDatabaseError();
        return;
    }

    try {
        const snapshot = await database.ref("posts").once("value");
        const value = snapshot.val();

        allPosts = [];

        if (value) {
            Object.keys(value).forEach(key => {
                const post = value[key];
                if (post && typeof post === "object") {
                    allPosts.push({
                        ...post,
                        firebaseKey: key
                    });
                }
            });
        }

        allPosts.sort((a, b) => {
            return (Number(b.timestamp || 0) - Number(a.timestamp || 0));
        });

        console.log("الإعلانات:", allPosts.length);
        loadAds();

    } catch(error) {
        console.error("Load posts error:", error);
        document.getElementById("adsContainer").innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                <div class="empty-icon">⚠️</div>

/* =====================================================
   LOAD / FILTER ADS
===================================================== */

function loadAds() {

    const container = document.getElementById("adsContainer");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();
    const category = document.getElementById("categoryFilter").value;
    const city = document.getElementById("cityFilter").value;

    let posts = [...allPosts];

    posts = posts.filter(post => {
        if (post.status && post.status !== "published") return false;
        if (category && String(post.category || "") !== category) return false;
        if (city && String(post.city || "") !== city) return false;
        if (search) {
            const text = String(post.text || "").toLowerCase();
            const title = String(post.title || "").toLowerCase();
            if (!text.includes(search) && !title.includes(search)) return false;
        }
        return true;
    });

    document.getElementById("adsCount").textContent = `${posts.length} إعلان`;
    container.innerHTML = "";

    if (posts.length === 0) {
        container.innerHTML = `
            <div class="empty" style="grid-column:1/-1">
                <div class="empty-icon">🔍</div>
                لا توجد إعلانات مطابقة للبحث حاليًا.
            </div>
        `;
        return;
    }

    posts.forEach(post => {
        createAdCard(post, container);
    });
}


/* =====================================================
   GET IMAGE URL
===================================================== */

function getImageUrl(images) {
    if (!images) return "";
    if (typeof images === "string") return images;
    if (Array.isArray(images)) {
        for (const item of images) {
            if (typeof item === "string" && item) return item;
            if (item && typeof item === "object" && item.url) return item.url;
        }
    }
    if (typeof images === "object") {
        const keys = Object.keys(images);
        for (const key of keys) {
            const item = images[key];
            if (typeof item === "string" && item) return item;
            if (item && typeof item === "object" && item.url) return item.url;
        }
    }
    return "";
}


/* =====================================================
   CREATE AD CARD
===================================================== */

function createAdCard(ad, container) {

    const card = document.createElement("article");
    card.className = "ad-card";

    const imageUrl = getImageUrl(ad.images);
    let imageHTML;

    if (imageUrl) {
        imageHTML = `
            <img class="ad-image" src="${escapeHtml(imageUrl)}" alt="صورة الإعلان" loading="lazy">
        `;
    } else {
        imageHTML = `<div class="no-image">📦</div>`;
    }

    const category = ad.category || "أخرى";
    const text = ad.text || ad.description || "بدون وصف";
    const title = ad.title || text.substring(0, 70);

    let priceHTML = "";
    if (ad.price !== undefined && ad.price !== null && ad.price !== "") {
        priceHTML = `
            <div class="ad-price">
                ${formatNumber(ad.price)}
                ${escapeHtml(ad.currency || "YER")}
            </div>
        `;
    }

    let locationHTML = "";
    if (ad.city) {
        locationHTML = `
            <div class="ad-location">
                📍 ${escapeHtml(ad.city)}
            </div>
        `;
    }

    card.innerHTML = `
        ${imageHTML}
        <div class="ad-content">
            <div class="ad-category">
                ${getCategoryIcon(category)}
                ${escapeHtml(category)}
            </div>
            <div class="ad-title">${escapeHtml(title)}</div>
            <div class="ad-description">${escapeHtml(text)}</div>
            ${priceHTML}
            ${locationHTML}
            <a class="view-ad" href="ad.html?id=${encodeURIComponent(ad.firebaseKey || "")}">
                عرض الإعلان
            </a>
        </div>
    `;

    container.appendChild(card);
}


/* =====================================================
   CATEGORY ICON
===================================================== */

function getCategoryIcon(category) {
    const found = CATEGORIES.find(item => item.name === category);
    if (found) return found.icon;
    return "📦";
}


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(number) {
    const value = Number(number);
    if (Number.isNaN(value)) return "";
    return value.toLocaleString("ar-YE");
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">")
        .replace(/"/g, """)
        .replace(/'/g, "'");
}

/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(event) {

    const file = event.target.files[0];
    const preview = document.getElementById("imagePreview");

    if (!file) {
        preview.src = "";
        preview.style.display = "none";
        return;
    }

    if (!file.type.startsWith("image/")) {
        alert("يرجى اختيار صورة فقط");
        event.target.value = "";
        return;
    }

    // التحقق من حجم الملف (حد أقصى 10 ميجابايت)
    if (file.size > 10 * 1024 * 1024) {
        alert("حجم الصورة كبير جداً. الحد الأقصى 10 ميجابايت.");
        event.target.value = "";
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = "block";
    };
    reader.readAsDataURL(file);
}


/* =====================================================
   COMPRESS IMAGE - دالة ضغط الصورة
===================================================== */

function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
                if (h > maxHeight) { w = (w * maxHeight) / h; h = maxHeight; }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                canvas.toBlob((blob) => {
                    if (blob) {
                        resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                    } else {
                        reject(new Error('فشل ضغط الصورة'));
                    }
                }, 'image/jpeg', quality);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}


/* =====================================================
   DATA URL TO FILE
===================================================== */

function dataURLtoFile(dataURL, filename) {
    const arr = dataURL.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new File([u8arr], filename, { type: mime });
}


/* =====================================================
   CLOUDINARY UPLOAD - مع ضغط الصورة قبل الرفع
===================================================== */

async function uploadImageToCloudinary(file) {

    // ضغط الصورة أولاً (إذا كان حجمها كبيراً)
    let compressedFile = file;
    try {
        if (file.size > 500 * 1024) { // إذا كان حجم الملف أكبر من 500 كيلوبايت
            console.log("📦 جاري ضغط الصورة...");
            compressedFile = await compressImage(file, 800, 800, 0.7);
            console.log("✅ تم ضغط الصورة: " + (compressedFile.size / 1024).toFixed(2) + " KB");
        }
    } catch (error) {
        console.warn("⚠️ فشل ضغط الصورة، سيتم رفع الملف الأصلي:", error);
    }

    const formData = new FormData();
    formData.append("file", compressedFile);
    formData.append("upload_preset", UPLOAD_PRESET);

    try {
        console.log("☁️ جاري رفع الصورة إلى Cloudinary...");
        const response = await fetch(CLOUDINARY_URL, {
            method: "POST",
            body: formData
        });

        const result = await response.json();

        if (!response.ok) {
            console.error("❌ Cloudinary error:", result);
            throw new Error(result.error?.message || "فشل رفع الصورة إلى Cloudinary");
        }

        if (!result.secure_url) {
            throw new Error("لم يتم الحصول على رابط الصورة");
        }

        console.log("✅ تم رفع الصورة بنجاح:", result.secure_url);
        return result.secure_url;

    } catch (error) {
        console.error("❌ Cloudinary upload error:", error);
        throw error;
    }
}


/* =====================================================
   PUBLISH AD
===================================================== */

async function publishAd() {

    const button = document.getElementById("publishBtn");
    const message = document.getElementById("modalMessage");
    const text = document.getElementById("adText").value.trim();
    const category = document.getElementById("adCategory").value;
    const city = document.getElementById("adCity").value;
    const imageInput = document.getElementById("adImage");
    const file = imageInput.files[0];

    // التحقق من الحقول
    if (!text) {
        message.style.color = "#dc2626";
        message.textContent = "✍️ اكتب نص الإعلان أولاً.";
        return;
    }

    if (!category) {
        message.style.color = "#dc2626";
        message.textContent = "🏷️ اختر تصنيف الإعلان.";
        return;
    }

    if (!database) {
        message.style.color = "#dc2626";
        message.textContent = "❌ Firebase غير متصل.";
        return;
    }

    // تعطيل الزر
    button.disabled = true;
    button.textContent = "⏳ جاري النشر...";

    try {
        let imageUrl = "";

        // رفع الصورة إذا كانت موجودة
        if (file) {
            message.style.color = "#777";
            message.textContent = "☁️ جاري رفع الصورة...";

            try {
                imageUrl = await uploadImageToCloudinary(file);
                message.textContent = "✅ تم رفع الصورة بنجاح";
            } catch (uploadError) {
                console.error("❌ رفع الصورة فشل:", uploadError);
                message.style.color = "#dc2626";
                message.textContent = "❌ فشل رفع الصورة: " + (uploadError.message || "خطأ غير معروف");
                button.disabled = false;
                button.textContent = "📢 نشر الإعلان";
                return;
            }
        }

        // إنشاء الإعلان
        message.textContent = "💾 جاري حفظ الإعلان...";

        const newPostRef = database.ref("posts").push();
        const postData = {
            id: newPostRef.key,
            text: text,
            category: category,
            city: city,
            images: imageUrl ? [imageUrl] : [],
            likes: 0,
            timestamp: Date.now(),
            userId: currentUserId,
            userName: "مستخدم",
            status: "published"
        };

        await newPostRef.set(postData);

        // نجاح
        message.style.color = "#15803d";
        message.textContent = "✅ تم نشر الإعلان بنجاح 🎉";

        // تنظيف النموذج
        document.getElementById("adText").value = "";
        document.getElementById("adCategory").value = "";
        document.getElementById("adCity").value = "";
        document.getElementById("adImage").value = "";
        const preview = document.getElementById("imagePreview");
        preview.src = "";
        preview.style.display = "none";

        // تحديث الإعلانات
        await loadPosts();

        setTimeout(function() {
            closeAddModal();
            message.textContent = "";
        }, 1200);

    } catch(error) {
        console.error("❌ Publish error:", error);
        message.style.color = "#dc2626";
        message.textContent = "❌ حدث خطأ: " + (error.message || "تعذر نشر الإعلان");
    } finally {
        button.disabled = false;
        button.textContent = "📢 نشر الإعلان";
    }
}
