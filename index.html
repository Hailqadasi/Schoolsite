 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="صلة - منصة تربط المنتج بالمستهلك، وتساعدك على العثور على المنتجات والخدمات والإعلانات في مكان واحد.">

    <meta name="keywords"
        content="صلة, إعلانات, منتجات, خدمات, بيع, شراء, اليمن">

    <meta name="theme-color"
        content="#0f766e">

    <title>صلة | منصة تربط المنتج بالمستهلك</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Tahoma,
                sans-serif;

            background: #f5f7f8;
            color: #222;
            line-height: 1.7;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;

            position: sticky;
            top: 0;

            z-index: 1000;
        }


        .header-inner {
            max-width: 1150px;
            margin: auto;

            padding: 12px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .logo-icon {
            width: 45px;
            height: 45px;

            background: #0f766e;
            color: white;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }


        .logo-text {
            font-size: 25px;
            font-weight: bold;

            color: #0f766e;
        }


        .logo-subtitle {
            font-size: 11px;
            color: #777;

            margin-top: -5px;
        }


        .header-buttons {
            display: flex;
            gap: 8px;
        }


        .btn {
            border: none;
            cursor: pointer;

            border-radius: 10px;

            padding: 9px 15px;

            font-size: 14px;
            font-weight: bold;
        }


        .btn-login {
            background: #eef7f6;
            color: #0f766e;
        }


        .btn-add {
            background: #0f766e;
            color: white;
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #115e59
                );

            color: white;

            padding: 50px 18px 60px;
        }


        .hero-inner {
            max-width: 950px;
            margin: auto;

            text-align: center;
        }


        .hero h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }


        .hero p {
            font-size: 17px;
            opacity: .92;

            margin-bottom: 28px;
        }


        /* =========================
           SEARCH
        ========================== */

        .search-box {
            background: white;

            padding: 8px;

            border-radius: 15px;

            display: flex;
            gap: 8px;

            max-width: 850px;
            margin: auto;

            box-shadow:
                0 8px 30px rgba(0,0,0,.12);
        }


        .search-box input {
            flex: 1;

            border: none;
            outline: none;

            padding: 13px;

            font-size: 16px;

            color: #222;

            min-width: 0;
        }


        .search-btn {
            border: none;

            background: #0f766e;
            color: white;

            padding: 0 25px;

            border-radius: 11px;

            cursor: pointer;

            font-weight: bold;
        }


        /* =========================
           CONTAINER
        ========================== */

        .container {
            max-width: 1150px;
            margin: auto;

            padding:
                30px 18px;
        }


        .section-title {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 17px;
        }


        .section-title h2 {
            font-size: 23px;
        }


        .section-title span {
            color: #777;
            font-size: 13px;
        }


        /* =========================
           FILTERS
        ========================== */

        .filters {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-bottom: 25px;
        }


        .filters select {
            width: 100%;

            border: 1px solid #ddd;

            background: white;

            border-radius: 10px;

            padding: 12px;

            outline: none;

            font-size: 14px;
        }


        /* =========================
           CATEGORIES
        ========================== */

        .categories {
            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding-bottom: 8px;

            scrollbar-width: thin;
        }


        .category {
            flex: 0 0 auto;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 13px;

            padding: 11px 17px;

            cursor: pointer;

            transition: .2s;

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 14px;
        }


        .category:hover,
        .category.active {
            background: #0f766e;
            color: white;
        }


        /* =========================
           ADS GRID
        ========================== */

        .ads-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }


        .ad-card {
            background: white;

            border-radius: 15px;

            overflow: hidden;

            border: 1px solid #e7e7e7;

            transition:
                transform .2s,
                box-shadow .2s;
        }


        .ad-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.08);
        }


        .ad-image {
            width: 100%;
            height: 190px;

            object-fit: cover;

            background: #eee;
        }


        .no-image {
            width: 100%;
            height: 190px;

            background: #eef2f2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
        }


        .ad-content {
            padding: 14px;
        }


        .ad-category {
            color: #0f766e;

            font-size: 12px;

            margin-bottom: 4px;
        }


        .ad-title {
            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;

            display: -webkit-box;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .ad-description {
            color: #777;

            font-size: 13px;

            display: -webkit-box;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;

            margin-bottom: 9px;
        }


        .ad-price {
            font-size: 17px;

            font-weight: bold;

            color: #0f766e;
        }


        .ad-location {
            color: #777;

            font-size: 12px;

            margin-top: 4px;
        }


        .view-ad {
            display: block;

            text-align: center;

            background: #f0f7f6;

            color: #0f766e;

            margin-top: 11px;

            padding: 8px;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {
            text-align: center;

            padding: 45px;

            color: #777;
        }


        .empty {
            background: white;

            border-radius: 15px;

            padding: 45px 20px;

            text-align: center;

            color: #777;
        }


        .empty-icon {
            font-size: 45px;

            margin-bottom: 8px;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            margin-top: 30px;

            background: #123b39;

            color: white;

            padding: 35px 18px;

            text-align: center;
        }


        footer .footer-logo {
            font-size: 25px;
            font-weight: bold;
        }


        footer p {
            opacity: .8;

            font-size: 13px;

            margin-top: 5px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 900px) {

            .ads-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }


        @media (max-width: 650px) {

            .header-inner {
                padding: 10px 12px;
            }


            .logo-text {
                font-size: 21px;
            }


            .logo-icon {
                width: 40px;
                height: 40px;
            }


            .btn {
                padding: 8px 10px;

                font-size: 12px;
            }


            /*
              لا نخفي زر إضافة الإعلان
              لأن الموقع الآن مجاني
            */

            .btn-add {
                display: block;
            }


            .hero {
                padding:
                    35px 14px 42px;
            }


            .hero h1 {
                font-size: 28px;
            }


            .hero p {
                font-size: 14px;
            }


            .search-box {
                padding: 6px;
            }


            .search-box input {
                padding: 11px 8px;

                font-size: 14px;
            }


            .search-btn {
                padding: 0 15px;
            }


            .filters {
                grid-template-columns: 1fr;
            }


            .ads-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }


            .ad-image,
            .no-image {
                height: 145px;
            }


            .ad-content {
                padding: 10px;
            }


            .ad-title {
                font-size: 15px;
            }


            .ad-price {
                font-size: 15px;
            }

        }


        @media (max-width: 380px) {

            .ads-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

            <div class="logo-icon">

            <div>

                    صلة
                </div>


                <div class="logo-subtitle">

                </div>

            </div>


        </a>



        <div class="header-buttons">
