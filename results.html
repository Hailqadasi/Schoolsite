* {

}

body {

/* =========================

========================= */

========================= */

table {

}

.single-table {

}

th,
td {
    border: 1px solid #d1d5db;

}

th {

    font-weight: bold;

    background: #eef2f7;
}

    padding: 15px;
    border-radius: 10px;

.empty {

.small {

/* =========================
   الهاتف

@media(max-width:600px) {

    header h1 {

    }

    }

    .single-table th,

        padding: 10px 5px;

    }

    .single-table th:first-child,
    .single-table td:first-child {
        width: 65%;
    }

    .single-table th:last-child,
    .single-table td:last-child {
        width: 35%;
    }

    .aggregate-table th,
    .aggregate-table td {
        padding: 8px 6px;
        font-size: 14px;
    }

}

</style>

<script>

// =====================================================
// إعداد Supabase
// =====================================================

const SUPABASE_URL =
    "https://ilplwdhwsziuxynvneov.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KALdRLu6_CyNGXP7RWecLQ_mN1JlrJi";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// المدرسة الحالية
// =====================================================

let SCHOOL_ID = null;

let SCHOOL_NAME = "";


// =====================================================
// تحميل المدارس
// =====================================================

async function loadSchools() {

    const schoolSelect =
        document.getElementById("schoolName");

    const schoolHeader =
        document.getElementById("schoolHeader");


    schoolSelect.innerHTML =
        `<option value="">
            ⏳ جاري تحميل المدارس...
        </option>`;


    const { data, error } =
        await supabaseClient

        .from("schools")

        .select("id, school_name")

        .order("school_name", {
            ascending: true
        });


    if (error) {

        console.error(
            "Schools Error:",
            error
        );

        schoolSelect.innerHTML =
            `<option value="">
                ❌ تعذر تحميل المدارس
            </option>`;

        schoolHeader.textContent =
            "تعذر تحميل المدارس";

        return;
    }


    schoolSelect.innerHTML =
        `<option value="">
            🏫 اختر المدرسة
        </option>`;


    if (
        !data ||
        data.length === 0
    ) {

        schoolSelect.innerHTML =
            `<option value="">
                لا توجد مدارس
            </option>`;

        return;
    }


    data.forEach(
        function(school) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                school.id;

            option.textContent =
                school.school_name;

            schoolSelect.appendChild(
                option
            );

        }
    );

}


// =====================================================
// تغيير المدرسة
// =====================================================

document
.getElementById("schoolName")
.addEventListener(
    "change",
    function() {

        const selectedId =
            this.value;


        const schoolHeader =
            document.getElementById(
                "schoolHeader"
            );


        if (!selectedId) {

            SCHOOL_ID = null;

            SCHOOL_NAME = "";

            schoolHeader.textContent =
                "اختر المدرسة لعرض النتائج";

            document.getElementById(
                "results"
            ).innerHTML = "";

            return;
        }


        SCHOOL_ID =
            Number(selectedId);


        SCHOOL_NAME =
            this.options[
                this.selectedIndex
            ].textContent;


        schoolHeader.textContent =
            SCHOOL_NAME;


        document.getElementById(
            "results"
        ).innerHTML = "";

    }
);


// =====================================================
// المواد حسب الصف
// =====================================================

function getSubjects(className) {

    // الأول والثاني الأساسي

    if (
        className === "الصف الأول الأساسي" ||
        className === "الصف الثاني الأساسي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم"

        ];

    }


    // الثالث إلى السادس الأساسي

    if (
        className === "الصف الثالث الأساسي" ||
        className === "الصف الرابع الأساسي" ||
        className === "الصف الخامس الأساسي" ||
        className === "الصف السادس الأساسي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم",
            "اجتماعات"

        ];

    }


    // السابع إلى التاسع الأساسي

    if (
        className === "الصف السابع الأساسي" ||
        className === "الصف الثامن الأساسي" ||
        className === "الصف التاسع الأساسي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "علوم",
            "اجتماعات"

        ];

    }


    // الأول الثانوي

    if (
        className === "الصف الأول الثانوي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء",
            "جغرافيا",
            "تاريخ",
            "مجتمع"

        ];

    }


    // الثاني والثالث الثانوي

    if (
        className === "الصف الثاني الثانوي" ||
        className === "الصف الثالث الثانوي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء"

        ];

    }


    return [];

}


// =====================================================
// تحويل JSONB إلى كائن
// =====================================================

function parseScores(data) {

    if (
        data === null ||
        data === undefined ||
        data === ""
    ) {

        return {};

    }


    if (
        typeof data === "object"
    ) {

        return data;

    }


    if (
        typeof data === "string"
    ) {

        try {

            const parsed =
                JSON.parse(data);

            if (
                parsed &&
                typeof parsed === "object"
            ) {

                return parsed;

            }

        }

        catch (error) {

            console.log(
                "JSON parse error:",
                error
            );

        }

    }


    return {};

}


// =====================================================
// توحيد النص
// =====================================================

function normalizeText(text) {

    return String(text ?? "")
        .trim()
        .replace(/\s+/g, " ")
        .replace(/ـ/g, "")
        .replace(/\u200f/g, "")
        .replace(/\u200e/g, "")
        .replace(
            /[\u064B-\u065F\u0670]/g,
            ""
        );

}


// =====================================================
// توحيد اسم المادة
// =====================================================

function normalizeSubject(text) {

    let value =
        normalizeText(text);


    value =
        value.replace(
            /أ/g,
            "ا"
        );

    value =
        value.replace(
            /إ/g,
            "ا"
        );

    value =
        value.replace(
            /آ/g,
            "ا"
        );


    if (
        value === "عربي" ||
        value === "العربي" ||
        value === "لغةالعربية" ||
        value === "اللغةالعربية"
    ) {

        return "لغة عربية";

    }


    if (
        value === "اسلامية" ||
        value === "إسلاميه" ||
        value === "اسلاميه" ||
        value === "الإسلامية"
    ) {

        return "إسلامية";

    }


    if (
        value === "قران" ||
        value === "القران" ||
        value === "القرآن"
    ) {

        return "قرآن";

    }


    if (
        value === "علوم" ||
        value === "العلوم"
    ) {

        return "علوم";

    }


    if (
        value === "رياضيات" ||
        value === "الرياضيات"
    ) {

        return "رياضيات";

    }


    return value;

}


// =====================================================
// الحصول على درجة المادة
// =====================================================

function getSubjectScore(
    scores,
    subject
) {

    if (
        !scores ||
        typeof scores !== "object"
    ) {

        return null;

    }


    if (
        Object.prototype.hasOwnProperty.call(
            scores,
            subject
        )
    ) {

        const value =
            Number(scores[subject]);


        if (
            !isNaN(value)
        ) {

            return value;

        }

    }


    const wanted =
        normalizeSubject(subject);


    const keys =
        Object.keys(scores);


    for (
        let i = 0;
        i < keys.length;
        i++
    ) {

        const key =
            keys[i];


        if (
            normalizeSubject(key) === wanted
        ) {

            const value =
                Number(scores[key]);


            if (
                !isNaN(value)
            ) {

                return value;

            }

        }

    }


    return null;

}


// =====================================================
// بيانات الفترة
// =====================================================

function getPeriodScores(
    row,
    period
) {

    let data = null;

    let title = "";


    if (
        period === "9"
    ) {

        data =
            row.september;

        title =
            "سبتمبر";

    }

    else if (
        period === "10"
    ) {

        data =
            row.october;

        title =
            "أكتوبر";

    }

    else if (
        period === "11"
    ) {

        data =
            row.november;

        title =
            "نوفمبر";

    }

    else if (
        period === "1"
    ) {

        data =
            row.january;

        title =
            "يناير";

    }

    else if (
        period === "2"
    ) {

        data =
            row.february;

        title =
            "فبراير";

    }

    else if (
        period === "3"
    ) {

        data =
            row.march;

        title =
            "مارس";

    }

    else if (
        period === "first_half"
    ) {

        data =
            row.first_half;

        title =
            "درجة النصف الأول";

    }

    else if (
        period === "second_half"
    ) {

        data =
            row.second_half;

        title =
            "درجة النصف الثاني";

    }


    return {

        scores:
            parseScores(data),

        title:
            title

    };

}


// =====================================================
// البحث عن الطالب
// =====================================================

async function searchStudent() {

    const studentName =
        document
        .getElementById("studentName")
        .value
        .trim();


    const className =
        document
        .getElementById("className")
        .value;


    const period =
        document
        .getElementById("period")
        .value;


    const status =
        document
        .getElementById("status");


    const results =
        document
        .getElementById("results");


    results.innerHTML = "";


    if (
        !SCHOOL_ID
    ) {

        status.innerHTML =
            "⚠️ اختر المدرسة أولاً";

        return;

    }


    if (
        !studentName
    ) {

        status.innerHTML =
            "⚠️ اكتب اسم الطالب أولاً";

        return;

    }


    status.innerHTML =
        "⏳ جاري البحث...";


    try {

        const response =
            await supabaseClient

            .from("student_results")

            .select("*")

            .eq(
                "school_id",
                SCHOOL_ID
            )

            .eq(
                "class_name",
                className
            )

            .ilike(
                "student_name",
                "%" +
                studentName +
                "%"
            );


        if (
            response.error
        ) {

            throw response.error;

        }


        const data =
            response.data;


        if (
            !data ||
            data.length === 0
        ) {

            results.innerHTML = `

                <div class="card empty">

                    ❌ لم يتم العثور على الطالب

                </div>

            `;

            status.innerHTML = "";

            return;

        }


        const row =
            data[0];


        const subjects =
            getSubjects(
                className
            );


        // محصلة أول ثلاثة أشهر

        if (
            period === "first_total"
        ) {

            results.innerHTML =
                buildFirstTotal(
                    row,
                    subjects
                );

        }


        // النتيجة النهائية للفصل الأول

        else if (
            period === "first_final"
        ) {

            results.innerHTML =
                buildFirstSemesterFinal(
                    row,
                    subjects
                );

        }


        // محصلة آخر ثلاثة أشهر

        else if (
            period === "last_total"
        ) {

            results.innerHTML =
                buildLastTotal(
                    row,
                    subjects
                );

        }


        // النتيجة النهائية

        else if (
            period === "final"
        ) {

            results.innerHTML =
                buildFinalResult(
                    row,
                    subjects
                );

        }


        // شهر أو نصف

        else {

            results.innerHTML =
                buildSingleResult(
                    row,
                    subjects,
                    period
                );

        }


        status.innerHTML = "";

    }

    catch (error) {

        console.error(
            "Supabase Error:",
            error
        );

        status.innerHTML =
            "❌ حدث خطأ أثناء الاتصال بقاعدة البيانات";

    }

}


// =====================================================
// عرض شهر أو نصف
// =====================================================

function buildSingleResult(
    row,
    subjects,
    period
) {

    const periodData =
        getPeriodScores(
            row,
            period
        );


    const scores =
        periodData.scores;


    const title =
        periodData.title;


    let html = `

        <div class="card student-card">

            <div class="student-title">

                👨‍🎓
                ${escapeHtml(
                    row.student_name
                )}

            </div>


            <div class="info">

                🏫 المدرسة:

                <strong>

                    ${escapeHtml(
                        SCHOOL_NAME
                    )}

                </strong>

            </div>


            <div class="info">

                الصف:

                <strong>

                    ${escapeHtml(
                        row.class_name
                    )}

                </strong>

            </div>


            <div class="info">

                الفترة:

                <strong>

                    ${escapeHtml(
                        title
                    )}

                </strong>

            </div>


            <div class="table-wrap single-table">

                <table>

                    <thead>

                        <tr>

                            <th>
                                المادة
                            </th>

                            <th>
                                الدرجة
                            </th>

                        </tr>

                    </thead>

                    <tbody>

    `;


    let total = 0;


    subjects.forEach(
        function(subject) {

            const value =
                getSubjectScore(
                    scores,
                    subject
                );


            if (
                value !== null &&
                !isNaN(value)
            ) {

                total += value;

            }


            html += `

                <tr>

                    <td>

                        ${escapeHtml(
                            subject
                        )}

                    </td>

                    <td>

                        ${
                            value === null ||
                            isNaN(value)

                            ? "—"

                            : formatNumber(
                                value
                            )
                        }

                    </td>

                </tr>

            `;

        }
    );


    html += `

                <tr class="total">

                    <td>
                        المجموع
                    </td>

                    <td>

                        ${formatNumber(
                            total
                        )}

                    </td>

                </tr>

                    </tbody>

                </table>

            </div>

        </div>

    `;


    return html;

}


// =====================================================
// محصلة الأشهر الثلاثة الأولى
// =====================================================

function buildFirstTotal(
    row,
    subjects
) {

    const sep =
        parseScores(
            row.september
        );


    const oct =
        parseScores(

// =====================================================
// تنسيق الأرقام
// =====================================================

function formatNumber(number) {

    return Number(number).toFixed(2);

}


// =====================================================
// حماية النصوص
// =====================================================

function escapeHtml(text) {

    return String(text ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
