<script>


// =====================================================
// إعداد Supabase
// =====================================================

const SUPABASE_URL =
    "https://ilplwdhwsziuxynvneov.supabase.co";


const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlscGx3ZGh3c3ppdXh5bnZuZW92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTY3MjAsImV4cCI6MjEwNDkzMjcyMH0.t7B3sFPgNhATnqbw2XGRoHWxKO0klw4Uyk83XJEt7as";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const SCHOOL_NAME =
    "مدرسة الفتح بطنة قدس";



// =====================================================
// المواد حسب الصف
// =====================================================

function getSubjects(className) {


    // الأول والثاني الأساسي

    if (
        className === "الصف الأول الأساسي" ||
        className === "الصف الثاني الأساسي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم"

        ];

    }



    // الثالث إلى السادس الأساسي

    if (
        className === "الصف الثالث الأساسي" ||
        className === "الصف الرابع الأساسي" ||
        className === "الصف الخامس الأساسي" ||
        className === "الصف السادس الأساسي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم",
            "اجتماعات"

        ];

    }



    // السابع إلى التاسع الأساسي

    if (
        className === "الصف السابع الأساسي" ||
        className === "الصف الثامن الأساسي" ||
        className === "الصف التاسع الأساسي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "علوم",
            "اجتماعات"

        ];

    }



    // الأول الثانوي

    if (
        className === "الصف الأول الثانوي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء",
            "جغرافيا",
            "تاريخ",
            "مجتمع"

        ];

    }



    // الثاني والثالث الثانوي

    if (
        className === "الصف الثاني الثانوي" ||
        className === "الصف الثالث الثانوي"
    ) {

        return [

            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء"

        ];

    }


    return [];

}



// =====================================================
// تحويل JSONB إلى كائن
// =====================================================

function parseScores(data) {


    if (
        data === null ||
        data === undefined ||
        data === ""
    ) {

        return {};

    }



    // Supabase يعيد JSONB ككائن

    if (
        typeof data === "object"
    ) {

        return data;

    }



    // في حال عاد كنص

    if (
        typeof data === "string"
    ) {

        try {

            const parsed =
                JSON.parse(data);


            if (
                parsed &&
                typeof parsed === "object"
            ) {

                return parsed;

            }

        }

        catch (error) {

            console.log(
                "JSON parse error:",
                error
            );

        }

    }


    return {};

}



// =====================================================
// توحيد اسم المادة
// =====================================================

function normalizeSubject(text) {

    return String(text)

        .trim()

        .replace(/\s+/g, " ")

        .replace(/ـ/g, "")

        .replace(/\u200f/g, "")

        .replace(/\u200e/g, "");

}



// =====================================================
// الحصول على درجة المادة
// =====================================================

function getSubjectScore(
    scores,
    subject
) {


    if (
        !scores ||
        typeof scores !== "object"
    ) {

        return null;

    }



    // البحث المباشر

    if (
        Object.prototype.hasOwnProperty.call(
            scores,
            subject
        )
    ) {

        const value =
            Number(scores[subject]);


        if (
            !isNaN(value)
        ) {

            return value;

        }

    }



    // البحث بعد توحيد الاسم

    const wanted =
        normalizeSubject(subject);


    const keys =
        Object.keys(scores);


    for (
        let i = 0;
        i < keys.length;
        i++
    ) {

        const key =
            keys[i];


        if (
            normalizeSubject(key) === wanted
        ) {

            const value =
                Number(scores[key]);


            if (
                !isNaN(value)
            ) {

                return value;

            }

        }

    }


    return null;

}



// =====================================================
// بيانات الفترة
// =====================================================

function getPeriodScores(
    row,
    period
) {


    let data = null;

    let title = "";



    if (
        period === "9"
    ) {

        data =
            row.september;

        title =
            "سبتمبر";

    }


    else if (
        period === "10"
    ) {

        data =
            row.october;

        title =
            "أكتوبر";

    }


    else if (
        period === "11"
    ) {

        data =
            row.november;

        title =
            "نوفمبر";

    }


    else if (
        period === "1"
    ) {

        data =
            row.january;

        title =
            "يناير";

    }


    else if (
        period === "2"
    ) {

        data =
            row.february;

        title =
            "فبراير";

    }


    else if (
        period === "3"
    ) {

        data =
            row.march;

        title =
            "مارس";

    }


    else if (
        period === "first_half"
    ) {

        data =
            row.first_half;

        title =
            "درجة النصف الأول";

    }


    else if (
        period === "second_half"
    ) {

        data =
            row.second_half;

        title =
            "درجة النصف الثاني";

    }



    return {

        scores:
            parseScores(data),

        title:
            title

    };

}



// =====================================================
// البحث عن الطالب
// =====================================================

async function searchStudent() {


    const studentName =
        document
        .getElementById("studentName")
        .value
        .trim();


    const className =
        document
        .getElementById("className")
        .value;


    const period =
        document
        .getElementById("period")
        .value;


    const status =
        document
        .getElementById("status");


    const results =
        document
        .getElementById("results");


    results.innerHTML = "";



    if (
        !studentName
    ) {

        status.innerHTML =
            "⚠️ اكتب اسم الطالب أولاً";

        return;

    }



    status.innerHTML =
        "⏳ جاري البحث...";



    try {


        const response =
            await supabaseClient

            .from("student_results")

            .select("*")

            .eq(
                "school_name",
                SCHOOL_NAME
            )

            .eq(
                "class_name",
                className
            )

            .ilike(
                "student_name",
                "%" +
                studentName +
                "%"
            );



        if (
            response.error
        ) {

            throw response.error;

        }



        const data =
            response.data;



        if (
            !data ||
            data.length === 0
        ) {


            results.innerHTML = `

                <div class="card empty">

                    ❌ لم يتم العثور على الطالب

                </div>

            `;


            status.innerHTML = "";

            return;

        }



        const row =
            data[0];


        const subjects =
            getSubjects(
                className
            );



        // محصلة أول ثلاثة أشهر

        if (
            period === "first_total"
        ) {

            results.innerHTML =
                buildFirstTotal(
                    row,
                    subjects
                );

        }



        // محصلة آخر ثلاثة أشهر

        else if (
            period === "last_total"
        ) {

            results.innerHTML =
                buildLastTotal(
                    row,
                    subjects
                );

        }



        // النتيجة النهائية

        else if (
            period === "final"
        ) {

            results.innerHTML =
                buildFinalResult(
                    row,
                    subjects
                );

        }



        // شهر أو نصف

        else {

            results.innerHTML =
                buildSingleResult(
                    row,
                    subjects,
                    period
                );

        }



        status.innerHTML = "";


    }

    catch (error) {


        console.log(
            "Supabase Error:",
            error
        );


        status.innerHTML =
            "❌ حدث خطأ أثناء الاتصال بقاعدة البيانات";


    }

}



// =====================================================
// عرض شهر أو نصف
// =====================================================

function buildSingleResult(
    row,
    subjects,
    period
) {


    const periodData =
        getPeriodScores(
            row,
            period
        );


    const scores =
        periodData.scores;


    const title =
        periodData.title;



    let html = `

        <div class="card student-card">


            <div class="student-title">

                👨‍🎓
                ${escapeHtml(
                    row.student_name
                )}

            </div>



            <div class="info">

                الصف:

                <strong>

                    ${escapeHtml(
                        row.class_name
                    )}

                </strong>

            </div>



            <div class="info">

                الفترة:

                <strong>

                    ${title}

                </strong>

            </div>



            <div class="table-wrap single-table">


                <table>


                    <thead>

                        <tr>

                            <th>
                                المادة
                            </th>

                            <th>
                                الدرجة
                            </th>

                        </tr>

                    </thead>


                    <tbody>

    `;



    let total = 0;



    subjects.forEach(
        function(subject) {


            const value =
                getSubjectScore(
                    scores,
                    subject
                );



            if (
                value !== null &&
                !isNaN(value)
            ) {

                total += value;

            }



            html += `

                <tr>

                    <td>

                        ${escapeHtml(
                            subject
                        )}

                    </td>


                    <td>

                        ${
                            value === null ||
                            isNaN(value)

                            ? "—"

                            : formatNumber(
                                value
                            )
                        }

                    </td>

                </tr>

            `;

        }
    );



    html += `

                <tr class="total">

                    <td>

                        المجموع

                    </td>


                    <td>

                        ${formatNumber(
                            total
                        )}

                    </td>

                </tr>


                    </tbody>


                </table>


            </div>


        </div>

    `;



    return html;

}



// =====================================================
// محصلة الأشهر الثلاثة الأولى
// =====================================================

function buildFirstTotal(
    row,
    subjects
) {


    const sep =
        parseScores(
            row.september
        );


    const oct =
        parseScores(
            row.october
        );


    const nov =
        parseScores(
            row.november
        );



    let html = `

        <div class="card student-card">


            <div class="student-title">

                👨‍🎓
                ${escapeHtml(
                    row.student_name
                )}

            </div>



            <div class="info">

                الصف:

                <strong>

                    ${escapeHtml(
                        row.class_name
                    )}

                </strong>

            </div>



            <div class="info">

                📊 محصلة الأشهر الثلاثة الأولى

            </div>



            <div class="table-wrap">


                <table class="aggregate-table">


                    <thead>

                        <tr>

                            <th>
                                المادة
                            </th>

                            <th>
                                سبتمبر
                            </th>

                            <th>
                                أكتوبر
                            </th>

                            <th>
                                نوفمبر
                            </th>

                            <th>
                                المحصلة
                            </th>

                        </tr>

                    </thead>


                    <tbody>

    `;



    subjects.forEach(
        function(subject) {


            const a =
                getSubjectScore(
                    sep,
                    subject
                ) ?? 0;


            const b =
                getSubjectScore(
                    oct,
                    subject
                ) ?? 0;


            const c =
                getSubjectScore(
                    nov,
                    subject
                ) ?? 0;


            const result =
                (
                    a +
                    b +
                    c
                ) / 15;



            html += `

                <tr>

                    <td>

                        ${escapeHtml(
                            subject
                        )}

                    </td>


                    <td>

                        ${formatNumber(a)}

                    </td>


                    <td>

                        ${formatNumber(b)}

                    </td>


                    <td>

                        ${formatNumber(c)}

                    </td>


                    <td>

                        <strong>

                            ${formatNumber(
                                result
                            )}

                        </strong>

                    </td>

                </tr>

            `;

        }
    );



    html += `

                    </tbody>

                </table>


            </div>



            <p class="small">

                المحصلة لكل مادة =

                (سبتمبر + أكتوبر + نوفمبر) ÷ 15

            </p>


        </div>

    `;



    return html;

}

            const result =

            html += `

                    <td>

                        ${escapeHtml(
                            subject
                        )}

                    </td>


                    <td>

                        ${formatNumber(a)}

                    </td>


                    <td>

                        ${formatNumber(b)}

                    </td>


                    <td>

                        ${formatNumber(c)}

                    </td>


                    <td>

                        <strong>

                            ${formatNumber(
                                result
                            )}

                        </strong>

                    </td>

                </tr>

            `;

        }
    );



    html += `

                    </tbody>

                </table>


            </div>



            <p class="small">

                المحصلة لكل مادة =

                (يناير + فبراير + مارس) ÷ 15

            </p>


        </div>

    `;



    return html;

}



// =====================================================
// النتيجة النهائية
// =====================================================

function buildFinalResult(
    row,
    subjects
) {


    const sep =
        parseScores(
            row.september
        );


    const oct =
        parseScores(
            row.october
        );


    const nov =
        parseScores(
            row.november
        );


    const jan =
        parseScores(
            row.january
        );


    const feb =
        parseScores(
            row.february
        );


    const mar =
        parseScores(
            row.march
        );


    const first =
        parseScores(
            row.first_half
        );


    const second =
        parseScores(
            row.second_half
        );



    let html = `

        <div class="card student-card">


            <div class="student-title">

                🏆 النتيجة النهائية

            </div>



            <div class="info">

                الطالب:

                <strong>

                    ${escapeHtml(
                        row.student_name
                    )}

                </strong>

            </div>



            <div class="info">

                الصف:

                <strong>

                    ${escapeHtml(
                        row.class_name
                    )}

                </strong>

            </div>



            <div class="table-wrap">


                <table class="aggregate-table">


                    <thead>

                        <tr>

                            <th>
                                المادة
                            </th>

                            <th>
                                محصلة أول 3 أشهر
                            </th>

                            <th>
                                النصف الأول
                            </th>

                            <th>
                                محصلة آخر 3 أشهر
                            </th>

                            <th>
                                النصف الثاني
                            </th>

                            <th>
                                النتيجة النهائية
                            </th>

                        </tr>

                    </thead>


                    <tbody>

    `;



    let finalTotal = 0;



    subjects.forEach(
        function(subject) {


            const firstTotal =
                (

                    (
                        getSubjectScore(
                            sep,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            oct,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            nov,
                            subject
                        ) ?? 0
                    )

                ) / 15;



            const lastTotal =
                (

                    (
                        getSubjectScore(
                            jan,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            feb,
                            subject
                        ) ?? 0
                    )

                    +

                    (
                        getSubjectScore(
                            mar,
                            subject
                        ) ?? 0
                    )

                ) / 15;



            const firstHalf =
                getSubjectScore(
                    first,
                    subject
                ) ?? 0;



            const secondHalf =
                getSubjectScore(
                    second,
                    subject
                ) ?? 0;



            const finalResult =
                firstTotal +
                firstHalf +
                lastTotal +
                secondHalf;



            finalTotal +=
                finalResult;



            html += `

                <tr>


                    <td>

                        ${escapeHtml(
                            subject
                        )}

                    </td>


                    <td>

                        ${formatNumber(
                            firstTotal
                        )}

                    </td>


                    <td>

                        ${formatNumber(
                            firstHalf
                        )}

                    </td>


                    <td>

                        ${formatNumber(
                            lastTotal
                        )}

                    </td>


                    <td>

                        ${formatNumber(
                            secondHalf
                        )}

                    </td>


                    <td>

                        <strong>

                            ${formatNumber(
                                finalResult
                            )}

                        </strong>

                    </td>


                </tr>

            `;

        }
    );



    html += `

                    </tbody>

                </table>


            </div>



            <div class="final-result">

                🏆 النتيجة النهائية:

                ${formatNumber(
                    finalTotal
                )}

            </div>



            <p class="small">

                النتيجة النهائية لكل مادة =

                محصلة الأشهر الثلاثة الأولى

                +

                درجة النصف الأول

                +

                محصلة الأشهر الثلاثة الأخيرة

                +

                درجة النصف الثاني

            </p>


        </div>

    `;



    return html;

}



// =====================================================
// تنسيق الأرقام
// =====================================================

function formatNumber(number) {

    return Number(number).toFixed(2);

}



// =====================================================
// حماية النصوص
// =====================================================

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

// البحث عند الضغط على Enter

document
.getElementById("studentName")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchStudent();

        }

    }
);
