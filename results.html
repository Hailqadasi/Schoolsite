<script>

/* =========================================================
   إعداد Supabase
========================================================= */

const SUPABASE_URL =
"https://ilplwdhwsziuxynvneov.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KALdRLu6_CyNGXP7RWecLQ_mN1JlrJi";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   المتغيرات
========================================================= */

let SCHOOL_ID = null;
let SCHOOL_NAME = "";

const SCHOOL_CACHE_KEY =
"student_results_schools_cache_v1";

const SELECTED_SCHOOL_KEY =
"student_results_selected_school";

const SCHOOL_CACHE_TIME =
10 * 60 * 1000;


/* =========================================================
   العناصر
========================================================= */

const schoolSelect =
document.getElementById("schoolSelect");

const periodSelect =
document.getElementById("periodSelect");

const classSelect =
document.getElementById("classSelect");

const studentNameInput =
document.getElementById("studentName");

const statusBox =
document.getElementById("status");

const resultsBox =
document.getElementById("results");

const searchButton =
document.getElementById("searchButton");

const schoolHeader =
document.getElementById("schoolHeader");


/* =========================================================
   تنظيف النص
========================================================= */

function normalizeText(text){

    return String(text || "")
    .replace(/ـ/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"")
    .replace(/[\u200E\u200F\u202A-\u202E]/g,"")
    .trim();

}


/* =========================================================
   توحيد أسماء المواد
========================================================= */

function normalizeSubject(subject){

    const value =
    normalizeText(subject);

    const aliases = {

        "عربي":"لغة عربية",
        "العربي":"لغة عربية",
        "اللغة العربية":"لغة عربية",
        "لغةالعربية":"لغة عربية",

        "اسلامية":"إسلامية",
        "الاسلامية":"إسلامية",
        "إسلاميه":"إسلامية",
        "اسلاميه":"إسلامية",

        "قران":"قرآن",
        "القران":"قرآن",
        "قرآن كريم":"قرآن",

        "علوم":"علوم",
        "العلوم":"علوم",

        "رياضيات":"رياضيات",
        "الرياضيات":"رياضيات"

    };

    return aliases[value] || value;
}


/* =========================================================
   المواد حسب الصف
========================================================= */

function getSubjects(className){

    if(
        className === "الصف الأول الأساسي" ||
        className === "الصف الثاني الأساسي"
    ){

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم"
        ];

    }


    if(
        className === "الصف الثالث الأساسي" ||
        className === "الصف الرابع الأساسي" ||
        className === "الصف الخامس الأساسي" ||
        className === "الصف السادس الأساسي"
    ){

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "رياضيات",
            "علوم",
            "اجتماعات"
        ];

    }


    if(
        className === "الصف السابع الأساسي" ||
        className === "الصف الثامن الأساسي" ||
        className === "الصف التاسع الأساسي"
    ){

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "علوم",
            "اجتماعات"
        ];

    }


    if(className === "الصف الأول الثانوي"){

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء",
            "جغرافيا",
            "تاريخ",
            "مجتمع"
        ];

    }


    if(
        className === "الصف الثاني الثانوي" ||
        className === "الصف الثالث الثانوي"
    ){

        return [
            "قرآن",
            "إسلامية",
            "لغة عربية",
            "انجليزي",
            "رياضيات",
            "فيزياء",
            "كيمياء",
            "أحياء"
        ];

    }


    return [];

}


/* =========================================================
   تحويل الدرجات
========================================================= */

function parseScores(value){

    if(value === null || value === undefined){
        return {};
    }

    if(typeof value === "object"){
        return value;
    }

    if(typeof value === "string"){

        try{

            return JSON.parse(value);

        }catch(error){

            return {};

        }

    }

    return {};

}


/* =========================================================
   الحصول على درجة مادة
========================================================= */

function getSubjectScore(scores, subject){

    const data =
    parseScores(scores);

    const normalizedTarget =
    normalizeSubject(subject);

    for(const key in data){

        if(
            normalizeSubject(key) ===
            normalizedTarget
        ){

            const value =
            Number(data[key]);

            return isNaN(value)
                ? 0
                : value;
        }

    }

    return 0;
}


/* =========================================================
   الحصول على درجات الفترة
========================================================= */

function getPeriodScores(row, period){

    const subjects =
    getSubjects(row.class_name);

    const result = {};

    subjects.forEach(subject => {

        if(period === "9"){

            result[subject] =
            getSubjectScore(
                row.september,
                subject
            );

        }

        else if(period === "10"){

            result[subject] =
            getSubjectScore(
                row.october,
                subject
            );

        }

        else if(period === "11"){

            result[subject] =
            getSubjectScore(
                row.november,
                subject
            );

        }

        else if(period === "1"){

            result[subject] =
            getSubjectScore(
                row.january,
                subject
            );

        }

        else if(period === "2"){

            result[subject] =
            getSubjectScore(
                row.february,
                subject
            );

        }

        else if(period === "3"){

            result[subject] =
            getSubjectScore(
                row.march,
                subject
            );

        }

        else if(period === "first_half"){

            result[subject] =
            getSubjectScore(
                row.first_half,
                subject
            );

        }

        else if(period === "second_half"){

            result[subject] =
            getSubjectScore(
                row.second_half,
                subject
            );

        }

    });

    return result;

}


/* =========================================================
   النتيجة العادية
========================================================= */

function buildSingleResult(row, period){

    return getPeriodScores(
        row,
        period
    );

}


/* =========================================================
   محصلة الأشهر الثلاثة الأولى
   (سبتمبر + أكتوبر + نوفمبر) ÷ 15
========================================================= */

function buildFirstTotal(row){

    const subjects =
    getSubjects(row.class_name);

    const result = {};

    subjects.forEach(subject => {

        const september =
        getSubjectScore(
            row.september,
            subject
        );

        const october =
        getSubjectScore(
            row.october,
            subject
        );

        const november =
        getSubjectScore(
            row.november,
            subject
        );

        result[subject] =
        (
            september +
            october +
            november
        ) / 15;

    });

    return result;

}


/* =========================================================
   النتيجة النهائية للفصل الأول
   محصلة الأشهر الثلاثة الأولى + الفصل الأول
========================================================= */

function buildFirstSemesterFinal(row){

    const subjects =
    getSubjects(row.class_name);

    const firstTotal =
    buildFirstTotal(row);

    const result = {};

    subjects.forEach(subject => {

        const firstHalf =
        getSubjectScore(
            row.first_half,
            subject
        );

        result[subject] =
        firstTotal[subject] +
        firstHalf;

    });

    return result;

}


/* =========================================================
   محصلة الأشهر الثلاثة الأخيرة
   (يناير + فبراير + مارس) ÷ 15
========================================================= */

function buildLastTotal(row){

    const subjects =
    getSubjects(row.class_name);

    const result = {};

    subjects.forEach(subject => {

        const january =
        getSubjectScore(
            row.january,
            subject
        );

        const february =
        getSubjectScore(
            row.february,
            subject
        );

        const march =
        getSubjectScore(
            row.march,
            subject
        );

        result[subject] =
        (
            january +
            february +
            march
        ) / 15;

    });

    return result;

}


/* =========================================================
   النتيجة النهائية
========================================================= */

function buildFinalResult(row){

    const subjects =
    getSubjects(row.class_name);

    const firstTotal =
    buildFirstTotal(row);

    const lastTotal =
    buildLastTotal(row);

    const result = {};

    subjects.forEach(subject => {

        const firstHalf =
        getSubjectScore(
            row.first_half,
            subject
        );

        const secondHalf =
        getSubjectScore(
            row.second_half,
            subject
        );

        result[subject] =
        firstTotal[subject] +
        firstHalf +
        lastTotal[subject] +
        secondHalf;

    });

    return result;

}


/* =========================================================
   تنسيق الرقم
========================================================= */

function formatNumber(value){

    const number =
    Number(value);

    if(isNaN(number)){
        return "0";
    }

    return number.toFixed(2)
    .replace(/\.00$/,"")
    .replace(/(\.\d)0$/,"$1");

}


/* =========================================================
   حماية HTML
========================================================= */

function escapeHtml(text){

    return String(text)
    .replace(/&/g,"&")
    .replace(/</g,"<")
    .replace(/>/g,">")
    .replace(/"/g,""")
    .replace(/'/g,"'");

}


/* =========================================================
   رسم قائمة المدارس
========================================================= */

function renderSchools(schools){

    const previousSchool =
    localStorage.getItem(
        SELECTED_SCHOOL_KEY
    );

    schoolSelect.innerHTML = "";

    if(!schools || schools.length === 0){

        schoolSelect.innerHTML =
        '<option value="">لا توجد مدارس</option>';

        SCHOOL_ID = null;
        SCHOOL_NAME = "";

        schoolHeader.textContent =
        "نتائج الطلاب";

        return;
    }


    schools.forEach(school => {

        const option =
        document.createElement("option");

        option.value =
        school.id;

        option.textContent =
        school.school_name;

        schoolSelect.appendChild(option);

    });


    let selectedSchool =
    schools.find(
        school =>
        String(school.id) ===
        String(previousSchool)
    );


    if(!selectedSchool){
        selectedSchool =
        schools[0];
    }


    schoolSelect.value =
    selectedSchool.id;

    SCHOOL_ID =
    selectedSchool.id;

    SCHOOL_NAME =
    selectedSchool.school_name;

    schoolHeader.textContent =
    SCHOOL_NAME;

}


/* =========================================================
   جلب المدارس من Supabase
========================================================= */

async function fetchSchools(){

    try{

        const response =
        await supabaseClient
        .from("schools")
        .select("id, school_name")
        .order("school_name",{ascending:true});


        if(response.error){
            throw response.error;
        }


        const schools =
        response.data || [];


        localStorage.setItem(
            SCHOOL_CACHE_KEY,
            JSON.stringify({
                time:Date.now(),
                data:schools
            })
        );


        renderSchools(schools);


    }catch(error){

        console.error(
            "خطأ في تحميل المدارس:",
            error
        );


        /*
           إذا كانت هناك بيانات قديمة
           فلا نحذفها.
        */

        if(
            !SCHOOL_ID &&
            schoolSelect.options.length <= 1
        ){

            statusBox.innerHTML =
            '<div class="error">تعذر تحميل المدارس. تأكد من الاتصال بالإنترنت.</div>';

        }

    }

}


/* =========================================================
   تحميل المدارس بسرعة
========================================================= */

async function loadSchools(){

    let cached = null;

    try{

        const saved =
        localStorage.getItem(
            SCHOOL_CACHE_KEY
        );

        if(saved){

            cached =
            JSON.parse(saved);

        }

    }catch(error){

        cached = null;

    }


    /*
       عرض البيانات المخزنة فوراً
    */

    if(
        cached &&
        Array.isArray(cached.data) &&
        cached.data.length > 0
    ){

        renderSchools(
            cached.data
        );

    }
    else{

        schoolSelect.innerHTML =
        '<option value="">جاري تحميل المدارس...</option>';

    }


    /*
       إذا كانت البيانات قديمة
       نطلب تحديثها من Supabase.
    */

    const cacheIsFresh =
    cached &&
    (Date.now() - cached.time) <
    SCHOOL_CACHE_TIME;


    if(!cacheIsFresh){

        await fetchSchools();

    }
    else{

        /*
           تحديث في الخلفية
           بدون تعطيل الصفحة
        */

        fetchSchools();

    }

}


/* =========================================================
   عند تغيير المدرسة
========================================================= */

schoolSelect.addEventListener(
    "change",
    function(){

        const selectedId =
        this.value;

        const selectedOption =
        this.options[
            this.selectedIndex
        ];

        SCHOOL_ID =
        selectedId
        ? Number(selectedId)
        : null;

        SCHOOL_NAME =
        selectedOption
        ? selectedOption.textContent
        : "";

        schoolHeader.textContent =
        SCHOOL_NAME || "نتائج الطلاب";


        if(selectedId){

            localStorage.setItem(
                SELECTED_SCHOOL_KEY,
                selectedId
            );

        }

        /*
           مسح النتيجة القديمة
           عند تغيير المدرسة
        */

        resultsBox.innerHTML = "";
        statusBox.innerHTML = "";

    }
);


/* =========================================================
   البحث عن الطالب
========================================================= */

async function searchStudent(){

    if(!SCHOOL_ID){

        statusBox.innerHTML =
        '<div class="error">اختر المدرسة أولاً.</div>';

        return;

    }


    const className =
    classSelect.value.trim();

    const studentName =
    studentNameInput.value.trim();

    const period =
    periodSelect.value;


    if(!className){

        statusBox.innerHTML =
        '<div class="error">اختر الصف أولاً.</div>';

        classSelect.focus();

        return;

    }


    if(!studentName){

        statusBox.innerHTML =
        '<div class="error">اكتب اسم الطالب.</div>';

        studentNameInput.focus();

        return;

    }


    /*
       منع الضغط المتكرر
    */

    searchButton.disabled = true;

    searchButton.textContent =
    "⏳ جاري البحث...";


    statusBox.innerHTML =
    '<div class="loading">جاري البحث عن النتيجة...</div>';

    resultsBox.innerHTML = "";


    try{

        /*
           نطلب فقط الأعمدة المطلوبة.
           هذا أسرع من select("*")
        */

        const response =
        await supabaseClient
        .from("student_results")
        .select(`
            student_name,
            class_name,
            september,
            october,
            november,
            first_half,
            january,
            february,
            march,
            second_half
        `)
        .eq("school_id", SCHOOL_ID)
        .eq("class_name", className)
        .ilike(
            "student_name",
            "%" + studentName + "%"
        )
        .limit(1);


        if(response.error){

            throw response.error;

        }


        const data =
        response.data || [];


        if(data.length === 0){

            statusBox.innerHTML =
            '<div class="error">لم يتم العثور على الطالب.</div>';

            resultsBox.innerHTML =
            '<div class="result-box empty">لا توجد نتيجة مطابقة للبيانات المدخلة.</div>';

            return;

        }


        const row =
        data[0];


        let scores;


        if(period === "first_total"){

            scores =
            buildFirstTotal(row);

        }

        else if(period === "first_final"){

            scores =
            buildFirstSemesterFinal(row);

        }

        else if(period === "last_total"){

            scores =
            buildLastTotal(row);

        }

        else if(period === "final"){

            scores =
            buildFinalResult(row);

        }

        else{

            scores =
            buildSingleResult(
                row,
                period
            );

        }


        displayResult(
            row,
            scores,
            period
        );


        statusBox.innerHTML =
        '<div class="success">تم العثور على النتيجة بنجاح.</div>';


    }catch(error){

        console.error(
            "خطأ أثناء البحث:",
            error
        );


        statusBox.innerHTML =
        '<div class="error">حدث خطأ أثناء البحث عن النتيجة.</div>';

        resultsBox.innerHTML =
        '<div class="result-box empty">تعذر الاتصال بقاعدة البيانات.</div>';

    }
    finally{

        searchButton.disabled = false;

        searchButton.textContent =
        "🔍 بحث عن النتيجة";

    }

}


/* =========================================================
   أسماء الفترات
========================================================= */

function getPeriodName(period){

    const names = {

        "9":"سبتمبر",
        "10":"أكتوبر",
        "11":"نوفمبر",

        "first_total":
        "محصلة الأشهر الثلاثة الأولى",

        "first_final":
        "النتيجة النهائية للفصل الأول",

        "1":"يناير",
        "2":"فبراير",
        "3":"مارس",

        "last_total":
        "محصلة الأشهر الثلاثة الأخيرة",

        "first_half":
        "درجة النصف الأول",

        "second_half":
        "درجة النصف الثاني",

        "final":
        "النتيجة النهائية"

    };

    return names[period] ||
    "النتيجة";

}


/* =========================================================
   عرض النتيجة
========================================================= */

function displayResult(
    row,
    scores,
    period
){

    const subjects =
    getSubjects(row.class_name);


    let html = `

        <div class="result-box">

            <div class="student-title">
                👨‍🎓 ${escapeHtml(row.student_name)}
            </div>

            <div class="school-title">
                🏫 ${escapeHtml(SCHOOL_NAME)}
                <br>
                🎓 ${escapeHtml(row.class_name)}
                <br>
                📅 ${escapeHtml(getPeriodName(period))}
            </div>

            <table>

                <thead>

                    <tr>

                        <th>
                            المادة
                        </th>

                        <th>
                            الدرجة
                        </th>

                    </tr>

                </thead>

                <tbody>
    `;


    let total = 0;


    subjects.forEach(subject => {

        const value =
        Number(scores[subject] || 0);

        total += value;


        html += `

            <tr>

                <td>
                    ${escapeHtml(subject)}
                </td>

                <td>
                    ${formatNumber(value)}
                </td>

            </tr>

        `;

    });


    html += `

                    <tr class="total-row">

                        <td>
                            المجموع
                        </td>

                        <td>
                            ${formatNumber(total)}
                        </td>

                    </tr>

                </tbody>

            </table>

            <div class="note">
                يتم حساب محصلة الأشهر الثلاثة الأولى
                بقسمة مجموع درجات سبتمبر وأكتوبر ونوفمبر
                على 15 لكل مادة.
                <br>
                ويتم حساب النتيجة النهائية وفق المعادلات المعتمدة في النظام.
            </div>

        </div>

    `;


    resultsBox.innerHTML =
    html;

}
