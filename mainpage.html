 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام نتائج الطلاب</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

/* الهيدر */

.header{
    background:#1e3a5f;
    color:white;
    text-align:center;
    padding:35px 15px;
}

.header h1{
    margin:0 0 10px;
    font-size:28px;
}

.header p{
    margin:0;
    font-size:16px;
    opacity:.95;
}

/* المحتوى */

.container{
    width:94%;
    max-width:500px;
    margin:35px auto;
}

/* البطاقة */

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.card h2{
    text-align:center;
    color:#1e3a5f;
    margin-top:0;
    margin-bottom:25px;
}

/* الأزرار */

.menu-button{
    display:block;
    width:100%;
    padding:16px;
    margin:15px 0;

    border-radius:10px;

    text-align:center;
    text-decoration:none;

    font-size:18px;
    font-weight:bold;

    transition:.2s;
}

.menu-button:hover{
    transform:translateY(-2px);
    opacity:.93;
}

/* تسجيل */

.register{
    background:#0f766e;
    color:white;
}

/* المدير */

.manager{
    background:#1e3a5f;
    color:white;
}

/* النتائج */

.results{
    background:#2563eb;
    color:white;
}

/* تذييل */

.footer{
    text-align:center;
    margin-top:25px;
    color:#64748b;
    font-size:13px;
}

</style>

</head>


<body>


<!-- الهيدر -->

<div class="header">

    <h1>📊 نظام نتائج الطلاب</h1>

    <p>
        إدارة وعرض النتائج المدرسية
    </p>

</div>


<!-- المحتوى -->

<div class="container">

    <div class="card">

        <h2>
            القائمة الرئيسية
        </h2>


        <!-- تسجيل مدرسة -->

        <a
            href="register.html"
            class="menu-button register"
        >
            🏫 تسجيل مدرسة
        </a>


        <!-- دخول المدير -->

        <a
            href="manager.html"
            class="menu-button manager"
        >
            👨‍💼 المدير
        </a>


        <!-- نتائج الطلاب -->

        <a
            href="results.html"
            class="menu-button results"
        >
            📊 نتائج الطلاب
        </a>

    </div>


    <div class="footer">

        نظام نتائج الطلاب

    </div>

</div>


</body>
</html>
