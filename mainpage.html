 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>نظام نتائج الطلاب</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

.header{
    background:#1e3a5f;
    color:white;
    text-align:center;
    padding:35px 15px;
}

.header h1{
    margin:0 0 10px;
    font-size:28px;
}

.header p{
    margin:0;
    font-size:16px;
}

.container{
    width:94%;
    max-width:500px;
    margin:35px auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.card h2{
    text-align:center;
    color:#1e3a5f;
    margin-top:0;
    margin-bottom:25px;
}

.menu-button{
    display:block;
    width:100%;
    padding:17px;
    margin:15px 0;

    border:0;
    border-radius:10px;

    text-align:center;

    font-family:inherit;
    font-size:18px;
    font-weight:bold;

    color:white;
    cursor:pointer;

    text-decoration:none;
}

.register{
    background:#0f766e;
}

.manager{
    background:#1e3a5f;
}

.results{
    background:#2563eb;
}

.menu-button:active{
    transform:scale(.98);
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#64748b;
    font-size:13px;
}

</style>

</head>


<body>


<div class="header">

    <h1>📊 نظام نتائج الطلاب</h1>

    <p>
        إدارة وعرض النتائج المدرسية
    </p>

</div>


<div class="container">

<div class="card">

    <h2>
        القائمة الرئيسية
    </h2>


    <button
        class="menu-button register"
        onclick="openPage('register.html')"
    >
        🏫 تسجيل مدرسة
    </button>


    <button
        class="menu-button manager"
        onclick="openPage('manager.html')"
    >
        👨‍💼 المدير
    </button>


    <button
        class="menu-button results"
        onclick="openPage('results.html')"
    >
        📊 نتائج الطلاب
    </button>

</div>


<div class="footer">

    نظام نتائج الطلاب

</div>

</div>


<script>

function openPage(page){

    window.location.href = page;

}

</script>


</body>

</html>
